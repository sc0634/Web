<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Profesyonel Ödeme Planı</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --navy: #0f172a; --blue: #2563eb; --gray: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; margin: 0; padding: 0; color: #1e293b; }
        
        .container { 
            width: 100%; max-width: 900px; margin: 0 auto; 
            background: #fff; padding: 25px; min-height: 100vh;
        }

        .no-print-tabs { display: flex; background: var(--navy); border-radius: 8px; padding: 4px; gap: 4px; margin-bottom: 15px; }
        .tab-link { flex: 1; padding: 10px; color: #cbd5e1; border: none; background: transparent; font-weight: 600; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .tab-link.active { background: var(--blue); color: #fff; }

        .input-grid { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: #f1f5f9; border-radius: 8px; margin-bottom: 15px; }
        .row { display: flex; gap: 10px; width: 100%; }
        .row .field { flex: 1; }

        label { font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; margin-bottom: 4px; display: block; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }

        .btn-group { display: flex; gap: 8px; margin-bottom: 20px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; color: #fff; text-transform: uppercase; }
        .btn-calc { background: #10b981; }
        .btn-pdf { background: #6366f1; }
        .btn-print { background: var(--navy); }
        button:disabled { opacity: 0.3; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8fafc; padding: 12px; text-align: center; border: 1px solid var(--border); color: var(--navy); font-size: 12px; }
        td { padding: 10px; text-align: center; border: 1px solid var(--border); font-size: 13px; }

        @media print {
            @page { size: portrait; margin: 0.5cm; }
            body { background: #fff; zoom: 98%; transform: scale(0.98); transform-origin: top center; }
            .no-print { display: none !important; }
            .container { width: 100%; padding: 0; }
            
            .print-header { 
                display: flex !important; justify-content: space-between; align-items: center;
                border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;
            }
            .print-header h1 { font-size: 18px; margin: 0; color: #000; }

            .input-grid { 
                background: #fff !important; border: 1px solid #000 !important; 
                display: block !important;
                padding: 10px !important; margin-bottom: 15px !important;
            }
            .row { display: flex !important; margin-bottom: 5px; }
            .field { border: 0.5px solid #eee; padding: 5px; flex: 1; }
            input, select { border: none !important; font-weight: bold !important; font-size: 12px !important; padding: 0 !important; height: auto; }
            label { font-size: 8px !important; color: #000 !important; }

            th { background: #f0f0f0 !important; border: 1px solid #000 !important; color: #000 !important; -webkit-print-color-adjust: exact; }
            td { border: 1px solid #000 !important; color: #000 !important; }
            .masraf-container { margin-top: 20px; border: 1px solid #000 !important; min-height: 150px !important; padding: 10px; page-break-inside: avoid; }
        }

        .print-header { display: none; }
    </style>
</head>
<body onload="vadeYukle();">

<div class="container" id="printable-area">
    
    <div class="print-header">
        <h1>KREDİ ÖDEME PLANI</h1>
        <div style="text-align: right; font-size: 10px;">
            <strong>Tarih:</strong> <span id="p-date"></span>
        </div>
    </div>

    <div class="no-print-tabs no-print">
        <button class="tab-link active" onclick="openTab(event, 'traktor')">TRAKTÖR</button>
        <button class="tab-link" onclick="openTab(event, 'ticari')">TİCARİ</button>
        <button class="tab-link" onclick="openTab(event, 'zirai')">ÇİFTÇİ</button>
        <button class="tab-link" onclick="openTab(event, 'tuketici')">TÜKETİCİ</button>
    </div>

    <div class="input-grid">
        <!-- Satır 1: Tutar ve Vade -->
        <div class="row">
            <div class="field" style="flex: 2;"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="formatTutar(this); resetButtons();"></div>
            <div class="field" style="flex: 1;"><label>Vade</label><select id="vadeSecim" onchange="resetButtons();"></select></div>
        </div>

        <!-- Satır 2: Faiz ve BSMV (Bsmv yukarı geldi) -->
        <div class="row">
            <div class="field"><label>Yıllık Faiz %</label><input type="number" id="faizYillik" value="40.50" step="0.01" oninput="resetButtons();"></div>
            <div class="field"><label>BSMV %</label><input type="number" id="bsmvOran" value="5" step="0.01" oninput="resetButtons();"></div>
        </div>

        <!-- Satır 3: Ödeme Sıklığı ve KKDF (Sıklık buraya geldi) -->
        <div class="row">
            <div class="field"><label>Ödeme Sıklığı</label><select id="periyot" onchange="resetButtons();">
                <option value="1">Yılda 1</option>
                <option value="2">6 Ayda 1</option>
                <option value="4">3 Ayda 1</option>
                <option value="12">Ayda 1</option>
            </select></div>
            <div class="field"><label>KKDF %</label><input type="number" id="kkdfOran" value="0" step="0.01" oninput="resetButtons();"></div>
        </div>

        <!-- Satır 4: Boşluk ve Sübvansiyon (KKDF Hizasına göre ayarlandı) -->
        <div class="row" id="subContainer">
            <div class="field" style="visibility: hidden;"></div> 
            <div class="field"><label>Sübvansiyon Oranı %</label><input type="number" id="subOran" value="50" oninput="resetButtons();"></div>
        </div>
    </div>

    <div class="btn-group no-print">
        <button class="btn-calc" onclick="hesapla()">HESAPLA</button>
        <button class="btn-pdf" id="btnPdf" onclick="indirPDF()" disabled>PDF</button>
        <button class="btn-print" id="btnPrint" onclick="yazdir()" disabled>YAZDIR</button>
    </div>

    <div id="sonucAlani" style="display:none;">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Taksit Tutarı</th>
                    <th>Anapara</th>
                    <th>Faiz</th>
                    <th>Vergi</th>
                    <th id="thSubCol">Sübv. Taksit</th>
                    <th>Kalan Borç</th>
                </tr>
            </thead>
            <tbody id="planBody"></tbody>
        </table>

        <div class="masraf-container">
            <strong style="font-size: 12px; text-decoration: underline;">NOTLAR VE MASRAF DETAYLARI:</strong>
        </div>
    </div>
</div>

<script>
    let currentType = 'traktor';

    function formatTutar(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
    }

    function resetButtons() {
        document.getElementById('btnPdf').disabled = true;
        document.getElementById('btnPrint').disabled = true;
    }

    function vadeYukle() {
        const select = document.getElementById('vadeSecim');
        select.innerHTML = '';
        let limit = (currentType === 'ticari' || currentType === 'zirai') ? 60 : 5;
        let suffix = (currentType === 'ticari' || currentType === 'zirai') ? " Ay" : " Yıl";
        for (let i = 1; i <= limit; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerText = i + suffix;
            if (i === limit) opt.selected = true;
            select.appendChild(opt);
        }
        document.getElementById('p-date').innerText = new Date().toLocaleDateString('tr-TR');
    }

    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        evt.currentTarget.classList.add('active');
        currentType = tabName;
        document.getElementById('subContainer').style.display = (tabName === 'traktor') ? 'flex' : 'none';
        vadeYukle(); resetButtons();
    }

    function hesapla() {
        const tVal = document.getElementById('tutar').value.replace(/\./g, "");
        const tutar = parseFloat(tVal);
        const yFaiz = parseFloat(document.getElementById('faizYillik').value) / 100;
        const sub = parseFloat(document.getElementById('subOran').value) / 100;
        const vade = parseInt(document.getElementById('vadeSecim').value);
        const per = parseInt(document.getElementById('periyot').value);
        const bsmv = parseFloat(document.getElementById('bsmvOran').value) / 100;
        const kkdf = parseFloat(document.getElementById('kkdfOran').value) / 100;

        let toplamTaksit = (currentType === 'ticari' || currentType === 'zirai') ? Math.ceil(vade / (12 / per)) : vade * per;
        const dFaiz = yFaiz / per;
        const i_vergi = dFaiz * (1 + bsmv + kkdf);
        const taksitSabit = (tutar * i_vergi * Math.pow(1+i_vergi, toplamTaksit)) / (Math.pow(1+i_vergi, toplamTaksit)-1);
        
        let body = '', kalan = tutar;
        for(let j=1; j<=toplamTaksit; j++){
            let f = kalan * dFaiz;
            let v = f * (bsmv + kkdf);
            let a = taksitSabit - (f + v);
            if(j === toplamTaksit) a = kalan;
            let t = a + f + v;
            let subT = t - ((f+v)*sub);
            kalan -= a;
            
            body += `<tr>
                <td>${j}</td>
                <td style="font-weight:bold">${Math.round(t).toLocaleString('tr-TR')}₺</td>
                <td>${Math.round(a).toLocaleString('tr-TR')}₺</td>
                <td>${Math.round(f).toLocaleString('tr-TR')}₺</td>
                <td>${Math.round(v).toLocaleString('tr-TR')}₺</td>
                <td style="${currentType==='traktor'?'':'display:none'}">${Math.round(subT).toLocaleString('tr-TR')}₺</td>
                <td style="font-weight:bold">${Math.max(0, Math.round(kalan)).toLocaleString('tr-TR')}₺</td>
            </tr>`;
        }
        document.getElementById('thSubCol').style.display = (currentType === 'traktor') ? 'table-cell' : 'none';
        document.getElementById('planBody').innerHTML = body;
        document.getElementById('sonucAlani').style.display = 'block';
        document.getElementById('btnPdf').disabled = false;
        document.getElementById('btnPrint').disabled = false;
    }

    function yazdir() { window.print(); }

    function indirPDF() {
        const element = document.getElementById('printable-area');
        html2pdf().from(element).set({
            margin: 10, filename: 'odeme-plani.pdf', html2canvas: { scale: 2 }, jsPDF: { format: 'a4', orientation: 'portrait' }
        }).save();
    }
</script>
</body>
</html>
