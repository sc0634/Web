<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Finansal Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --tarimsal: #2ecc71; --ticari: #e67e22; --bireysel: #3498db; --hakkimda: #34495e; --genel: #7f8c8d;
            --success: #27ae60; --dark: #2c3e50; --light: #ecf0f1; --border: #dcdde1;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f6fa; margin: 0; padding: 10px; color: var(--dark); font-size: 13px; }
        .container { max-width: 1000px; margin: 10px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        
        /* Navigasyon */
        .segment-nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 8px; }
        .seg-btn { flex: 1 0 auto; min-width: 100px; height: 40px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; opacity: 0.5; border:none; transition: 0.3s; }
        .seg-btn.active { opacity: 1; outline: 2px solid var(--dark); transform: scale(1.02); }
        .bg-tar { background: var(--tarimsal); } .bg-tic { background: var(--ticari); }
        .bg-bir { background: var(--bireysel); } .bg-hak { background: var(--hakkimda); } .bg-gen { background: var(--genel); }

        /* ÜFE Kartları */
        .ufe-container { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .ufe-card { background: #fff; border: 1px solid var(--border); border-bottom: 4px solid var(--tarimsal); padding: 12px; border-radius: 8px; flex: 1; min-width: 130px; text-align: center; }
        .ufe-label { display: block; font-size: 10px; text-transform: uppercase; color: #7f8c8d; font-weight: bold; }
        .ufe-val { display: block; font-size: 18px; font-weight: bold; margin: 5px 0; color: var(--dark); }
        
        /* Tablar */
        .tabs { display: none; gap: 4px; margin-bottom: 15px; border-bottom: 1px solid var(--light); padding-bottom: 8px; }
        .tab-btn { padding: 8px 15px; border: none; background: #eee; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .tab-btn.active { background: var(--dark); color: white; }
        
        .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        label { font-weight: bold; font-size: 10px; color: #57606f; text-transform: uppercase; }
        input, select, textarea { height: 40px; padding: 0 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; outline: none; background: #fff; }
        
        /* Tablo */
        .result-main-container { margin-top: 20px; border: 1px solid var(--dark); border-radius: 8px; overflow: hidden; display: none; }
        .result-main-title { background: var(--dark); color: white; padding: 12px; text-align: center; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #f1f2f6; padding: 10px; border: 1px solid #ddd; }
        td { padding: 8px; border: 1px solid #eee; text-align: center; }

        /* Başvuru Paneli */
        #apply-panel { display: none; margin-top: 30px; padding-top: 20px; border-top: 2px dashed var(--border); }
        .apply-card { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        .apply-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { height: 45px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn:active { transform: translateY(2px); }

        @media print { .no-print { display: none !important; } .container { box-shadow: none; border:none; } }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <div class="segment-nav no-print">
        <button id="seg-tar" class="seg-btn bg-tar" onclick="switchSegment('tarimsal')">TARIMSAL</button>
        <button id="seg-tic" class="seg-btn bg-tic" onclick="switchSegment('ticari')">TİCARİ</button>
        <button id="seg-bir" class="seg-btn bg-bir" onclick="switchSegment('bireysel')">BİREYSEL</button>
        <button id="seg-gen" class="seg-btn bg-gen" onclick="switchSegment('genel')">GENEL VERİLER</button>
        <button id="seg-hak" class="seg-btn bg-hak" onclick="switchSegment('hakkimda')">HAKKIMDA</button>
    </div>

    <!-- GENEL VERİLER -->
    <div id="section-genel" style="display:none;">
        <h3 style="color:var(--dark); margin-bottom:10px;">📊 Tarım-ÜFE Göstergeleri</h3>
        <div class="ufe-container">
            <div class="ufe-card"><span class="ufe-label">Bu Ay</span><span class="ufe-val">52.40%</span></div>
            <div class="ufe-card"><span class="ufe-label">Geçen Ay</span><span class="ufe-val">49.12%</span></div>
            <div class="ufe-card"><span class="ufe-label">Yılbaşı</span><span class="ufe-val">35.20%</span></div>
            <div class="ufe-card"><span class="ufe-label">Geçen Yıl</span><span class="ufe-val">61.05%</span></div>
        </div>
        <div class="grid">
            <div class="field"><label>Global Faiz %</label><input type="number" id="global-faiz" value="40.50" step="0.01"></div>
        </div>
    </div>

    <!-- HESAPLAMA PANELİ -->
    <div id="calculator-ui">
        <div class="tabs no-print" id="tabs-tarimsal">
            <button class="tab-btn" onclick="switchTab(this, 'traktor')">Traktör</button>
            <button class="tab-btn" onclick="switchTab(this, 'ekipman')">Ekipman</button>
            <button class="tab-btn" onclick="switchTab(this, 'isletme')">İşletme Kredisi</button>
        </div>
        <div class="tabs no-print" id="tabs-ticari"><button class="tab-btn active" onclick="switchTab(this, 'ticari')">Ticari İşletme</button></div>
        <div class="tabs no-print" id="tabs-bireysel"><button class="tab-btn active" onclick="switchTab(this, 'tuketici')">İhtiyaç Kredisi</button></div>

        <div class="grid no-print">
            <div class="field" id="box-prof"><label>Proforma Bedeli</label><input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)"></div>
            <div class="field"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
            <div class="field" style="width:90px"><label>Yıllık Faiz %</label><input type="number" id="faiz" value="40.50" step="0.01"></div>
            <div class="field" id="box-sub" style="width:90px"><label>İndirim %</label><input type="number" id="subOran" value="50"></div>
            <div class="field" id="box-periyot"><label>Ödeme Periyodu</label>
                <select id="periyot">
                    <option value="1">Aylık</option>
                    <option value="3">3 Ayda Bir</option>
                    <option value="6">6 Ayda Bir</option>
                    <option value="12" selected>Yıllık</option>
                </select>
            </div>
            <div class="field" id="box-vade" style="display:none; width:90px;"><label>Vade (Ay)</label><input type="number" id="vade-ay" value="12"></div>
        </div>

        <div class="actions no-print">
            <button class="btn" style="background:var(--success)" onclick="hesapla()">HESAPLA</button>
            <button class="btn" style="background:#9b59b6" id="pdfBtn" onclick="indir()" disabled>PDF</button>
            <button class="btn" style="background:var(--dark)" id="printBtn" onclick="window.print()" disabled>YAZDIR</button>
        </div>

        <div id="result-main-container" class="result-main-container">
            <div class="result-main-title">Geri Ödeme Planı</div>
            <div id="result-area" style="padding:10px;"></div>
        </div>

        <!-- BAŞVURU PANELİ (Gizli başlar, hesapla deyince açılır) -->
        <div id="apply-panel" class="no-print">
            <div class="apply-card">
                <h3 style="margin-top:0; color:var(--dark);">📩 Hızlı Başvuru Paneli</h3>
                <p style="font-size:11px; color:#7f8c8d; margin-bottom:15px;">Hesapladığınız kredi türü ve tutarı ile uzmanımıza hemen başvuru yapabilirsiniz.</p>
                <div class="apply-grid">
                    <div class="field"><label>Adınız Soyadınız</label><input type="text" placeholder="Örn: Ahmet Yılmaz"></div>
                    <div class="field"><label>Telefon Numaranız</label><input type="tel" placeholder="0(5XX) XXX XX XX"></div>
                    <div class="field"><label>İl / İlçe</label><input type="text" placeholder="Diyarbakır / Merkez"></div>
                    <div class="field" style="grid-column: span 1;"><label>İletişim Tercihi</label>
                        <select><option>Telefon ile arama</option><option>WhatsApp üzerinden</option></select>
                    </div>
                </div>
                <button class="btn" style="background:var(--dark); width:100%; margin-top:15px;" onclick="alert('Başvurunuz iletilmiştir. Süleyman Coşkun en kısa sürede sizinle iletişime geçecektir.')">BAŞVURUYU GÖNDER</button>
            </div>
        </div>
    </div>

    <div id="about-box" style="display:none; text-align:center; padding:50px;">
        <h2>Süleyman Coşkun</h2>
        <p style="color:#7f8c8d;">Bankacılık ve Tarımsal Finans Uzmanı</p>
    </div>
</div>

<script>
    let mode = 'traktor'; let segment = 'tarimsal';

    function initApp() { switchSegment('tarimsal'); }

    function switchSegment(seg) {
        segment = seg;
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('seg-' + (seg === 'genel' ? 'gen' : seg.substring(0,3))).classList.add('active');
        document.getElementById('section-genel').style.display = (seg === 'genel' ? 'block' : 'none');
        document.getElementById('calculator-ui').style.display = (seg === 'genel' || seg === 'hakkimda' ? 'none' : 'block');
        document.getElementById('about-box').style.display = (seg === 'hakkimda' ? 'block' : 'none');
        if(seg !== 'genel' && seg !== 'hakkimda') {
            document.querySelectorAll('.tabs').forEach(t => t.style.display = 'none');
            document.getElementById('tabs-' + seg).style.display = 'flex';
            document.getElementById('tabs-' + seg).querySelector('.tab-btn').click();
        }
    }

    function switchTab(btn, m) {
        mode = m;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('box-prof').style.display = (mode === 'traktor' || mode === 'ekipman' ? 'flex' : 'none');
        document.getElementById('box-sub').style.display = (mode === 'traktor' || mode === 'ekipman' ? 'flex' : 'none');
        document.getElementById('box-periyot').style.display = (segment === 'tarimsal' ? 'none' : 'flex');
        document.getElementById('box-vade').style.display = (segment === 'tarimsal' ? 'none' : 'flex');
        document.getElementById('faiz').value = (segment === 'tarimsal' ? document.getElementById('global-faiz').value : 46.00);
        if(mode === 'traktor') document.getElementById('subOran').value = 50;
        if(mode === 'ekipman') document.getElementById('subOran').value = 75;
        reset();
    }

    function fmtMoney(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
        reset();
    }

    function reset() { 
        document.getElementById('result-main-container').style.display = 'none';
        document.getElementById('apply-panel').style.display = 'none';
        document.getElementById('pdfBtn').disabled = true; document.getElementById('printBtn').disabled = true; 
    }

    function hesapla() {
        const res = document.getElementById('result-area');
        res.innerHTML = '';
        const anaPara = parseFloat(document.getElementById('tutar').value.replace(/\./g, "")) || 0;
        const yF = document.getElementById('faiz').value / 100;
        const subO = (mode === 'traktor' || mode === 'ekipman') ? document.getElementById('subOran').value / 100 : 0;
        let vades = (segment === 'tarimsal') ? [5, 3, 1] : [parseInt(document.getElementById('vade-ay').value)];
        let p = (segment === 'tarimsal') ? 12 : parseInt(document.getElementById('periyot').value);

        vades.forEach(v => {
            let tSayisi = (segment === 'tarimsal') ? v : Math.ceil(v / p);
            let dF = (yF / 12) * p;
            let taksit = (anaPara * dF * Math.pow(1+dF, tSayisi)) / (Math.pow(1+dF, tSayisi)-1);
            let html = `<div style="margin-bottom:15px"><strong>Vade: ${v} ${segment==='tarimsal'?'Yıl':'Ay'}</strong><table><thead><tr><th>Tks</th><th>Ana Para</th><th>Brüt Faiz</th>${subO>0?'<th>İndirim</th>':''}<th>Taksit</th><th>Kalan</th></tr></thead><tbody>`;
            let kalan = anaPara;
            for(let i=1; i<=tSayisi; i++){
                let f = kalan * dF, ind = f * subO, a = (i===tSayisi) ? kalan : taksit - f;
                html += `<tr><td>${i}</td><td>${Math.round(a).toLocaleString('tr-TR')}</td><td>${Math.round(f).toLocaleString('tr-TR')}</td>${subO>0?`<td>-${Math.round(ind).toLocaleString('tr-TR')}</td>`:''}<td><strong>${Math.round(taksit-ind).toLocaleString('tr-TR')}</strong></td><td>${Math.max(0,Math.round(kalan-a)).toLocaleString('tr-TR')}</td></tr>`;
                kalan -= a;
            }
            res.innerHTML += html + `</tbody></table></div>`;
        });
        document.getElementById('result-main-container').style.display = 'block';
        document.getElementById('apply-panel').style.display = 'block'; // Panel görünür yapıldı
        document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false;
    }

    function indir() {
        const element = document.getElementById('pdf-area');
        html2pdf().from(element).set({margin: 10, filename: 'Kredi_Plani.pdf', html2canvas: { scale: 2 }}).save();
    }
</script>
</body>
</html>
