<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kredi Hesaplama</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 800px;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
        }

        /* Tam satır kaplaması istenen alanlar için */
        .form-group.full-width {
            flex: 1 1 100%;
        }

        label {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="number"], select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
            width: 100%;
        }

        input[type="number"]:focus, select:focus {
            border-color: #4a90e2;
            outline: none;
        }

        /* Slider Tasarımı */
        .slider-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .slider-value {
            font-weight: 600;
            color: #4a90e2;
            background: #eef2ff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 5px;
            background: #cbd5e1;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4a90e2;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kredi Hesaplama Paneli</h2>
    
    <div class="form-container">
        <!-- Birinci Satır: Kredi Türü ve Tutar -->
        <div class="form-row">
            <div class="form-group">
                <label for="krediTuru">Kredi Türü</label>
                <select id="krediTuru">
                    <option value="bireysel">Bireysel İhtiyaç Kredisi</option>
                    <option value="konut">Konut Kredisi</option>
                    <option value="tasit">Taşıt Kredisi</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="krediTutari">Kredi Tutarı (TL)</label>
                <input type="number" id="krediTutari" placeholder="Örn: 50000" min="0">
            </div>
        </div>

        <!-- İkinci Satır: Tam Satır Bireysel Vade Slider'ı -->
        <div class="form-row">
            <div class="form-group full-width">
                <label for="vadeSlider">Bireysel Vade Seçimi</label>
                <div class="slider-container">
                    <div class="slider-header">
                        <span style="font-size: 13px; color: #64748b;">Vade Süresi</span>
                        <span class="slider-value" id="vadeGosterge">24 Ay</span>
                    </div>
                    <input type="range" id="vadeSlider" min="1" max="36" value="24">
                    <div class="slider-labels">
                        <span>1 Ay</span>
                        <span>12 Ay</span>
                        <span>24 Ay</span>
                        <span>36 Ay</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Üçüncü Satır: Faiz Oranı -->
        <div class="form-row">
            <div class="form-group">
                <label for="faizOrani">Aylık Faiz Oranı (%)</label>
                <input type="number" id="faizOrani" placeholder="Örn: 3.89" step="0.01" min="0">
            </div>
        </div>
    </div>
</div>

<script>
    // Slider değerini dinamik olarak güncellemek için script
    const vadeSlider = document.getElementById('vadeSlider');
    const vadeGosterge = document.getElementById('vadeGosterge');

    vadeSlider.addEventListener('input', (e) => {
        vadeGosterge.textContent = e.target.value + ' Ay';
    });
</script>

</body>
</html>
