<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Süleyman Coşkun - Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; background: #eee; padding: 15px; border-radius: 5px; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        th { background: #2c3e50; color: white; padding: 10px; }
        td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; background: #27ae60; color: white; font-weight: bold; }
        #btnPdf { background: #3498db; }
        #btnSifirla { background: #e74c3c; }

        /* Masraf Bölümü */
        .masraf-box { margin-top: 30px; border-top: 2px solid #2c3e50; padding-top: 15px; }
        .masraf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .masraf-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 5px 10px; border: 1px solid #ddd; }
        .masraf-item input { width: 120px; text-align: right; }
    </style>
</head>
<body>

<div class="container" id="pdf-area">
    <h2 style="text-align: center;">Kredi Ödeme Planı</h2>
    
    <div class="input-grid no-print">
        <div class="field"><label>Kredi Tutarı (₺)</label><input type="text" id="tutar" value="1.000.000" oninput="formatTutar(this)"></div>
        <div class="field"><label>Yıllık Faiz (%)</label><input type="number" id="faiz" value="40.50" step="0.01"></div>
        <div class="field"><label>Vade (Yıl)</label><input type="number" id="vade" value="5"></div>
        <div class="field"><label>BSMV (%)</label><input type="number" id="bsmv" value="5"></div>
        <div class="field"><label>KKDF (%)</label><input type="number" id="kkdf" value="0"></div>
    </div>

    <div class="btn-group no-print">
        <button onclick="hesapla()">HESAPLA</button>
        <button id="btnSifirla" onclick="location.reload()">SIFIRLA</button>
        <button id="btnPdf" onclick="indirPDF()">PDF İNDİR</button>
    </div>

    <table id="planTablosu">
        <thead>
            <tr>
                <th>Taksit No</th>
                <th>Anapara</th>
                <th>Faiz</th>
                <th>BSMV+KKDF</th>
                <th>Taksit Tutarı</th>
                <th>Kalan Borç</th>
            </tr>
        </thead>
        <tbody id="planBody"></tbody>
    </table>

    <div class="masraf-box">
        <h4 style="margin-top: 0;">EK MASRAFLAR</h4>
        <div class="masraf-grid">
            <div class="masraf-item"><label>Ekspertiz / Dosya:</label><input type="text" oninput="formatTutar(this)"></div>
            <div class="masraf-item"><label>Sigorta Giderleri:</label><input type="text" oninput="formatTutar(this)"></div>
            <div class="masraf-item"><label>İpotek / Rehin:</label><input type="text" oninput="formatTutar(this)"></div>
            <div class="masraf-item"><label>Diğer Masraflar:</label><input type="text" oninput="formatTutar(this)"></div>
        </div>
    </div>
</div>

<script>
    function formatTutar(i) {
        let v = i.value.replace(/\D/g, "");
        i.value = v ? new Intl.NumberFormat('tr-TR').format(v) : "";
    }

    function hesapla() {
        const tutar = parseFloat(document.getElementById('tutar').value.replace(/\./g, ""));
        const yFaiz = parseFloat(document.getElementById('faiz').value) / 100;
        const vade = parseInt(document.getElementById('vade').value);
        const bsmv = parseFloat(document.getElementById('bsmv').value) / 100;
        const kkdf = parseFloat(document.getElementById('kkdf').value) / 100;

        const brutFaiz = yFaiz * (1 + bsmv + kkdf);
        const taksit = (tutar * brutFaiz) / (1 - Math.pow(1 + brutFaiz, -vade));
        
        let body = "";
        let bakiye = tutar;

        for (let i = 1; i <= vade; i++) {
            let fYukü = bakiye * yFaiz;
            let vYükü = fYukü * (bsmv + kkdf);
            let ana = taksit - (fYükü + vYükü);
            if (i === vade) ana = bakiye;
            bakiye -= ana;
            body += `<tr><td>${i}</td><td>${ana.toLocaleString('tr-TR')} ₺</td><td>${fYükü.toLocaleString('tr-TR')} ₺</td><td>${vYükü.toLocaleString('tr-TR')} ₺</td><td>${taksit.toLocaleString('tr-TR')} ₺</td><td>${Math.abs(bakiye).toLocaleString('tr-TR')} ₺</td></tr>`;
        }
        document.getElementById('planBody').innerHTML = body;
    }

    function indirPDF() {
        const element = document.getElementById('pdf-area');
        html2pdf().from(element).save('kredi_plani.pdf');
    }
</script>

</body>
</html>
