<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kredi Hesaplama Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans p-4">

    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl overflow-hidden border border-gray-200">
        
        <div class="flex bg-blue-900 text-white text-sm font-semibold">
            <button class="flex-1 py-4 bg-blue-600 border-b-4 border-yellow-400 flex items-center justify-center gap-2">
                <i class="fas fa-tractor"></i> Traktör
            </button>
            <button class="flex-1 py-4 hover:bg-blue-800 flex items-center justify-center gap-2">
                <i class="fas fa-briefcase"></i> Ticari
            </button>
            <button class="flex-1 py-4 hover:bg-blue-800 flex items-center justify-center gap-2">
                <i class="fas fa-user-graduate"></i> Çiftçi
            </button>
            <button class="flex-1 py-4 hover:bg-blue-800 flex items-center justify-center gap-2">
                <i class="fas fa-shopping-cart"></i> Tüketici
            </button>
            <button class="px-6 py-4 bg-blue-950"><i class="fas fa-bars"></i></button>
        </div>

        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-gray-700">Kredi Tutarı (₺)</label>
                    <input type="text" value="1.000.000" class="border rounded p-2 w-48 bg-gray-50 text-right font-mono">
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-gray-700">Ödeme Sıklığı</label>
                    <select class="border rounded p-2 w-48 bg-gray-50 text-sm">
                        <option>Ayda 1</option>
                    </select>
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-gray-700">Aylık Faiz %</label>
                    <input type="text" value="3,38" class="border rounded p-2 w-48 bg-gray-50 text-right">
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-gray-700">KKDF %</label>
                    <input type="text" value="0" class="border rounded p-2 w-48 bg-gray-50 text-right">
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-gray-700">Sübvansiyon %</label>
                    <input type="text" value="50" class="border rounded p-2 w-48 bg-gray-50 text-right text-blue-600 font-bold">
                </div>
            </div>

            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-gray-700">Vade</label>
                    <select class="border rounded p-2 w-48 bg-gray-50 text-sm">
                        <option>5 Yıl</option>
                    </select>
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-gray-700">Plan Tipi</label>
                    <select class="border rounded p-2 w-48 bg-gray-50 text-sm">
                        <option>Eşit Taksit</option>
                    </select>
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-gray-700">Yıllık Faiz %</label>
                    <input type="text" value="40,50" class="border rounded p-2 w-48 bg-gray-50 text-right" readonly>
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-gray-700">BSMV %</label>
                    <input type="text" value="5" class="border rounded p-2 w-48 bg-gray-50 text-right">
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-gray-700">Vergi Tarihi</label>
                    <input type="date" value="2024-05-15" class="border rounded p-2 w-48 bg-gray-50 text-sm text-right">
                </div>
            </div>
        </div>

        <div class="px-6 pb-4">
            <button class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 shadow-md transition">
                <i class="fas fa-calculator"></i> HESAPLA
            </button>
        </div>

        <div class="px-6 pb-6">
            <div class="bg-blue-950 text-white p-3 rounded-t-lg flex items-center justify-between font-bold text-sm">
                <div class="flex items-center gap-2">
                    <i class="fas fa-list-ol"></i> AMORTİSMAN PLANI
                </div>
                <i class="fas fa-chevron-down text-xs"></i>
            </div>
            <div class="overflow-x-auto border border-gray-200">
                <table class="w-full text-[11px] text-left">
                    <thead class="bg-blue-900 text-white uppercase">
                        <tr>
                            <th class="p-2 border-r border-blue-800">No</th>
                            <th class="p-2 border-r border-blue-800">Taksit Tutarı</th>
                            <th class="p-2 border-r border-blue-800">Anapara</th>
                            <th class="p-2 border-r border-blue-800">Faiz</th>
                            <th class="p-2 border-r border-blue-800">BSMV</th>
                            <th class="p-2 border-r border-blue-800">KKDF</th>
                            <th class="p-2 border-r border-blue-800">Sübvansiyonlu</th>
                            <th class="p-2">Kalan Anapara</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr class="hover:bg-gray-50">
                            <td class="p-2 font-bold">1</td>
                            <td class="p-2 font-bold">27.178 ₺</td>
                            <td class="p-2">10.511 ₺</td>
                            <td class="p-2">13.531 ₺</td>
                            <td class="p-2">677 ₺</td>
                            <td class="p-2">0 ₺</td>
                            <td class="p-2 text-blue-700 font-bold bg-blue-50">13.160 ₺</td>
                            <td class="p-2 font-mono">989.489 ₺</td>
                        </tr>
                        <tr class="hover:bg-gray-50">
                            <td class="p-2 font-bold">2</td>
                            <td class="p-2 font-bold">27.178 ₺</td>
                            <td class="p-2">10.653 ₺</td>
                            <td class="p-2">13.389 ₺</td>
                            <td class="p-2">669 ₺</td>
                            <td class="p-2">0 ₺</td>
                            <td class="p-2 text-blue-700 font-bold bg-blue-50">13.093 ₺</td>
                            <td class="p-2 font-mono">978.836 ₺</td>
                        </tr>
                        <tr>
                            <td class="p-1 text-center text-gray-400 bg-gray-50" colspan="8">...</td>
                        </tr>
                        <tr class="hover:bg-gray-50">
                            <td class="p-2 font-bold">60</td>
                            <td class="p-2 font-bold">27.178 ₺</td>
                            <td class="p-2">27.000 ₺</td>
                            <td class="p-2">124 ₺</td>
                            <td class="p-2">6 ₺</td>
                            <td class="p-2">0 ₺</td>
                            <td class="p-2 text-blue-700 font-bold bg-blue-50">3.065 ₺</td>
                            <td class="p-2 font-mono text-red-600">0 ₺</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
