<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Modern Finansal Plan</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --primary: #0f172a; --secondary: #3b82f6; --success: #10b981; 
            --light: #f8fafc; --accent: #6366f1;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: #f1f5f9; margin: 0; padding: 0; color: #1e293b;
        }
        
        .container { 
            width: 100%; max-width: 1000px; margin: 0 auto; 
            background: #fff; padding: 20px; min-height: 100vh;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        /* Başlık Alanı (Sadece Yazdırmada Şık Görünür) */
        .print-header { display: none; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        .print-header h1 { margin: 0; font-size: 20px; color: var(--primary); text-transform: uppercase; }
        .print-header span { font-size: 12px; color: #64748b; }

        .tabs { display: flex; background: var(--primary); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 15px; }
        .tab-link { flex: 1; padding: 12px; color: #cbd5e1; border: none; background: transparent; font-weight: 600; border-radius: 8px; font-size: 12px; cursor: pointer; transition: 0.3s; }
        .tab-link.active { background: var(--secondary); color: #fff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

        .input-grid { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: var(--light); border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        .row { display: flex; gap: 10px; }
        .row .field { flex: 1; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: 700; color: #475569; }
        input, select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; transition: 0.2s; }
        input:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

        .btn-group { display: flex; gap: 8px; margin-bottom: 20px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; color: #fff; font-size: 13px; transition: 0.2s; }
        .btn-calc { background: var(--success); }
        .btn-calc:hover { filter: brightness(1.1); }
        .btn-clear { background: #64748b; }
        .btn-pdf { background: var(--accent); }
        .btn-print { background: var(--primary); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        .table-responsive { border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f1f5f9; padding: 14px; text-align: center; color: #475569; font-weight: 700; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        tr:nth-child(even) { background-color: #fcfcfc; }
        .bold-txt { font-weight: 700; color: var(--primary); }

        .masraf-container { margin-top: 20px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }
        .masraf-header { font-size: 12px; font-weight: 800; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }

        @media print {
            @page { size: portrait; margin: 0.8cm; }
            body { background: #fff; }
            .container { box-shadow: none; padding: 0; width: 100%; }
            .no-print { display: none !important; }
            .print-header { display: block; }
            
            /* Bilgi Kartları Görünümü */
            .input-grid { 
                display: grid !important; 
                grid-template-columns: repeat(3, 1fr); 
                background: #f8fafc !important; 
                border: 1px solid #ddd !important;
                -webkit-print-color-adjust: exact;
            }
            .row { display: contents; }
            input, select { border: none !important; font-weight: bold !important; padding: 2px !important; color: #000 !important; }
            
            table { font-size: 10px; border: 1px solid #eee; }
            th { background: #0f172a !important; color: #fff !important; -webkit-print-color-adjust: exact; }
            td { border-bottom: 1px solid #eee; }
            .masraf-container { border: 1px solid #ccc; min-height: 120px; }
        }
    </style>
</head>
<body onload="vadeYukle();">

<div class="container" id="printable-area">
    
    <!-- Yazdırmada Çıkan Başlık -->
    <div class="print-header">
        <h1>Kredi Ödeme Planı</h1>
        <span id="print-date"></span>
    </div>
    
    <div class="tabs no-print">
        <button class="tab-link active" onclick="openTab(event, 'traktor')">🚜 Traktör</button>
        <button class="tab-link" onclick="openTab(event, 'ticari')">💼 Ticari</button>
        <button class="tab-link" onclick="openTab(event, 'zirai')">👨‍🌾 Çiftçi</button>
        <button class="tab-link" onclick="openTab(event, 'tuketici')">🛒 Tüketici</button>
    </div>

    <div class="input-grid" id="inputSection">
        <div class="row">
            <div class="field" style="flex: 2;"><label>Kredi Tutarı</label><input type="text" id="tutar" inputmode="numeric" value="1.000.000" oninput="formatTutar(this); resetButtons();"></div>
            <div class="field" style="flex: 1.2;"><label>Vade</label><select id="vadeSecim" onchange="resetButtons();"></select></div>
        </div>
        
        <div class="row">
            <div class="field"><label>Ödeme Sıklığı</label><select id="periyot" onchange="resetButtons();">
                <option value="1" selected>Yılda 1 Ödemeli</option>
                <option value="2">6 Ayda 1 Ödemeli</option>
                <option value="4">3 Ayda 1 Ödemeli</option>
                <option value="12">Ayda 1 Ödemeli</option>
            </select></div>
            <div class="field"><label>Yıllık Faiz %</label><input type="number" id="faizYillik" value="40.50" step="0.01" oninput="resetButtons();"></div>
        </div>

        <div class="row">
            <div class="field"><label>KKDF %</label><input type="number" id="kkdfOran" value="0" step="0.01" oninput="resetButtons();"></div>
            <div class="field"><label>BSMV %</label><input type="number" id="bsmvOran" value="5" step="0.01" oninput="resetButtons();"></div>
            <div class="field" id="subContainer"><label>Sübvansiyon %</label><input type="number" id="subOran" value="50" oninput="resetButtons();"></div>
        </div>
    </div>

    <div class="btn-group no-print" id="buttonGroup">
        <button class="btn-calc" onclick="hesapla()">HESAPLA</button>
        <button class="btn-clear" onclick="location.reload()">Sıfırla</button>
        <button class="btn-pdf" id="btnPdf" onclick="indirPDF()" disabled>PDF İNDİR</button>
        <button class="btn-print" id="btnPrint" onclick="yazdir()" disabled>YAZDIR</button>
    </div>

    <div id="sonucAlani" style="display:none;">
        <div class="table-responsive">
            <table id="planTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Taksit Tutarı</th>
                        <th>Anapara</th>
                        <th>Faiz</th>
                        <th>Vergi</th>
                        <th id="thSub">Sübv. Taksit</th>
                        <th>Kalan Borç</th>
                    </tr>
                </thead>
                <tbody id="planBody"></tbody>
            </table>
        </div>

        <div class="masraf-container">
            <div class="masraf-header">📌 Masraflar ve Önemli Notlar</div>
            <div style="font-size: 12px; color: #64748b;">Buraya kalemle ek notlar alabilirsiniz...</div>
        </div>
    </div>
</div>

<script>
    let currentType = 'traktor';

    function formatTutar(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
    }

    function resetButtons() {
        ['btnPdf', 'btnPrint'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.disabled = true;
        });
    }

    function vadeYukle() {
        const select = document.getElementById('vadeSecim');
        select.innerHTML = '';
        let limit = (currentType === 'ticari' || currentType === 'zirai') ? 60 : 5;
        let suffix = (currentType === 'ticari' || currentType === 'zirai') ? " Ay" : " Yıl";
        for (let i = 1; i <= limit; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerText = i + suffix;
            if (i === limit) opt.selected = true;
            select.appendChild(opt);
        }
        document.getElementById('print-date').innerText = new Date().toLocaleDateString('tr-TR') + " tarihinde oluşturuldu.";
    }

    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        evt.currentTarget.classList.add('active');
        currentType = tabName;
        const kkdfInput = document.getElementById('kkdfOran');
        const bsmvInput = document.getElementById('bsmvOran');
        if(tabName === 'tuketici' || tabName === 'zirai') { kkdfInput.value = 15; bsmvInput.value = 15; } 
        else { kkdfInput.value = 0; bsmvInput.value = 5; }
        document.getElementById('subContainer').style.visibility = (tabName === 'traktor') ? 'visible' : 'hidden';
        vadeYukle(); resetButtons();
    }

    function hesapla() {
        const tVal = document.getElementById('tutar').value.replace(/\./g, "");
        const tutar = parseFloat(tVal);
        if(isNaN(tutar)) return;

        const yFaiz = parseFloat(document.getElementById('faizYillik').value) / 100;
        const sub = parseFloat(document.getElementById('subOran').value) / 100;
        const vade = parseInt(document.getElementById('vadeSecim').value);
        const per = parseInt(document.getElementById('periyot').value);
        const bsmv = parseFloat(document.getElementById('bsmvOran').value) / 100;
        const kkdf = parseFloat(document.getElementById('kkdfOran').value) / 100;

        let toplamTaksit = (currentType === 'ticari' || currentType === 'zirai') ? Math.ceil(vade / (12 / per)) : vade * per;
        const dFaiz = yFaiz / per;
        const i_vergi = dFaiz * (1 + bsmv + kkdf);
        const taksitSabit = (tutar * i_vergi * Math.pow(1+i_vergi, toplamTaksit)) / (Math.pow(1+i_vergi, toplamTaksit)-1);
        
        let body = '', kalan = tutar;

        for(let j=1; j<=toplamTaksit; j++){
            let f = kalan * dFaiz;
            let v = f * (bsmv + kkdf);
            let a = taksitSabit - (f + v);
            if(j === toplamTaksit) a = kalan;
            let t = a + f + v;
            let subT = t - ((f+v)*sub);
            kalan -= a;
            
            body += `<tr>
                <td>${j}</td>
                <td class="bold-txt">${Math.round(t).toLocaleString('tr-TR')}₺</td>
                <td>${Math.round(a).toLocaleString('tr-TR')}₺</td>
                <td>${Math.round(f).toLocaleString('tr-TR')}₺</td>
                <td>${Math.round(v).toLocaleString('tr-TR')}₺</td>
                <td style="${currentType==='traktor'?'':'display:none'}">${Math.round(subT).toLocaleString('tr-TR')}₺</td>
                <td class="bold-txt">${Math.max(0, Math.round(kalan)).toLocaleString('tr-TR')}₺</td>
            </tr>`;
        }

        document.getElementById('planBody').innerHTML = body;
        document.getElementById('sonucAlani').style.display = 'block';
        ['btnPdf', 'btnPrint'].forEach(id => {
            document.getElementById(id).disabled = false;
        });
    }

    function yazdir() { window.print(); }

    function indirPDF() {
        const element = document.getElementById('printable-area');
        const opt = {
            margin: 10,
            filename: 'Kredi_Odeme_Plani.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 3 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().from(element).set(opt).save();
    }
</script>
</body>
</html>
