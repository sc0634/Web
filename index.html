<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Finansal Analiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* --- EKRAN TASARIMI --- */
        .tabs { 
            display: flex; flex-wrap: wrap; background: #2c3e50; 
            position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid #3498db;
        }
        .tab-link { 
            flex: 1; min-width: 80px; padding: 15px 2px; color: #ecf0f1; border: none; 
            background: none; cursor: pointer; font-weight: bold; display: flex; 
            flex-direction: column; align-items: center; font-size: 10px;
        }
        /* İkonlar %50 büyütüldü (1.5em -> 2.25em) */
        .tab-link span { display: block; font-size: 2.25em; margin-bottom: 6px; }
        .tab-link.active { background: #3498db; color: #fff; }

        .input-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; 
            background: #f9f9f9; padding: 15px; border-radius: 8px; 
            margin-bottom: 20px; border-left: 5px solid #3498db; 
        }
        .field { display: flex; align-items: center; }
        .field label { flex: 0 0 130px; font-size: 12px; font-weight: 600; color: #34495e; }
        input, select { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; background: #fff; width: 100%; }

        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .container { max-width: 1200px; margin: 10px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 20px; font-size: 20px; }
        
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        button { flex: 1; min-width: 120px; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: #fff; font-size: 13px; }
        .btn-calc { background: #27ae60; }
        .btn-clear { background: #e74c3c; }
        #btnPdf { background: #3498db; } #btnYazdir { background: #f39c12; }
        button:disabled { background: #ccc !important; cursor: not-allowed; }

        .summary-box { 
            background: #fdfdfd; border: 2px solid #3498db; padding: 15px; 
            border-radius: 8px; margin-bottom: 20px; display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;
        }
        .summary-item { text-align: center; border-right: 1px solid #eee; }
        .summary-item:last-child { border-right: none; }
        .summary-item strong { display: block; font-size: 11px; color: #7f8c8d; text-transform: uppercase; }
        .summary-item span { font-size: 18px; font-weight: bold; color: #2c3e50; }

        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 850px; }
        th { background: #34495e; color: #fff; padding: 12px 4px; font-size: 10px; text-align: center; }
        td { padding: 10px 4px; border-bottom: 1px solid #eee; text-align: center; font-size: 11px; color: #333; }
        .sub-row { background: #eef7ff; font-weight: bold; color: #2980b9; }

        @media print {
            .tabs, .btn-group, .no-print { display: none !important; }
            .container { box-shadow: none; margin: 0; padding: 0; width: 100%; }
            .input-grid { grid-template-columns: 1fr 1fr 1fr !important; border: 1px solid #ddd !important; }
            input, select { border: none !important; font-weight: bold; background: transparent !important; }
        }

        @media (max-width: 600px) {
            .input-grid { grid-template-columns: 1fr; }
            .summary-box { grid-template-columns: 1fr; }
            .summary-item { border-right: none; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        }
    </style>
</head>
<body onload="vadeYukle()">

<div class="tabs no-print" id="navbar">
    <button class="tab-link active" onclick="openTab(event, 'traktor')"><span>🚜</span>Zirai Traktör</button>
    <button class="tab-link" onclick="openTab(event, 'ticari')"><span>💼</span>Ticari</button>
    <button class="tab-link" onclick="openTab(event, 'zirai')"><span>👨‍🌾</span>Çiftçi Tüketici</button>
    <button class="tab-link" onclick="openTab(event, 'zirai_isletme')"><span>🏚️</span>Zirai/İşletme</button>
    <button class="tab-link" onclick="openTab(event, 'tuketici')"><span>🛒💳</span>Tüketici</button>
    <button class="tab-link" onclick="openTab(event, 'hakkimda')"><span>👤</span>Hakkımda</button>
</div>

<div class="container" id="main-content">
    <div id="krediAlani" class="tab-content active">
        <h1 id="baslikText">Zirai Traktör Kredisi Hesaplama</h1>
        
        <div class="form-wrapper">
            <div class="input-grid">
                <div class="field"><label>Kredi Tutarı (₺) :</label><input type="text" id="tutar" value="1.000.000" oninput="formatTutar(this); resetButtons();"></div>
                <div class="field"><label id="vadeLabel">Vade (Yıl) :</label><select id="vadeSecim" onchange="resetButtons();"></select></div>
                <div class="field"><label>Ödeme Sıklığı :</label><select id="periyot" onchange="resetButtons();"><option value="1" selected>Yılda Bir</option><option value="2">6 Ayda Bir</option><option value="4">3 Ayda Bir</option><option value="12">Ayda Bir</option></select></div>
                <div class="field"><label>Ödeme Planı :</label><select id="planTipi" onchange="resetButtons();"><option value="esit_taksit" selected>Eşit Taksitli</option><option value="esit_anapara">Anapara Eşit Taksitli</option></select></div>
                <div class="field"><label>Yıllık Faiz (%) :</label><input type="number" id="faizYillik" value="49.00" step="0.01" oninput="resetButtons();"></div>
                <div class="field" id="subContainer"><label>Sübvansiyon (%) :</label><input type="number" id="subOran" value="50" oninput="resetButtons();"></div>
            </div>
            
            <div class="btn-group no-print" id="action-buttons">
                <button class="btn-calc" onclick="hesapla()">HESAPLA</button>
                <button class="btn-clear" onclick="location.reload()">SIFIRLA</button>
                <button id="btnPdf" onclick="indirPDF()" disabled>PDF KAYDET</button>
                <button id="btnYazdir" onclick="window.print()" disabled>YAZDIR</button>
            </div>
        </div>

        <div id="sonucAlani" style="display:none;">
            <div class="summary-box">
                <div class="summary-item"><strong>Kredi Tutarı</strong><span id="sumAnapara">0 ₺</span></div>
                <div class="summary-item"><strong>Toplam Faiz + Vergi</strong><span id="sumFaiz">0 ₺</span></div>
                <div class="summary-item" style="color: #27ae60;"><strong>Toplam Geri Ödeme</strong><span id="sumGenel">0 ₺</span></div>
            </div>

            <div class="table-responsive">
                <table id="planTable">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Taksit Tutarı</th>
                            <th>Anapara</th>
                            <th>Faiz Tutarı</th>
                            <th>BSMV</th>
                            <th>KKDF</th>
                            <th id="thSub" style="background:#2c3e50; color:#fff;">Sübvansiyonlu Taksit</th>
                            <th>Kalan Anapara</th>
                        </tr>
                    </thead>
                    <tbody id="planBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="zirai_isletmeAlani" class="tab-content">
        <h1>Zirai/İşletme Kredisi</h1>
        <p style="text-align:center; color: #7f8c8d;">Bu bölüm henüz yapılandırılmadı.</p>
    </div>

    <div id="hakkimdaAlani" class="tab-content">
        <h1>Süleyman Coşkun</h1>
        <p style="text-align:center;">Finansal Analiz Uzmanı & Bankacılık Çözümleri</p>
    </div>
</div>

<script>
    let currentType = 'traktor';

    function vadeYukle() {
        const select = document.getElementById('vadeSecim');
        const label = document.getElementById('vadeLabel');
        select.innerHTML = '';
        if (currentType === 'ticari' || currentType === 'zirai') {
            label.innerText = "Vade (Ay) :";
            for (let i = 1; i <= 60; i++) {
                let opt = document.createElement('option');
                opt.value = i; opt.innerHTML = i + " Ay";
                if (i === 60) opt.selected = true;
                select.appendChild(opt);
            }
        } else {
            label.innerText = "Vade (Yıl) :";
            for (let i = 1; i <= 5; i++) {
                let opt = document.createElement('option');
                opt.value = i; opt.innerHTML = i + " Yıl";
                if (i === 5) opt.selected = true;
                select.appendChild(opt);
            }
        }
    }

    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        evt.currentTarget.classList.add('active');

        if(tabName === 'hakkimda') { 
            document.getElementById('hakkimdaAlani').classList.add('active'); 
        } else if (tabName === 'zirai_isletme') {
            document.getElementById('zirai_isletmeAlani').classList.add('active');
        } else {
            document.getElementById('krediAlani').classList.add('active');
            currentType = tabName;
            const titles = {
                'traktor':'Zirai Traktör Kredisi',
                'ticari':'Ticari Kredi',
                'zirai':'Çiftçi Tüketici Kredisi',
                'tuketici':'Tüketici Kredisi'
            };
            document.getElementById('baslikText').innerText = titles[tabName] + " Hesaplama";
            document.getElementById('subContainer').style.visibility = tabName === 'traktor' ? 'visible' : 'hidden';
            document.getElementById('subOran').value = tabName === 'traktor' ? "50" : "0";
            vadeYukle(); resetButtons();
        }
    }

    function resetButtons() { 
        document.getElementById('btnYazdir').disabled = true; 
        document.getElementById('btnPdf').disabled = true; 
        document.getElementById('sonucAlani').style.display = 'none'; 
    }
    
    function formatTutar(i) { 
        let v = i.value.replace(/\D/g, ""); 
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v); 
    }
    
    function hesapla() {
        const tutarStr = document.getElementById('tutar').value.replace(/\./g, "");
        const tutar = parseFloat(tutarStr);
        const yFaiz = parseFloat(document.getElementById('faizYillik').value) / 100;
        const sub = parseFloat(document.getElementById('subOran').value) / 100;
        const vadeDeger = parseInt(document.getElementById('vadeSecim').value);
        const per = parseInt(document.getElementById('periyot').value);
        const planTipi = document.getElementById('planTipi').value;
        
        let toplamTaksit = (currentType === 'ticari' || currentType === 'zirai') ? Math.ceil(vadeDeger / (12 / per)) : vadeDeger * per;
        const bsmvOran = currentType === 'tuketici' ? 0.15 : 0.05;
        const kkdfOran = currentType === 'tuketici' ? 0.15 : 0;
        const donemFaiz = yFaiz / per;
        const i_vergi = donemFaiz * (1 + bsmvOran + kkdfOran);
        
        let body = ''; let kalan = tutar; let toplamGeriOdeme = 0;
        document.getElementById('thSub').style.display = sub > 0 ? '' : 'none';
        
        for(let j=1; j<=toplamTaksit; j++){
            let netFaiz = kalan * donemFaiz;
            let bsmv = netFaiz * bsmvOran;
            let kkdf = netFaiz * kkdfOran;
            let a, t;
            if(planTipi === 'esit_taksit') {
                t = (tutar * i_vergi * Math.pow(1+i_vergi, toplamTaksit)) / (Math.pow(1+i_vergi, toplamTaksit)-1);
                a = t - (netFaiz + bsmv + kkdf);
            } else { a = tutar / toplamTaksit; t = a + netFaiz + bsmv + kkdf; }
            if(j === toplamTaksit) a = kalan;
            t = a + netFaiz + bsmv + kkdf;
            
            let sTaksit = t - ((netFaiz + bsmv + kkdf) * sub);
            toplamGeriOdeme += (sub > 0 ? sTaksit : t);
            kalan -= a;

            body += `<tr><td>${j}</td><td>${Math.round(t).toLocaleString('tr-TR')} ₺</td><td>${Math.round(a).toLocaleString('tr-TR')} ₺</td><td>${Math.round(netFaiz).toLocaleString('tr-TR')} ₺</td><td>${Math.round(bsmv).toLocaleString('tr-TR')} ₺</td><td>${Math.round(kkdf).toLocaleString('tr-TR')} ₺</td><td class="sub-row" style="${sub > 0 ? '' : 'display:none'}">${Math.round(sTaksit).toLocaleString('tr-TR')} ₺</td><td>${Math.max(0, Math.round(kalan)).toLocaleString('tr-TR')} ₺</td></tr>`;
        }

        document.getElementById('sumAnapara').innerText = Math.round(tutar).toLocaleString('tr-TR') + " ₺";
        document.getElementById('sumFaiz').innerText = Math.round(toplamGeriOdeme - tutar).toLocaleString('tr-TR') + " ₺";
        document.getElementById('sumGenel').innerText = Math.round(toplamGeriOdeme).toLocaleString('tr-TR') + " ₺";

        document.getElementById('planBody').innerHTML = body;
        document.getElementById('sonucAlani').style.display = 'block';
        document.getElementById('btnYazdir').disabled = false;
        document.getElementById('btnPdf').disabled = false;
    }
    
    function indirPDF() {
        const element = document.getElementById('main-content');
        const nav = document.getElementById('navbar');
        const btns = document.getElementById('action-buttons');
        nav.style.display = 'none'; btns.style.visibility = 'hidden';
        const opt = { margin: [10, 5, 10, 5], filename: 'Kredi_Plani.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } };
        html2pdf().set(opt).from(element).save().then(() => { nav.style.display = 'flex'; btns.style.visibility = 'visible'; });
    }
</script>
</body>
</html>
