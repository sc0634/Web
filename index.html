<!-- CSS Kısmına eklenecek animasyon ve stil -->
<style>
    .info-text {
        font-size: 10px;
        color: #2c3e50;
        margin-top: 5px;
        font-weight: normal;
        display: none; /* Varsayılan gizli */
    }
    
    /* Yanıp sönme efekti */
    .blink {
        animation: blinker 1.5s linear infinite;
        color: #e74c3c; /* Dikkat çekmesi için kırmızı tonu */
        font-weight: bold;
    }

    @keyframes blinker {
        50% { opacity: 0; }
    }
</style>

<!-- HTML - Seçenekler Kısmı (Geliştirilmiş) -->
<div class="options-container" id="ziraiOpts">
    <div class="opt-group">
        <div class="opt-row">
            <input type="checkbox" id="yerli" checked onchange="updateYerli()">
            <label for="yerli">Yerli Malı</label>
        </div>
        <div id="yerli-desc" class="info-text">Faizin %25ini Hazine ödemektedir.</div>
    </div>

    <div class="opt-group" id="bb-box">
        <div class="opt-row">
            <input type="checkbox" id="buyback" checked onchange="updateBuyback()">
            <label for="buyback">Buy Back</label>
        </div>
        <div id="bb-desc" class="info-text">Krediniz sabit faizlidir.</div>
    </div>
</div>

<script>
    // Sayfa yüklendiğinde ve seçimler değiştiğinde açıklamaları kontrol eden fonksiyonlar
    function updateYerli() {
        const yerliChecked = document.getElementById('yerli').checked;
        const desc = document.getElementById('yerli-desc');
        
        // Yerli malı oran güncellemesi
        if(mode === 'traktor') document.getElementById('subOran').value = yerliChecked ? 50 : 25;
        else if(mode === 'ekipman') document.getElementById('subOran').value = yerliChecked ? 75 : 50;

        // Açıklama gösterimi
        desc.style.display = yerliChecked ? 'block' : 'none';
        reset();
    }

    function updateBuyback() {
        const bbChecked = document.getElementById('buyback').checked;
        const desc = document.getElementById('bb-desc');
        
        if (bbChecked) {
            desc.innerText = "Krediniz sabit faizlidir.";
            desc.classList.remove('blink');
            desc.style.display = 'block';
        } else {
            desc.innerText = "Krediniz değişken faizlidir.";
            desc.classList.add('blink'); // Seçili değilse yanıp söner
            desc.style.display = 'block';
        }
        reset();
    }

    // initApp veya switchTab fonksiyonlarınızın sonuna bunları eklemeyi unutmayın 
    // Böylece sekmeler arası geçişte açıklamalar otomatik güncellenir.
    function checkInitialStates() {
        updateYerli();
        updateBuyback();
    }
</script>
