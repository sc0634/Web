<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --tarimsal: #2ecc71; --ticari: #e67e22; --bireysel: #3498db; --hakkimda: #34495e;
            --success: #27ae60; --dark: #2c3e50; --light: #ecf0f1; --border: #dcdde1;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f6fa; margin: 0; padding: 10px; color: var(--dark); font-size: 13px; }
        
        .container { 
            max-width: 1000px; margin: 10px auto; background: #fff; padding: 20px; 
            border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); 
        }
        
        /* Üst Menü */
        .segment-nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 8px; }
        .seg-btn { 
            flex: 1 0 auto; min-width: 95px; border: 2px solid transparent; 
            height: 40px; border-radius: 6px; color: white; font-weight: bold; 
            cursor: pointer; font-size: 11px; opacity: 0.5; transition: 0.3s;
        }
        .seg-btn.active { opacity: 1; border-color: #fff; outline: 2px solid var(--dark); }
        .bg-tar { background: var(--tarimsal); } .bg-tic { background: var(--ticari); }
        .bg-bir { background: var(--bireysel); } .bg-hak { background: var(--hakkimda); }

        .tabs { display: none; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--light); padding-bottom: 8px; }
        .tab-btn { padding: 6px 10px; border: none; background: #eee; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; }
        .tab-btn.active { background: var(--dark); color: white; }
        
        .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        input, select { height: 40px; padding: 0 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; width: 100%; }
        label { font-weight: bold; font-size: 9px; color: #57606f; text-transform: uppercase; }

        /* Dinamik Açıklamalar ve Animasyon */
        .info-text { font-size: 10px; margin-top: 4px; display: none; }
        .blink { animation: blinker 1.5s linear infinite; color: #e74c3c; font-weight: bold; }
        @keyframes blinker { 50% { opacity: 0; } }

        .options-container { display: flex; gap: 20px; padding: 10px; background: #fdfdfd; border: 1px dashed var(--border); border-radius: 5px; width: 100%; }
        .opt-group { display: flex; flex-direction: column; }
        .opt-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .opt-row input { width: 18px; height: 18px; margin: 0; }

        /* Buton Grubu */
        .actions { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 8px; margin-top: 15px; }
        .btn { height: 45px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #9b59b6; }
        .btn-print { background: var(--dark); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Sonuç ve Başvuru Paneli */
        .result-main-container { margin-top: 15px; border: 2px solid var(--dark); border-radius: 6px; overflow: hidden; display: none; }
        .result-main-title { background: var(--dark); color: white; padding: 10px; text-align: center; font-weight: bold; }
        .table-res { overflow-x: auto; padding: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { padding: 6px; border: 1px solid var(--border); text-align: center; }

        .apply-row-forced { display: flex; flex-direction: row; gap: 5px; padding: 10px; align-items: flex-end; }
        .apply-row-forced .field, .apply-row-forced .btn-box { flex: 1; }

        /* Mobil Düzenlemeler */
        @media (max-width: 600px) {
            .actions { grid-template-columns: 1fr 1fr 1fr !important; gap: 5px; }
            .btn { font-size: 10px !important; height: 40px !important; }
            .apply-row-forced { flex-wrap: wrap; }
            .apply-row-forced .field { flex: 1 1 45%; }
            .apply-row-forced .btn-box { flex: 1 1 100%; margin-top: 5px; }
        }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <h2 style="text-align: center;" class="no-print">Süleyman Coşkun - Kredi Paneli</h2>

    <div class="segment-nav no-print">
        <button id="seg-tar" class="seg-btn bg-tar" onclick="switchSegment('tarimsal')">TARIMSAL</button>
        <button id="seg-tic" class="seg-btn bg-tic" onclick="switchSegment('ticari')">TİCARİ</button>
        <button id="seg-bir" class="seg-btn bg-bir" onclick="switchSegment('bireysel')">BİREYSEL</button>
        <button id="seg-hak" class="seg-btn bg-hak" onclick="switchSegment('hakkimda')">HAKKIMDA</button>
    </div>

    <div id="calculator-ui">
        <div class="tabs no-print" id="tabs-tarimsal">
            <button class="tab-btn" onclick="switchTab(this, 'traktor')">Traktör</button>
            <button class="tab-btn" onclick="switchTab(this, 'ekipman')">Ekipman</button>
        </div>

        <div class="grid no-print">
            <div class="field" style="flex: 1 1 45%;"><label>Proforma</label><input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)"></div>
            <div class="field" style="flex: 1 1 45%;"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
            <div class="field" style="flex: 1 1 20%;"><label>Yıllık %</label><input type="number" id="faiz" value="40.50" step="0.01" oninput="syncFaiz('yillik')"></div>
            <div class="field" style="flex: 1 1 20%;"><label>İndirim %</label><input type="number" id="subOran" value="50" readonly></div>
        </div>

        <div class="options-container no-print" id="ziraiOpts" style="margin-top:15px;">
            <div class="opt-group">
                <div class="opt-row">
                    <input type="checkbox" id="yerli" checked onchange="updateYerli()">
                    <label for="yerli">Yerli Malı</label>
                </div>
                <div id="yerli-desc" class="info-text" style="color:var(--success)">Faizin %25ini Hazine ödemektedir.</div>
            </div>
            <div class="opt-group" id="bb-box">
                <div class="opt-row">
                    <input type="checkbox" id="buyback" checked onchange="updateBuyback()">
                    <label for="buyback">Buy Back</label>
                </div>
                <div id="bb-desc" class="info-text">Krediniz sabit faizlidir.</div>
            </div>
        </div>

        <div class="actions no-print">
            <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
            <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF</button>
            <button class="btn btn-print" id="printBtn" onclick="window.print()" disabled>YAZDIR</button>
        </div>

        <div id="result-main-container" class="result-main-container">
            <div class="result-main-title">Ödeme Planı Detayları</div>
            <div id="result-area"></div>
        </div>

        <div id="basvuru-paneli" class="result-main-container no-print" style="border-color: var(--success);">
            <div class="result-main-title" style="background: var(--success);">Hızlı Başvuru</div>
            <div class="apply-row-forced">
                <div class="field"><label>TCKN</label><input type="text" id="app-tckn" maxlength="11"></div>
                <div class="field"><label>TEL</label><input type="tel" id="app-phone"></div>
                <div class="btn-box"><button class="btn btn-calc" style="width:100%" onclick="alert('İletildi!')">GÖNDER</button></div>
            </div>
        </div>
    </div>
</div>

<script>
    let mode = 'traktor'; let segment = 'tarimsal';
    
    function initApp() { 
        switchSegment('tarimsal');
        updateYerli();
        updateBuyback();
    }

    function syncFaiz(src) {
        const y = document.getElementById('faiz');
        if(src === 'yillik') reset();
    }

    function switchSegment(seg) {
        segment = seg;
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('seg-' + seg.substring(0,3)).classList.add('active');
        document.getElementById('tabs-tarimsal').style.display = (seg === 'tarimsal') ? 'flex' : 'none';
        reset();
    }

    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); mode = m;
        updateYerli();
        reset();
    }

    function updateYerli() {
        const check = document.getElementById('yerli').checked;
        const desc = document.getElementById('yerli-desc');
        if(mode === 'traktor') document.getElementById('subOran').value = check ? 50 : 25;
        else if(mode === 'ekipman') document.getElementById('subOran').value = check ? 75 : 50;
        desc.style.display = check ? 'block' : 'none';
        reset();
    }

    function updateBuyback() {
        const bb = document.getElementById('buyback').checked;
        const desc = document.getElementById('bb-desc');
        desc.style.display = 'block';
        if(bb) {
            desc.innerText = "Krediniz sabit faizlidir.";
            desc.classList.remove('blink');
        } else {
            desc.innerText = "Krediniz değişken faizlidir.";
            desc.classList.add('blink');
        }
        reset();
    }

    function fmtMoney(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
        reset();
    }

    function reset() {
        document.getElementById('result-main-container').style.display = 'none';
        document.getElementById('basvuru-paneli').style.display = 'none';
        document.getElementById('pdfBtn').disabled = true;
        document.getElementById('printBtn').disabled = true;
    }

    function hesapla() {
        const res = document.getElementById('result-area'); res.innerHTML = '';
        const anaPara = parseFloat(document.getElementById('tutar').value.replace(/\./g, "")) || 0;
        const yF = document.getElementById('faiz').value / 100;
        const subO = document.getElementById('subOran').value / 100;
        
        let h = `<div class="table-res"><table><thead><tr><th>Yıl</th><th>Taksit</th><th>Kalan</th></tr></thead><tbody>`;
        let taksit = (anaPara / 5) + (anaPara * yF * (1 - subO));
        for(let i=1; i<=5; i++) {
            h += `<tr><td>${i}</td><td>${Math.round(taksit).toLocaleString('tr-TR')}</td><td>${Math.round(anaPara - (anaPara/5*i)).toLocaleString('tr-TR')}</td></tr>`;
        }
        res.innerHTML = h + `</tbody></table></div>`;
        
        document.getElementById('result-main-container').style.display = 'block';
        document.getElementById('basvuru-paneli').style.display = 'block';
        document.getElementById('pdfBtn').disabled = false;
        document.getElementById('printBtn').disabled = false;
    }

    function indir() {
        const el = document.getElementById('pdf-area');
        html2pdf().from(el).set({ margin: 10, filename: 'Suleyman_Coskun_Plan.pdf' }).save();
    }
</script>
</body>
</html>
