<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Profesyonel Kredi Paneli</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --navy: #0f172a; --blue: #2563eb; --gray: #64748b; --border: #e2e8f0; --success: #10b981; --red: #ef4444; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f8fafc; margin: 0; padding: 10px; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Sabit Üst Panel */
        .sticky-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; padding: 15px; background: #eff6ff; border-radius: 10px; border: 1px solid var(--blue); }
        
        .tabs { display: flex; background: var(--navy); border-radius: 8px; padding: 4px; gap: 4px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 80px; padding: 12px 2px; color: #cbd5e1; border: none; background: transparent; font-weight: 700; border-radius: 6px; font-size: 10px; cursor: pointer; text-transform: uppercase; }
        .tab-btn.active { background: var(--blue); color: #fff; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: #f1f5f9; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field-full { grid-column: span 2; }
        
        label { font-size: 10px; font-weight: 800; color: var(--gray); text-transform: uppercase; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; width: 100%; }
        
        .section-title { background: #334155; color: white; padding: 10px; margin-top: 20px; border-radius: 8px; font-size: 13px; font-weight: 700; text-align: center; }
        .vade-header { background: var(--blue); color: white; padding: 10px; margin-top: 25px; border-radius: 8px; font-size: 13px; font-weight: 900; text-align: center; }

        table { width: 100%; border-collapse: collapse; margin-top: 8px; background: white; }
        th { background: #1e293b; color: #fff; padding: 8px; font-size: 10px; border: 1px solid #334155; }
        td { padding: 10px 4px; text-align: center; border: 1px solid var(--border); font-size: 12px; font-weight: 600; }
        .total-row td { background: #f1f5f9 !important; font-weight: 800; border-top: 2px solid var(--navy); }

        .expense-box { margin-top: 15px; padding: 15px; border-radius: 10px; background: #fff5f5; border: 1px solid #fecaca; }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin: 20px 0; }
        .btn { padding: 14px 5px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; color: #fff; text-transform: uppercase; font-size: 12px; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #6366f1; }
        .btn-print { background: var(--navy); }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <!-- Sabitlenen Satır -->
    <div class="sticky-fields no-print">
        <div class="field"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
        <div class="field"><label>Yıllık Faiz %</label><input type="number" id="faiz" value="40.50" step="0.01" oninput="reset()"></div>
    </div>

    <div class="tabs no-print">
        <button class="tab-btn active" onclick="switchTab(this, 'traktor')">ZİRAİ <br> TRAKTÖR</button>
        <button class="tab-btn" onclick="switchTab(this, 'ticari')">TİCARİ</button>
        <button class="tab-btn" onclick="switchTab(this, 'zirai')">ÇİFTÇİ <br> TAKSİTLİ</button>
        <button class="tab-btn" onclick="switchTab(this, 'tuketici')">TÜKETİCİ</button>
    </div>

    <div class="grid no-print">
        <div class="field field-full"><label>Proforma Fatura Tutarı</label><input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)"></div>
        <div class="field" id="vade-box"><label>Vade</label><select id="vade" onchange="reset()"></select></div>
        <div class="field"><label id="subLabel">Sübvansiyon %</label><input type="number" id="subOran" value="50" oninput="reset()"></div>
        <div class="field" id="bsmv-box"><label>BSMV %</label><input type="number" id="bsmv" value="5"></div>
        <div class="field" id="kkdf-box"><label>KKDF %</label><input type="number" id="kkdf" value="0"></div>
        <div class="field field-full" id="traktorOpts" style="flex-direction:row; gap:10px; align-items:center; border-top:1px solid #ddd; padding-top:10px;">
            <input type="checkbox" id="yerli" checked onchange="toggleYerli(this)"> <label for="yerli" style="text-transform:none">Yerli Malı Desteği</label>
        </div>
    </div>

    <!-- Başvuru Modülü -->
    <div class="grid no-print">
        <div class="field"><label>Müşteri Adı</label><input type="text" placeholder="Ad Soyad"></div>
        <div class="field"><label>Telefon</label><input type="text" placeholder="05xx"></div>
    </div>

    <!-- Masraflar Modülü -->
    <div class="expense-box no-print">
        <label>Ek Masraflar (Kaskol, Dosya vb.)</label>
        <input type="text" id="masraf" value="0" oninput="fmtMoney(this)" style="margin-top:5px">
    </div>

    <div class="actions no-print">
        <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
        <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF</button>
        <button class="btn btn-print" id="printBtn" onclick="yazdir()" disabled>YAZDIR</button>
    </div>

    <div id="result-area"></div>
</div>

<script>
    let mode = 'traktor';

    function initApp() {
        fmtMoney(document.getElementById('proforma'));
        fmtMoney(document.getElementById('tutar'));
        switchTab(document.querySelector('.tab-btn'), 'traktor');
    }

    function fmtMoney(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
        reset();
    }

    function reset() {
        document.getElementById('result-area').innerHTML = '';
        document.getElementById('pdfBtn').disabled = true;
        document.getElementById('printBtn').disabled = true;
    }

    function toggleYerli(cb) {
        document.getElementById('subOran').value = cb.checked ? 50 : 25;
        reset();
    }

    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = m;
        
        document.getElementById('vade-box').style.display = (m === 'traktor') ? 'none' : 'block';
        document.getElementById('traktorOpts').style.display = (m === 'traktor') ? 'flex' : 'none';
        document.getElementById('bsmv-box').style.display = (m === 'traktor') ? 'none' : 'block';
        document.getElementById('kkdf-box').style.display = (m === 'traktor') ? 'none' : 'block';

        const s = document.getElementById('vade'); s.innerHTML = '';
        let isM = (m === 'ticari' || m === 'tuketici');
        let max = (m === 'tuketici') ? 36 : (isM ? 60 : 5);
        for(let i=1; i<=max; i++) {
            let o = document.createElement('option'); o.value = i; o.text = i + (isM ? " Ay" : " Yıl");
            if(i === max) o.selected = true;
            s.appendChild(o);
        }
        reset();
    }

    function hesapla() {
        const resultArea = document.getElementById('result-area');
        resultArea.innerHTML = '';
        const anaPara = parseFloat(document.getElementById('tutar').value.replace(/\./g, ""));
        const yFaiz = parseFloat(document.getElementById('faiz').value) / 100;
        const sub = (mode === 'traktor') ? parseFloat(document.getElementById('subOran').value) / 100 : 0;
        const bsmv = parseFloat(document.getElementById('bsmv').value) / 100;
        const kkdf = parseFloat(document.getElementById('kkdf').value) / 100;

        let vades = (mode === 'traktor') ? [1, 2, 3, 4, 5] : [parseInt(document.getElementById('vade').value)];

        vades.forEach(v => {
            let per = (mode === 'ticari' || mode === 'tuketici') ? 12 : 1; 
            let totalTaksit = (mode === 'ticari' || mode === 'tuketici') ? v : v * per;
            let dFaiz = yFaiz / per;
            let bFaiz = dFaiz * (1 + bsmv + kkdf);
            
            let taksit = (anaPara * bFaiz * Math.pow(1+bFaiz, totalTaksit)) / (Math.pow(1+bFaiz, totalTaksit)-1);
            
            let html = `<div class="vade-header">${v} ${mode.includes('t') && !mode.includes('traktor') ? 'AYLIK' : 'YILLIK'} PLAN</div>
                        <table><thead><tr><th>No</th><th>Anapara</th><th>Faiz</th><th>BSMV</th><th>Taksit</th><th>Kalan</th></tr></thead><tbody>`;
            
            let kalan = anaPara;
            let tA = 0, tF = 0, tB = 0, tT = 0;

            for(let i=1; i<=totalTaksit; i++) {
                let f = kalan * dFaiz;
                let b = f * bsmv;
                let a = taksit - (f + b + (f * kkdf));
                if(i === totalTaksit) a = kalan;
                
                let sTaksit = taksit - (f * sub); 
                kalan -= a;
                tA += a; tF += f; tB += b; tT += sTaksit;

                html += `<tr><td>${i}</td><td>${Math.round(a).toLocaleString('tr-TR')}</td><td>${Math.round(f).toLocaleString('tr-TR')}</td><td>${Math.round(b).toLocaleString('tr-TR')}</td><td>${Math.round(sTaksit).toLocaleString('tr-TR')}</td><td>${Math.max(0,Math.round(kalan)).toLocaleString('tr-TR')}</td></tr>`;
            }
            
            // 1 yıllık plan ise toplam satırını ekleme
            if(!(mode === 'traktor' && v === 1)) {
                html += `<tr class="total-row"><td>TOPLAM</td><td>${Math.round(tA).toLocaleString('tr-TR')}</td><td>${Math.round(tF).toLocaleString('tr-TR')}</td><td>${Math.round(tB).toLocaleString('tr-TR')}</td><td>${Math.round(tT).toLocaleString('tr-TR')}</td><td>-</td></tr>`;
            }

            html += `</tbody></table>`;
            resultArea.innerHTML += html;
        });

        document.getElementById('pdfBtn').disabled = false;
        document.getElementById('printBtn').disabled = false;
    }

    function yazdir() { window.print(); }
    function indir() { 
        html2pdf().from(document.getElementById('pdf-area')).set({
            margin: 5, filename: 'Kredi_Plani.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' }
        }).save(); 
    }
</script>
</body>
</html>
