<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kredi Hesaplama ve Ödeme Planı</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --tarimsal: #2ecc71; --ticari: #e67e22; --bireysel: #3498db; --hakkimda: #34495e;
            --success: #27ae60; --dark: #2c3e50; --light: #ecf0f1; --border: #dcdde1;
            --input-height: 40px;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f6fa; margin: 0; padding: 10px; color: var(--dark); font-size: 13px; }
        
        .container { 
            max-width: 1000px; margin: 10px auto; background: #fff; padding: 20px; 
            border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); 
            position: relative; min-height: 400px;
        }
        
        .segment-nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; white-space: nowrap; padding-bottom: 8px; }
        .seg-btn { 
            flex: 1 0 auto; min-width: 95px; border: 2px solid transparent; 
            height: 40px; border-radius: 6px; color: white; font-weight: bold; 
            cursor: pointer; font-size: 11px; opacity: 0.5; transition: 0.3s; padding: 0 15px;
        }
        .seg-btn.active { opacity: 1; border-color: #fff; outline: 2px solid var(--dark); }
        .bg-tar { background: var(--tarimsal); } .bg-tic { background: var(--ticari); }
        .bg-bir { background: var(--bireysel); } .bg-hak { background: var(--hakkimda); }

        .tabs { display: none; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--light); padding-bottom: 8px; }
        .tab-btn { padding: 6px 10px; border: none; background: #eee; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; }
        .tab-btn.active { background: var(--dark); color: white; }
        
        .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        
        input, select { 
            height: var(--input-height) !important; padding: 0 8px; 
            border: 1px solid var(--border); border-radius: 5px; 
            font-size: 12px; outline: none; background: white; width: 100%;
        }

        #prof-input-box, #tutar-input-box { width: 140px; }
        .px-faiz, .px-vergi { width: 65px; }
        .px-vade-sync { width: 85px; }
        .px-periyot { width: 130px; }
        
        label { font-weight: bold; font-size: 9px; color: #57606f; text-transform: uppercase; margin-bottom: 2px; }
        
        .result-main-container { margin-top: 15px; border: 2px solid var(--dark); border-radius: 6px; overflow: hidden; display: none; }
        .result-main-title { background: var(--dark); color: white; padding: 10px; text-align: center; font-weight: bold; }
        .table-res { overflow-x: auto; width: 100%; background: white; padding: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 5px;}
        th, td { padding: 6px 2px; border: 1px solid var(--border); text-align: center; }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 8px; margin-top: 15px; }
        .btn { height: 45px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #9b59b6; }
        .btn-print { background: var(--dark); }

        @media print {
            body { padding: 0; background: white; }
            @page { margin: 10mm; }
            .no-print { display: none !important; }
            .container { box-shadow: none; width: 100%; max-width: none; border: none; }
            .result-main-container { border: none; }
        }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <div style="text-align: center; margin-bottom: 10px;" class="only-print">
        <h3 style="margin:0;">Kredi Ödeme Planı</h3>
    </div>

    <div class="segment-nav no-print">
        <button id="seg-tar" class="seg-btn bg-tar" onclick="switchSegment('tarimsal')">TARIMSAL</button>
        <button id="seg-tic" class="seg-btn bg-tic" onclick="switchSegment('ticari')">TİCARİ</button>
        <button id="seg-bir" class="seg-btn bg-bir" onclick="switchSegment('bireysel')">BİREYSEL</button>
    </div>

    <div id="calculator-ui">
        <div class="tabs no-print" id="tabs-tarimsal">
            <button class="tab-btn" onclick="switchTab(this, 'traktor')">Traktör</button>
            <button class="tab-btn" onclick="switchTab(this, 'ekipman')">Ekipman</button>
            <button class="tab-btn" onclick="switchTab(this, 'zirai')">Çiftçi Taksitli</button>
        </div>
        <div class="tabs no-print" id="tabs-ticari"><button class="tab-btn" onclick="switchTab(this, 'ticari')">İşletme</button></div>
        <div class="tabs no-print" id="tabs-bireysel"><button class="tab-btn" onclick="switchTab(this, 'tuketici')">İhtiyaç</button></div>

        <div class="grid no-print" id="main-inputs">
            <div class="field" id="prof-input-box"><label>Proforma Bedeli</label><input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)"></div>
            <div class="field" id="tutar-input-box"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
            <div class="field px-faiz"><label>Yıllık %</label><input type="number" id="faiz" value="40.50" step="0.01" oninput="syncFaiz('yillik')"></div>
            <div class="field px-faiz"><label>Aylık %</label><input type="number" id="faizAylik" value="3.38" step="0.01" oninput="syncFaiz('aylik')"></div>
            <div class="field px-vergi"><label>BSMV %</label><input type="number" id="bsmv" value="5" readonly></div>
            <div class="field px-vergi"><label>KKDF %</label><input type="number" id="kkdf" value="0" readonly></div>
            <div class="field px-vade-sync" id="vade-box-select"><label>Vade</label><select id="vade-select" onchange="reset()"></select></div>
            <div class="field px-vade-slider" id="vade-box-slider" style="display:none;">
                <label>Vade: <span id="vade-val">12</span> Ay</label>
                <input type="range" id="vade-slider" min="1" max="36" value="12" oninput="updateSliderVal(this.value)">
            </div>
            <div class="field px-periyot" id="periyot-box"><label>Ödeme Periyodu</label><select id="periyot" onchange="reset()"></select></div>
            <div class="field px-vergi" id="sub-input-box" style="display:none;"><label>İndirim %</label><input type="number" id="subOran" value="50" oninput="reset()"></div>
        </div>

        <div class="actions no-print">
            <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
            <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF İNDİR</button>
            <button class="btn btn-print" id="printBtn" onclick="window.print()" disabled>YAZDIR</button>
        </div>

        <div id="result-main-container" class="result-main-container">
            <div class="result-main-title">Ödeme Planı Detayları</div>
            <div id="result-area"></div>
        </div>
    </div>
</div>

<script>
    let mode = 'traktor'; let segment = 'tarimsal';

    function initApp() { fmtMoney(document.getElementById('proforma')); fmtMoney(document.getElementById('tutar')); switchSegment('tarimsal'); }

    function syncFaiz(src) {
        const y = document.getElementById('faiz'), a = document.getElementById('faizAylik');
        if (src === 'yillik') a.value = (parseFloat(y.value) / 12).toFixed(2);
        else y.value = (parseFloat(a.value) * 12).toFixed(2);
        reset();
    }

    function switchSegment(seg) {
        segment = seg;
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('seg-' + seg.substring(0,3)).classList.add('active');
        updatePeriyotOptions();
        document.querySelectorAll('.tabs').forEach(t => t.style.display = 'none');
        document.getElementById(`tabs-${seg}`).style.display = 'flex';
        document.getElementById(`tabs-${seg}`).querySelector('.tab-btn').click();
        reset();
    }

    function updatePeriyotOptions() {
        const p = document.getElementById('periyot'); p.innerHTML = '';
        const opts = [{v:"1",t:"Aylık"}, {v:"3",t:"3 Ayda Bir"}, {v:"6",t:"6 Ayda Bir"}, {v:"12",t:"Yılda 1 Ödemeli"}];
        opts.forEach(o => {
            if (segment === 'bireysel' && (o.v === "6" || o.v === "12")) return;
            let el = document.createElement('option'); el.value = o.v; el.text = o.t; p.appendChild(el);
        });
        p.value = (segment === 'tarimsal') ? "12" : "1";
    }

    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); mode = m; reset();
        const isBir = (segment === 'bireysel'), isTic = (segment === 'ticari');
        document.getElementById('vade-box-select').style.display = isBir ? 'none' : 'flex';
        document.getElementById('vade-box-slider').style.display = isBir ? 'flex' : 'none';
        fillVades(isBir ? 36 : 60);
    }

    function fillVades(max) {
        const s = document.getElementById('vade-select'); s.innerHTML = '';
        for(let i=1; i<=max; i++) {
            let o = document.createElement('option'); o.value = i; 
            o.text = (segment === 'tarimsal') ? i + " Yıl" : i + " Ay";
            if(i===(segment === 'tarimsal' ? 5 : 12)) o.selected = true; 
            s.appendChild(o);
        }
    }

    function updateSliderVal(v) { document.getElementById('vade-val').innerText = v; reset(); }
    function fmtMoney(i) { let v = i.value.replace(/\D/g, ""); if(v) i.value = new Intl.NumberFormat('tr-TR').format(v); reset(); }
    function reset() { document.getElementById('result-main-container').style.display = 'none'; }

    function tabloYazdir(id) {
        const content = document.getElementById(id).innerHTML;
        const win = window.open('', '', 'height=700,width=900');
        win.document.write('<html><head><title>Ödeme Planı</title><style>body{font-family:sans-serif;padding:20px} table{width:100%;border-collapse:collapse;margin-top:10px} th,td{border:1px solid #ddd;padding:8px;text-align:center} .no-print{display:none} .print-header{text-align:center; margin-bottom:20px; font-weight:bold; border-bottom:1px solid #000; padding-bottom:10px;}</style></head><body>');
        win.document.write('<div class="print-header">ÖDEME PLANI DETAYI</div>');
        win.document.write(content);
        win.document.write('</body></html>');
        win.document.close();
        win.print();
    }

    function hesapla() {
        const res = document.getElementById('result-area'); res.innerHTML = '';
        const anaPara = parseFloat(document.getElementById('tutar').value.replace(/\./g, "")) || 0;
        if(anaPara <= 0) return alert("Tutar giriniz.");

        const yF = document.getElementById('faiz').value / 100, bsmv = document.getElementById('bsmv').value / 100, kkdf = document.getElementById('kkdf').value / 100;
        const periyot = parseInt(document.getElementById('periyot').value);
        const periyotMetni = document.getElementById('periyot').options[document.getElementById('periyot').selectedIndex].text;
        
        let vades = (segment === 'tarimsal') ? [parseInt(document.getElementById('vade-select').value)] : [ (segment === 'bireysel' ? parseInt(document.getElementById('vade-slider').value) : parseInt(document.getElementById('vade-select').value)) ];

        vades.forEach((v, idx) => {
            let containerId = `plan-${idx}`;
            let tSayisi = (segment === 'tarimsal') ? Math.ceil((v * 12) / periyot) : Math.ceil(v / periyot);
            let dF = (yF / 12) * periyot, bF = dF * (1 + bsmv + kkdf);
            let taksit = (anaPara * bF * Math.pow(1+bF, tSayisi)) / (Math.pow(1+bF, tSayisi)-1);
            
            let vadeMetni = (segment === 'tarimsal') ? `${v} Yıl Vadeli` : `${v} Ay Vadeli`;

            let h = `<div id="${containerId}" style="margin-bottom:20px; border:1px solid #eee; padding:10px; border-radius:8px;">
                <div style="display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:8px 12px; border-radius:5px; font-weight:bold;">
                    <span>${vadeMetni} / ${periyotMetni}</span>
                    <button class="no-print" onclick="tabloYazdir('${containerId}')" style="background:var(--dark); color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:11px;">🖨️ YAZDIR</button>
                </div>
                <div class="table-res"><table><thead><tr><th>Taksit</th><th>Ana Para</th><th>Brüt Faiz</th><th>Vergi</th><th>Taksit Tutarı</th><th>Kalan Anapara</th></tr></thead><tbody>`;
            
            let kalan = anaPara;
            for(let i=1; i<=tSayisi; i++){
                let f = kalan * dF, b = f * (bsmv + kkdf), a = (i===tSayisi) ? kalan : taksit - (f + b);
                h += `<tr><td>${i}</td><td>${Math.round(a).toLocaleString('tr-TR')}</td><td>${Math.round(f).toLocaleString('tr-TR')}</td><td>${Math.round(b).toLocaleString('tr-TR')}</td><td>${Math.round(taksit).toLocaleString('tr-TR')}</td><td>${Math.max(0,Math.round(kalan-a)).toLocaleString('tr-TR')}</td></tr>`;
                kalan -= a;
            }
            res.innerHTML += h + `</tbody></table></div></div>`;
        });
        
        document.getElementById('result-main-container').style.display = 'block';
        document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false;
    }

    function indir() {
        const el = document.getElementById('pdf-area');
        const opt = { margin: 5, filename: 'Odeme_Plani.pdf', html2canvas: { scale: 2, ignoreElements: (e) => e.classList.contains('no-print') }, jsPDF: { unit: 'mm', format: 'a4' } };
        html2pdf().set(opt).from(el).save();
    }
</script>
</body>
</html>
