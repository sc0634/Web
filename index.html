<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --tarimsal: #2ecc71; --ticari: #e67e22; --bireysel: #3498db; --hakkimda: #34495e;
            --success: #27ae60; --dark: #2c3e50; --light: #ecf0f1; --border: #dcdde1;
            --input-height: 40px;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f6fa; margin: 0; padding: 10px; color: var(--dark); font-size: 13px; }
        
        .container { 
            max-width: 1000px; margin: 10px auto; background: #fff; padding: 20px; 
            border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); 
            position: relative; min-height: 400px;
        }
        
        .segment-nav { 
            display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; 
            white-space: nowrap; padding-bottom: 8px; scrollbar-width: none; 
            -ms-overflow-style: none; -webkit-overflow-scrolling: touch;
        }
        .segment-nav::-webkit-scrollbar { display: none; }

        .seg-btn { 
            flex: 1 0 auto; min-width: 95px; border: 2px solid transparent; 
            height: 40px; border-radius: 6px; color: white; font-weight: bold; 
            cursor: pointer; font-size: 11px; opacity: 0.5; transition: all 0.3s ease; padding: 0 15px;
        }
        .seg-btn.active { opacity: 1; border-color: #fff; outline: 2px solid var(--dark); }

        .bg-tar { background: var(--tarimsal); }
        .bg-tic { background: var(--ticari); }
        .bg-bir { background: var(--bireysel); }
        .bg-hak { background: var(--hakkimda); }

        .tabs { display: none; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--light); padding-bottom: 8px; }
        .tab-btn { padding: 6px 10px; border: none; background: #eee; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; }
        .tab-btn.active { background: var(--dark); color: white; }
        
        .grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        
        input, select { 
            height: var(--input-height) !important; padding: 0 5px; 
            border: 1px solid var(--border); border-radius: 5px; 
            font-size: 12px; outline: none; background: white; width: 100%;
        }
        input[readonly] { background-color: #f1f2f6; cursor: not-allowed; color: #7f8c8d; }

        #prof-input-box, #tutar-input-box { width: 125px; flex: 0 0 auto; }
        .px-faiz, .px-vergi { width: 58px !important; }
        .px-periyot { width: 130px; }
        .px-vade-sync { width: 68px !important; }
        
        .px-vade-slider { width: 180px !important; display: none; }
        .slider-container { 
            display: flex; align-items: center; justify-content: space-between; 
            gap: 10px; height: 40px; background: #f8f9fa; border: 1px solid var(--border); 
            border-radius: 5px; padding: 0 10px; width: 100%;
        }
        input[type="range"] { flex: 1; height: 6px !important; cursor: pointer; padding: 0 !important; margin: 0; }
        #vade-val { font-weight: bold; color: var(--dark); min-width: 25px; text-align: right; font-size: 14px; }

        label { 
            font-weight: bold; font-size: 9px; color: #57606f; 
            text-transform: uppercase; height: 32px; display: flex; 
            align-items: flex-end; margin-bottom: 2px; line-height: 1.1; 
            white-space: pre-line; text-align: left;
        }
        
        .compact-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; width: 100%; }
        
        .options-container { 
            width: 100%; display: flex; flex-direction: row; gap: 20px; 
            padding: 10px; background: #fdfdfd; border: 1px dashed var(--border); border-radius: 5px; 
        }
        .opt-row { display: flex; align-items: center; gap: 8px; cursor: pointer; width: fit-content; }
        .opt-row input[type="checkbox"] { 
            width: 16px !important; height: 16px !important; margin: 0; cursor: pointer; flex-shrink: 0;
        }
        .opt-row label { 
            height: auto; margin: 0; font-size: 11px; color: var(--dark); 
            text-transform: none; white-space: nowrap; cursor: pointer; display: inline-block;
        }

        #about-box { display: none; padding: 20px; background: #f8f9fa; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .about-title { font-size: 18px; font-weight: bold; color: var(--dark); margin-bottom: 10px; }
        .about-text { font-size: 14px; line-height: 1.6; color: #57606f; }

        .result-main-container { margin-top: 15px; border: 2px solid var(--dark); border-radius: 6px; overflow: hidden; display: none; }
        .result-main-title { background: var(--dark); color: white; padding: 10px; text-align: center; font-weight: bold; }

        .table-res { overflow-x: auto; width: 100%; background: white; padding: 5px; position: relative; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { padding: 6px 2px; border: 1px solid var(--border); text-align: center; }
        tfoot { background: #f8f9fa; font-weight: bold; }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 8px; margin-top: 15px; }
        .btn { height: 45px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #9b59b6; }
        .btn-print { background: var(--dark); }

        .vade-header { 
            background: #f1f2f6; padding: 8px; font-weight: bold; text-align: center; 
            border-bottom: 1px solid var(--border); font-size: 11px; 
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .single-print-btn {
            position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
            padding: 4px 8px; background: var(--dark); color: white; border: none;
            border-radius: 4px; font-size: 10px; cursor: pointer;
        }

        .visitor-counter { margin-top: 30px; padding-top: 15px; border-top: 1px solid var(--border); text-align: center; }
        .v-grid { display: flex; justify-content: center; gap: 15px; margin-top: 5px; }
        .v-item { font-size: 10px; color: #7f8c8d; font-weight: bold; display: flex; flex-direction: column; gap: 2px; }
        .visitor-count { background: var(--dark); color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }

        @media (max-width: 600px) {
            #prof-input-box, #tutar-input-box { flex: 1; width: auto; min-width: 120px; }
            .px-vade-slider { width: 100% !important; }
            .compact-row { gap: 5px; }
            .field { flex-grow: 1; }
            .options-container { gap: 10px; }
        }

        @media print {
            @page { size: auto; margin: 5mm; }
            body { background: white; padding: 0; }
            .no-print, .single-print-btn, .visitor-counter { display: none !important; }
            .container { width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
            .result-main-container { display: block !important; margin-top: 0; border-width: 1px; }
            table { font-size: 9px !important; }
        }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <div class="segment-nav no-print">
        <button id="seg-tar" class="seg-btn bg-tar" onclick="switchSegment('tarimsal')">TARIMSAL</button>
        <button id="seg-tic" class="seg-btn bg-tic" onclick="switchSegment('ticari')">TİCARİ</button>
        <button id="seg-bir" class="seg-btn bg-bir" onclick="switchSegment('bireysel')">BİREYSEL</button>
        <button id="seg-hak" class="seg-btn bg-hak" onclick="switchSegment('hakkimda')">HAKKIMDA</button>
    </div>

    <div id="calculator-ui">
        <div class="tabs no-print" id="tabs-tarimsal">
            <button class="tab-btn" onclick="switchTab(this, 'traktor')">Traktör</button>
            <button class="tab-btn" onclick="switchTab(this, 'ekipman')">Ekipman</button>
            <button class="tab-btn" onclick="switchTab(this, 'zirai')">Çiftçi Taksitli</button>
        </div>
        <div class="tabs no-print" id="tabs-ticari"><button class="tab-btn" onclick="switchTab(this, 'ticari')">İşletme</button></div>
        <div class="tabs no-print" id="tabs-bireysel"><button class="tab-btn" onclick="switchTab(this, 'tuketici')">İhtiyaç</button></div>

        <div class="grid no-print">
            <div class="field" id="prof-input-box"><label>Proforma&#10;Bedeli</label><input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)"></div>
            <div class="field" id="tutar-input-box"><label>Kredi&#10;Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
            
            <div class="compact-row">
                <div class="field px-faiz"><label>Yıllık&#10;Oran %</label><input type="number" id="faiz" value="46.00" step="0.01" oninput="syncFaiz('yillik')"></div>
                <div class="field px-faiz"><label>Aylık&#10;Oran %</label><input type="number" id="faizAylik" value="3.83" step="0.01" oninput="syncFaiz('aylik')"></div>
                <div class="field px-vergi" id="bsmv-box"><label>BSMV&#10;%</label><input type="number" id="bsmv" value="5" readonly></div>
                <div class="field px-vergi" id="kkdf-box"><label>KKDF&#10;%</label><input type="number" id="kkdf" value="0" readonly></div>
                
                <div class="field px-vade-sync" id="vade-box-select"><label>Vade&#10;Süresi</label><select id="vade-select" onchange="reset()"></select></div>
                
                <div class="field px-vade-slider" id="vade-box-slider">
                    <label>Vade&#10;Süresi</label>
                    <div class="slider-container">
                        <input type="range" id="vade-slider" min="1" max="36" value="12" oninput="updateSliderVal(this.value)">
                        <span id="vade-val">12</span>
                    </div>
                </div>
                <div class="field px-vergi" id="sub-input-box"><label>Sübv.&#10;%</label><input type="number" id="subOran" value="50" oninput="reset()"></div>
            </div>

            <div class="field px-periyot" id="periyot-box"><label>Ödeme Periyodu</label>
                <select id="periyot" onchange="reset()">
                    <option value="1">Aylık</option>
                    <option value="3">3 Ayda Bir</option>
                    <option value="6">6 Ayda Bir</option>
                    <option value="12">Yıllık</option>
                </select>
            </div>

            <div class="options-container" id="ziraiOpts">
                <div class="opt-row">
                    <input type="checkbox" id="yerli" checked onchange="updateYerli()">
                    <label for="yerli">Yerli Malı</label>
                </div>
                <div class="opt-row" id="bb-box">
                    <input type="checkbox" id="buyback" checked onchange="updateYerli()">
                    <label for="buyback">Buy Back</label>
                </div>
            </div>
        </div>

        <div class="actions no-print">
            <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
            <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF</button>
            <button class="btn btn-print" id="printBtn" onclick="window.print()" disabled>TÜMÜNÜ YAZDIR</button>
        </div>

        <div id="result-main-container" class="result-main-container">
            <div class="result-main-title" id="result-title">Ödeme Planı Detayları</div>
            <div id="result-area"></div>
        </div>
    </div>

    <div id="about-box">
        <div class="about-title">Süleyman Coşkun</div>
        <p class="about-text">Bankacılık ve Finans alanında uzmanlaşmış, tarımsal, ticari ve bireysel kredi süreçlerinde doğru analizi ve pratik çözümleri hedefleyen bir bankacıyım.</p>
    </div>

    <div class="visitor-counter no-print">
        <div class="v-grid">
            <div class="v-item">BUGÜN <span id="v-today" class="visitor-count">0</span></div>
            <div class="v-item">BU HAFTA <span id="v-week" class="visitor-count">0</span></div>
            <div class="v-item">BU AY <span id="v-month" class="visitor-count">0</span></div>
        </div>
    </div>
</div>

<script>
    let mode = 'traktor'; let segment = 'tarimsal';
    
    function initApp() { 
        fmtMoney(document.getElementById('proforma'));
        fmtMoney(document.getElementById('tutar'));
        updateVisitorStats();
        switchSegment('tarimsal'); 
    }

    function updateVisitorStats() {
        const now = new Date();
        const todayStr = now.toLocaleDateString();
        const getWeekNumber = (d) => {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        };
        const weekStr = now.getFullYear() + "-W" + getWeekNumber(now);
        const monthStr = now.getFullYear() + "-" + (now.getMonth() + 1);

        let stats = JSON.parse(localStorage.getItem('krediVisitorStats')) || {
            today: { key: todayStr, count: 0 }, week: { key: weekStr, count: 0 }, month: { key: monthStr, count: 0 }
        };

        if (stats.today.key !== todayStr) stats.today = { key: todayStr, count: 1 }; else stats.today.count++;
        if (stats.week.key !== weekStr) stats.week = { key: weekStr, count: 1 }; else stats.week.count++;
        if (stats.month.key !== monthStr) stats.month = { key: monthStr, count: 1 }; else stats.month.count++;

        localStorage.setItem('krediVisitorStats', JSON.stringify(stats));
        document.getElementById('v-today').innerText = stats.today.count;
        document.getElementById('v-week').innerText = stats.week.count;
        document.getElementById('v-month').innerText = stats.month.count;
    }

    function updateSliderVal(val) { document.getElementById('vade-val').innerText = val; reset(); }

    function syncFaiz(src) {
        const y = document.getElementById('faiz'), a = document.getElementById('faizAylik');
        if (src === 'yillik') a.value = (parseFloat(y.value) / 12).toFixed(2);
        else y.value = (parseFloat(a.value) * 12).toFixed(2);
        reset();
    }

    function switchSegment(seg) {
        segment = seg;
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('seg-' + seg.substring(0,3)).classList.add('active');
        const calcUI = document.getElementById('calculator-ui');
        const aboutUI = document.getElementById('about-box');
        if (seg === 'hakkimda') { calcUI.style.display = 'none'; aboutUI.style.display = 'block'; } 
        else {
            calcUI.style.display = 'block'; aboutUI.style.display = 'none';
            document.querySelectorAll('.tabs').forEach(t => t.style.display = 'none');
            document.getElementById(`tabs-${seg}`).style.display = 'flex';
            const firstTab = document.getElementById(`tabs-${seg}`).querySelector('.tab-btn');
            switchTab(firstTab, firstTab.onclick.toString().match(/'(.*?)'/)[1]);
        }
    }

    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); mode = m;
        const isBir = (segment === 'bireysel'), isTic = (segment === 'ticari'), isSub = (mode === 'traktor' || mode === 'ekipman');
        const pSel = document.getElementById('periyot'), bsmvInp = document.getElementById('bsmv'), kkdfInp = document.getElementById('kkdf');
        
        document.getElementById('vade-box-slider').style.display = isBir ? 'flex' : 'none';
        document.getElementById('vade-box-select').style.display = (segment === 'tarimsal' || isBir) ? 'none' : 'flex';
        
        if (segment === 'tarimsal') {
            document.getElementById('periyot-box').style.display = 'none'; pSel.value = "12";
            document.getElementById('ziraiOpts').style.display = isSub ? 'flex' : 'none';
            document.getElementById('sub-input-box').style.display = isSub ? 'flex' : 'none';
            if(mode === 'zirai') { bsmvInp.value = 15; kkdfInp.value = 15; } 
            else { bsmvInp.value = 5; kkdfInp.value = 0; }
        } else {
            document.getElementById('periyot-box').style.display = 'flex'; pSel.value = "1";
            document.getElementById('ziraiOpts').style.display = 'none'; document.getElementById('sub-input-box').style.display = 'none';
            if (isTic) { bsmvInp.value = 5; kkdfInp.value = 0; } 
            else { bsmvInp.value = 15; kkdfInp.value = 15; }
            fillVadeSelect();
        }
        document.getElementById('prof-input-box').style.display = (segment === 'tarimsal' && mode !== 'zirai') ? 'flex' : 'none';
        // OTOMATİK FAİZ DEĞİŞİMİ SİLİNDİ - ARTIK "KENDİ KENDİNE" DEĞİŞMEZ
        reset();
    }

    function fillVadeSelect() {
        const s = document.getElementById('vade-select'); s.innerHTML = '';
        let max = (segment === 'ticari') ? 60 : 36;
        for(let i=1; i<=max; i++){
            let o = document.createElement('option'); o.value = i; o.text = i;
            if(i === 12) o.selected = true;
            s.appendChild(o);
        }
    }

    function fmtMoney(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
        reset();
    }

    function reset() { 
        document.getElementById('result-area').innerHTML = ''; 
        document.getElementById('result-main-container').style.display = 'none';
        document.getElementById('pdfBtn').disabled = true; document.getElementById('printBtn').disabled = true;
    }

    function printDiv(divId) {
        const printContents = document.getElementById(divId).innerHTML;
        const originalContents = document.body.innerHTML;
        document.body.innerHTML = `<div class="container">${printContents}</div>`;
        window.print();
        document.body.innerHTML = originalContents;
        window.location.reload(); 
    }

    function hesapla() {
        const res = document.getElementById('result-area'); res.innerHTML = '';
        const anaParaVal = parseFloat(document.getElementById('tutar').value.replace(/\./g, ""));
        if(isNaN(anaParaVal)) return;
        const yF = document.getElementById('faiz').value / 100, bsmv = document.getElementById('bsmv').value / 100, kkdf = document.getElementById('kkdf').value / 100;
        const periyot = parseInt(document.getElementById('periyot').value);
        const subO = (mode === 'traktor' || mode === 'ekipman') ? document.getElementById('subOran').value / 100 : 0;
        let vades = (segment === 'tarimsal') ? [5, 4, 3, 2, 1] : [(segment === 'bireysel' ? parseInt(document.getElementById('vade-slider').value) : parseInt(document.getElementById('vade-select').value))];

        vades.forEach((v, index) => {
            let tSayisi = (segment === 'tarimsal') ? v : Math.ceil(v / (periyot === 12 ? 1 : periyot));
            let dF = (yF / 12) * periyot;
            let bF = dF * (1 + bsmv + kkdf);
            let taksit = (anaParaVal * bF * Math.pow(1+bF, tSayisi)) / (Math.pow(1+bF, tSayisi)-1);
            let divId = `plan-${index}`;
            let html = `<div id="${divId}" class="vade-group"><div class="vade-header">${v} ${(segment === 'tarimsal') ? 'Yıl' : (periyot === 1 ? 'Ay' : 'Dönem')} Planı<button class="single-print-btn no-print" onclick="printDiv('${divId}')">Yazdır</button></div><div class="table-res"><table><thead><tr><th>Tks</th><th>Ana Para</th><th>Faiz</th>${subO>0?'<th>Sübv.</th>':''}<th>Vergi</th><th>Taksit</th><th>Kalan</th></tr></thead><tbody>`;
            let kalan = anaParaVal; let totA = 0, totF = 0, totV = 0, totT = 0;
            for(let i=1; i<=tSayisi; i++){
                let f = kalan * dF, b = f * (bsmv + kkdf), indF = f * subO, a = (i===tSayisi) ? kalan : taksit - (f + b), sTaksit = taksit - indF;
                totA += a; totF += f; totV += b; totT += sTaksit; kalan -= a;
                html += `<tr><td>${i}</td><td>${Math.round(a).toLocaleString('tr-TR')}</td><td>${Math.round(f).toLocaleString('tr-TR')}</td>${subO>0?`<td style="color:red">-${Math.round(indF).toLocaleString('tr-TR')}</td>`:''}<td>${Math.round(b).toLocaleString('tr-TR')}</td><td>${Math.round(sTaksit).toLocaleString('tr-TR')}</td><td>${Math.max(0,Math.round(kalan)).toLocaleString('tr-TR')}</td></tr>`;
            }
            html += `</tbody><tfoot><tr><td>TOPLAM</td><td>${Math.round(totA).toLocaleString('tr-TR')}</td><td>${Math.round(totF).toLocaleString('tr-TR')}</td>${subO>0?'<td></td>':''}<td>${Math.round(totV).toLocaleString('tr-TR')}</td><td>${Math.round(totT).toLocaleString('tr-TR')}</td><td>-</td></tr></tfoot></table></div></div>`;
            res.innerHTML += html;
        });
        document.getElementById('result-main-container').style.display = 'block';
        document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false;
    }

    function indir() { html2pdf().from(document.getElementById('pdf-area')).set({ margin: 5, filename: 'Kredi_Odeme_Plani.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } }).save(); }
    function updateYerli() { if(mode === 'traktor' || mode === 'ekipman') { const isY = document.getElementById('yerli').checked; document.getElementById('subOran').value = mode === 'traktor' ? (isY ? 50 : 25) : (isY ? 75 : 50); reset(); } }
</script>
</body>
</html>
