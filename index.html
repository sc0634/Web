<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --tarimsal: #2ecc71; --ticari: #e67e22; --bireysel: #3498db;
            --success: #27ae60; --dark: #2c3e50; --light: #ecf0f1; --border: #dcdde1;
            --input-height: 40px;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f6fa; margin: 0; padding: 10px; color: var(--dark); font-size: 13px; }
        
        .container { 
            max-width: 1000px; 
            margin: 10px auto; 
            background: #fff; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 15px rgba(0,0,0,0.1); 
        }
        
        .segment-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .seg-btn { 
            border: 2px solid transparent; height: 40px; border-radius: 6px; color: white; 
            font-weight: bold; cursor: pointer; font-size: 12px; opacity: 0.5; 
            transition: all 0.3s ease;
        }
        .seg-btn.active { opacity: 1; border-color: #fff; outline: 2px solid var(--dark); }

        .bg-tar { background: var(--tarimsal); }
        .bg-tic { background: var(--ticari); }
        .bg-bir { background: var(--bireysel); }

        .tabs { display: none; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--light); padding-bottom: 8px; }
        .tab-btn { padding: 6px 10px; border: none; background: #eee; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; }
        .tab-btn.active { background: var(--dark); color: white; }
        
        .grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        
        input, select { 
            height: var(--input-height) !important; padding: 0 5px; 
            border: 1px solid var(--border); border-radius: 5px; 
            font-size: 12px; outline: none; background: white;
        }

        input[readonly] { background-color: #f1f2f6; cursor: not-allowed; color: #7f8c8d; }

        #prof-input-box, #tutar-input-box { width: 100px !important; }
        #prof-input-box input, #tutar-input-box input { width: 100px !important; }
        .px-faiz, .px-vergi { width: 50px !important; }
        .px-faiz input, .px-vergi input { width: 50px !important; }
        .px-periyot { width: 130px; }

        .px-vade-sync { width: 60px !important; }
        .px-vade-slider { width: 150px !important; display: none; }
        .slider-container { display: flex; align-items: center; gap: 8px; height: 40px; background: #f8f9fa; border: 1px solid var(--border); border-radius: 5px; padding: 0 8px; }
        input[type="range"] { flex: 1; height: 4px !important; cursor: pointer; padding: 0 !important; }
        #vade-val { font-weight: bold; color: var(--dark); min-width: 20px; text-align: center; font-size: 14px; }

        label { 
            font-weight: bold; font-size: 9px; color: #57606f; 
            text-transform: uppercase; height: 32px; display: flex; 
            align-items: flex-end; margin-bottom: 2px; line-height: 1.1; 
            white-space: pre-line;
        }
        
        .compact-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .options-container { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: #fdfdfd; border: 1px dashed var(--border); border-radius: 5px; }
        .opt-row { display: flex; align-items: center; gap: 6px; }

        .result-main-container { margin-top: 15px; border: 2px solid var(--dark); border-radius: 6px; overflow: hidden; display: none; }
        .result-main-title { background: var(--dark); color: white; padding: 10px; text-align: center; font-weight: bold; }

        .table-res { overflow-x: auto; width: 100%; background: white; padding: 5px; position: relative; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { padding: 6px 2px; border: 1px solid var(--border); text-align: center; }
        tfoot { background: #f8f9fa; font-weight: bold; }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 8px; margin-top: 15px; }
        .btn { height: 45px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #9b59b6; }
        .btn-print { background: var(--dark); }

        .vade-header { 
            background: #f1f2f6; padding: 8px; font-weight: bold; text-align: center; 
            border-bottom: 1px solid var(--border); font-size: 11px; 
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .single-print-btn {
            position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
            padding: 4px 8px; background: var(--dark); color: white; border: none;
            border-radius: 4px; font-size: 10px; cursor: pointer;
        }

        @media print {
            @page { size: auto; margin: 5mm; }
            body { background: white; padding: 0; }
            .no-print, .single-print-btn { display: none !important; }
            .container { width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
            .result-main-container { display: block !important; margin-top: 0; border-width: 1px; }
            table { font-size: 9px !important; }
            th, td { padding: 4px 1px !important; }
            .vade-group { page-break-inside: avoid; margin-bottom: 20px; }
        }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <div class="segment-nav no-print">
        <button id="seg-tar" class="seg-btn bg-tar" onclick="switchSegment('tarimsal')">TARIMSAL</button>
        <button id="seg-tic" class="seg-btn bg-tic" onclick="switchSegment('ticari')">TİCARİ</button>
        <button id="seg-bir" class="seg-btn bg-bir" onclick="switchSegment('bireysel')">BİREYSEL</button>
    </div>

    <div class="tabs no-print" id="tabs-tarimsal">
        <button class="tab-btn" onclick="switchTab(this, 'traktor')">Traktör</button>
        <button class="tab-btn" onclick="switchTab(this, 'ekipman')">Ekipman</button>
        <button class="tab-btn" onclick="switchTab(this, 'zirai')">Çiftçi Taksitli</button>
    </div>
    <div class="tabs no-print" id="tabs-ticari"><button class="tab-btn" onclick="switchTab(this, 'ticari')">İşletme</button></div>
    <div class="tabs no-print" id="tabs-bireysel"><button class="tab-btn" onclick="switchTab(this, 'tuketici')">İhtiyaç</button></div>

    <div class="grid no-print">
        <div class="field" id="prof-input-box"><label>Proforma&#10;Bedeli</label><input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)"></div>
        <div class="field" id="tutar-input-box"><label>Kredi&#10;Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
        
        <div class="compact-row">
            <div class="field px-faiz"><label>Yıllık&#10;Oran %</label><input type="number" id="faiz" value="40.50" step="0.01" oninput="syncFaiz('yillik')"></div>
            <div class="field px-faiz"><label>Aylık&#10;Oran %</label><input type="number" id="faizAylik" value="3.38" step="0.01" oninput="syncFaiz('aylik')"></div>
            <div class="field px-vergi" id="bsmv-box"><label>BSMV&#10;%</label><input type="number" id="bsmv" value="5" readonly></div>
            <div class="field px-vergi" id="kkdf-box"><label>KKDF&#10;%</label><input type="number" id="kkdf" value="0" readonly></div>
            
            <div class="field px-vade-sync" id="vade-box-select"><label>Vade&#10;Süresi</label><select id="vade-select" onchange="reset()"></select></div>
            
            <div class="field px-vade-slider" id="vade-box-slider">
                <label>Vade&#10;Süresi</label>
                <div class="slider-container">
                    <input type="range" id="vade-slider" min="1" max="36" value="12" oninput="updateSliderVal(this.value)">
                    <span id="vade-val">12</span>
                </div>
            </div>

            <div class="field px-vergi" id="sub-input-box"><label>Sübv.&#10;%</label><input type="number" id="subOran" value="50" oninput="reset()"></div>
        </div>

        <div class="field px-periyot" id="periyot-box"><label>Ödeme Periyodu</label>
            <select id="periyot" onchange="reset()">
                <option value="1">Aylık</option>
                <option value="3">3 Ayda Bir</option>
                <option value="6">6 Ayda Bir</option>
                <option value="12">Yıllık</option>
            </select>
        </div>

        <div class="options-container" id="ziraiOpts">
            <div class="opt-row"><input type="checkbox" id="yerli" checked onchange="updateYerli()"><label for="yerli">Yerli Malı</label></div>
            <div class="opt-row" id="bb-box"><input type="checkbox" id="buyback" checked onchange="updateYerli()"><label for="buyback">Buy Back</label></div>
        </div>
    </div>

    <div class="actions no-print">
        <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
        <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF</button>
        <button class="btn btn-print" id="printBtn" onclick="window.print()" disabled>TÜMÜNÜ YAZDIR</button>
    </div>

    <div id="result-main-container" class="result-main-container">
        <div class="result-main-title" id="result-title">Ödeme Planı Detayları</div>
        <div id="result-area"></div>
    </div>
</div>

<script>
    let mode = 'traktor'; let segment = 'tarimsal';
    
    function initApp() { 
        fmtMoney(document.getElementById('proforma'));
        fmtMoney(document.getElementById('tutar'));
        switchSegment('tarimsal'); 
    }

    function updateSliderVal(val) {
        document.getElementById('vade-val').innerText = val;
        reset();
    }

    function syncFaiz(src) {
        const y = document.getElementById('faiz'), a = document.getElementById('faizAylik');
        if (src === 'yillik') a.value = (parseFloat(y.value) / 12).toFixed(2);
        else y.value = (parseFloat(a.value) * 12).toFixed(2);
        reset();
    }

    function switchSegment(seg) {
        segment = seg;
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('seg-' + seg.substring(0,3)).classList.add('active');
        document.querySelectorAll('.tabs').forEach(t => t.style.display = 'none');
        document.getElementById(`tabs-${seg}`).style.display = 'flex';
        const firstTab = document.getElementById(`tabs-${seg}`).querySelector('.tab-btn');
        switchTab(firstTab, firstTab.onclick.toString().match(/'(.*?)'/)[1]);
    }

    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); mode = m;
        
        const isBir = (segment === 'bireysel'), isTic = (segment === 'ticari'), isSub = (mode === 'traktor' || mode === 'ekipman');
        const pSel = document.getElementById('periyot');
        const fInp = document.getElementById('faiz');
        const bsmvInp = document.getElementById('bsmv');
        const kkdfInp = document.getElementById('kkdf');
        
        // Tüm modlarda readonly yap
        bsmvInp.readOnly = true; 
        kkdfInp.readOnly = true;

        document.getElementById('vade-box-slider').style.display = isBir ? 'flex' : 'none';
        document.getElementById('vade-box-select').style.display = (segment === 'tarimsal') ? 'none' : (isBir ? 'none' : 'flex');

        if (segment === 'tarimsal') {
            document.getElementById('periyot-box').style.display = 'none';
            pSel.value = "12";
            document.getElementById('ziraiOpts').style.display = isSub ? 'flex' : 'none';
            document.getElementById('bb-box').style.display = (mode === 'ekipman') ? 'none' : 'flex';
            document.getElementById('sub-input-box').style.display = isSub ? 'flex' : 'none';
            
            if(mode === 'zirai') {
                fInp.value = "46.00";
                bsmvInp.value = 15;
                kkdfInp.value = 15;
            } else {
                fInp.value = "40.50";
                bsmvInp.value = 5;
                kkdfInp.value = 0;
            }
        } else if (isTic) {
            document.getElementById('periyot-box').style.display = 'flex';
            pSel.value = "1";
            document.getElementById('ziraiOpts').style.display = 'none';
            document.getElementById('sub-input-box').style.display = 'none';
            fInp.value = "46.00";
            bsmvInp.value = 5;
            kkdfInp.value = 0;
            fillVadeSelect();
        } else {
            document.getElementById('periyot-box').style.display = 'flex';
            pSel.value = "1";
            document.getElementById('ziraiOpts').style.display = 'none';
            document.getElementById('sub-input-box').style.display = 'none';
            fInp.value = "40.50";
            bsmvInp.value = 15;
            kkdfInp.value = 15;
            fillVadeSelect();
        }

        syncFaiz('yillik');
        document.getElementById('prof-input-box').style.display = (segment === 'tarimsal' && mode !== 'zirai') ? 'flex' : 'none';
        reset();
    }

    function fillVadeSelect() {
        const s = document.getElementById('vade-select'); s.innerHTML = '';
        let max = (segment === 'ticari') ? 60 : 36;
        for(let i=1; i<=max; i++){
            let o = document.createElement('option'); o.value = i; o.text = i;
            if(i === 12) o.selected = true;
            s.appendChild(o);
        }
    }

    function fmtMoney(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
        reset();
    }

    function reset() { 
        document.getElementById('result-area').innerHTML = ''; 
        document.getElementById('result-main-container').style.display = 'none';
        document.getElementById('pdfBtn').disabled = true; document.getElementById('printBtn').disabled = true;
    }

    function printDiv(divId) {
        const printContents = document.getElementById(divId).innerHTML;
        const originalContents = document.body.innerHTML;
        document.body.innerHTML = `<div class="container">${printContents}</div>`;
        window.print();
        document.body.innerHTML = originalContents;
        window.location.reload(); 
    }

    function hesapla() {
        const res = document.getElementById('result-area'); res.innerHTML = '';
        const anaParaVal = parseFloat(document.getElementById('tutar').value.replace(/\./g, ""));
        if(isNaN(anaParaVal)) return;
        
        const yF = document.getElementById('faiz').value / 100;
        const bsmv = document.getElementById('bsmv').value / 100;
        const kkdf = document.getElementById('kkdf').value / 100;
        const periyot = parseInt(document.getElementById('periyot').value);
        const subO = (mode === 'traktor' || mode === 'ekipman') ? document.getElementById('subOran').value / 100 : 0;
        
        let vadeDegeri;
        if (segment === 'bireysel') vadeDegeri = parseInt(document.getElementById('vade-slider').value);
        else if (segment === 'ticari') vadeDegeri = parseInt(document.getElementById('vade-select').value);

        let vades = (segment === 'tarimsal') ? [5, 4, 3, 2, 1] : [vadeDegeri];

        vades.forEach((v, index) => {
            let tSayisi = (segment === 'tarimsal') ? v : Math.ceil(v / (periyot === 12 ? 1 : periyot));
            let dF = (yF / 12) * periyot;
            let bF = dF * (1 + bsmv + kkdf);
            let taksit = (anaParaVal * bF * Math.pow(1+bF, tSayisi)) / (Math.pow(1+bF, tSayisi)-1);
            
            let labelVade = (segment === 'tarimsal') ? 'Yıl' : (periyot === 1 ? 'Ay' : 'Dönem');
            let divId = `plan-${index}`;
            
            let html = `<div id="${divId}" class="vade-group">
                <div class="vade-header">
                    ${v} ${labelVade} Planı
                    <button class="single-print-btn no-print" onclick="printDiv('${divId}')">Yazdır</button>
                </div>
                <div class="table-res">
                    <table>
                        <thead>
                            <tr><th>Tks</th><th>Ana Para</th><th>Faiz</th>${subO>0?'<th>Sübv.</th>':''}<th>Vergi</th><th>Taksit</th><th>Kalan</th></tr>
                        </thead>
                        <tbody>`;
            
            let kalan = anaParaVal;
            let totA = 0, totF = 0, totV = 0, totT = 0;

            for(let i=1; i<=tSayisi; i++){
                let f = kalan * dF, b = f * (bsmv + kkdf), indF = f * subO, a = (i===tSayisi) ? kalan : taksit - (f + b), sTaksit = taksit - indF;
                
                totA += a; totF += f; totV += b; totT += sTaksit;
                kalan -= a;

                html += `<tr><td>${i}</td><td>${Math.round(a).toLocaleString('tr-TR')}</td><td>${Math.round(f).toLocaleString('tr-TR')}</td>${subO>0?`<td style="color:red">-${Math.round(indF).toLocaleString('tr-TR')}</td>`:''}<td>${Math.round(b).toLocaleString('tr-TR')}</td><td>${Math.round(sTaksit).toLocaleString('tr-TR')}</td><td>${Math.max(0,Math.round(kalan)).toLocaleString('tr-TR')}</td></tr>`;
            }

            html += `</tbody><tfoot><tr><td>TOPLAM</td><td>${Math.round(totA).toLocaleString('tr-TR')}</td><td>${Math.round(totF).toLocaleString('tr-TR')}</td>${subO>0?'<td></td>':''}<td>${Math.round(totV).toLocaleString('tr-TR')}</td><td>${Math.round(totT).toLocaleString('tr-TR')}</td><td>-</td></tr></tfoot></table></div></div>`;
            res.innerHTML += html;
        });
        
        document.getElementById('result-main-container').style.display = 'block';
        document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false;
    }

    function indir() { 
        const element = document.getElementById('pdf-area'); 
        const opt = { margin: 5, filename: 'Kredi_Odeme_Plani.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } };
        html2pdf().from(element).set(opt).save(); 
    }
    
    function updateYerli() { 
        if(mode === 'traktor' || mode === 'ekipman') { 
            const isY = document.getElementById('yerli').checked; 
            document.getElementById('subOran').value = mode === 'traktor' ? (isY ? 50 : 25) : (isY ? 75 : 50); 
            reset(); 
        } 
    }
</script>
</body>
</html>
