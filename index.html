<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Planı</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --tarimsal: #2ecc71; --ticari: #e67e22; --bireysel: #3498db;
            --success: #27ae60; --dark: #2c3e50; --light: #ecf0f1; --border: #dcdde1;
            --danger: #e74c3c;
            --input-height: 40px;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f5f6fa; margin: 0; padding: 10px; color: var(--dark); font-size: 13px; }
        .container { max-width: 1000px; margin: 10px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        
        .segment-nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 8px; }
        .seg-btn { flex: 1 0 auto; min-width: 95px; border: 2px solid transparent; height: 40px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; opacity: 0.5; transition: 0.3s; }
        .seg-btn.active { opacity: 1; border-color: #fff; outline: 2px solid var(--dark); }
        .bg-tar { background: var(--tarimsal); } .bg-tic { background: var(--ticari); } .bg-bir { background: var(--bireysel); }
        
        .tabs { display: none; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--light); padding-bottom: 8px; }
        .tab-btn { padding: 6px 10px; border: none; background: #eee; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; }
        .tab-btn.active { background: var(--dark); color: white; }
        
        .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; font-weight: 600; color: var(--dark); display: block; white-space: nowrap; }
        input, select { height: var(--input-height); padding: 0 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; outline: none; width: 100%; }
        input[readonly] { background-color: #f1f2f6; color: #7f8c8d; }

        .isletme-grid { display: flex; flex-wrap: nowrap; gap: 10px; align-items: flex-end; }
        .isletme-grid .field { flex: 1; min-width: 0; } 

        /* Checkbox Mobilde Yan Yana Sabitleme */
        .options-container { display: none; width: 100%; padding: 12px; background: #fdfdfd; border: 1px solid var(--light); border-radius: 5px; margin: 10px 0; }
        .opt-flex { display: flex; flex-wrap: nowrap; gap: 10px; width: 100%; }
        .opt-item { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .opt-row { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; font-size: 12px; white-space: nowrap; }
        .opt-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; flex-shrink: 0; }

        .dynamic-msg { font-size: 10px; font-weight: 500; font-style: italic; line-height: 1.2; padding-left: 24px; min-height: 24px; }
        .msg-green { color: var(--success); font-weight: 700; font-style: normal; }
        .msg-blink { color: var(--danger); font-weight: 700; font-style: normal; animation: blinker 1.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }

        .result-main-container { margin-top: 15px; border: 1px solid var(--dark); border-radius: 6px; overflow: hidden; display: none; }
        .result-main-title { background: var(--dark); color: white; padding: 8px; text-align: center; font-weight: bold; }
        table { width: 100%; font-size: 11px; border-collapse: collapse; }
        table th, table td { border: 1px solid #ddd; padding: 4px; text-align: center; }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 8px; margin-top: 15px; }
        .btn { height: 45px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .btn-calc { background: var(--success); } .btn-pdf { background: #9b59b6; } .btn-print { background: var(--dark); }

        #isletme-ozel { display: none; padding: 12px; background: #fcfcfc; border: 1px solid var(--border); border-radius: 5px; margin-bottom: 10px; }
        
        @media print { .no-print { display: none !important; } .container { box-shadow: none; padding: 0; } }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <div class="segment-nav no-print">
        <button id="seg-tar" class="seg-btn bg-tar" onclick="switchSegment('tarimsal')">TARIMSAL</button>
        <button id="seg-tic" class="seg-btn bg-tic" onclick="switchSegment('ticari')">TİCARİ</button>
        <button id="seg-bir" class="seg-btn bg-bir" onclick="switchSegment('bireysel')">BİREYSEL</button>
    </div>

    <div id="calculator-ui">
        <div class="tabs no-print" id="tabs-tarimsal">
            <button class="tab-btn" onclick="switchTab(this, 'traktor')">Traktör</button>
            <button class="tab-btn" onclick="switchTab(this, 'ekipman')">Ekipman</button>
            <button class="tab-btn" onclick="switchTab(this, 'zirai')">Çiftçi Taksitli</button>
            <button class="tab-btn" onclick="switchTab(this, 'isletme')">İşletme Kredisi</button>
        </div>
        <div class="tabs no-print" id="tabs-ticari"><button class="tab-btn" onclick="switchTab(this, 'ticari_taksitli')">Ticari Taksitli</button></div>
        <div class="tabs no-print" id="tabs-bireysel">
            <button class="tab-btn" onclick="switchTab(this, 'konut')">Konut</button>
            <button class="tab-btn" onclick="switchTab(this, 'tasit')">Taşıt</button>
            <button class="tab-btn" onclick="switchTab(this, 'ihtiyac')">İhtiyaç</button>
        </div>

        <div id="isletme-ozel" class="no-print">
            <div class="isletme-grid">
                <div class="field"><label>Küçükbaş Sayısı</label><input type="number" id="hayvanSayisi" oninput="hesaplaHayvan()"></div>
                <div class="field"><label>Hesaplanan Tutar</label><input type="text" id="hayvanSonuc" readonly style="font-weight:bold; color:var(--success);"></div>
            </div>
        </div>

        <div id="calc-fields" class="grid no-print">
            <div class="field" style="width:140px;"><label>Kredi Tutarı</label><input type="text" id="tutar" oninput="fmtMoney(this)"></div>
            <div class="field" style="width:75px;"><label>Aylık %</label><input type="number" id="faizAylik" step="0.01" oninput="updateFaiz('aylik')"></div>
            <div class="field" style="width:75px;"><label>Yıllık %</label><input type="number" id="faiz" step="0.01" oninput="updateFaiz('yillik')"></div>
            <div class="field" id="box-vade" style="width:90px;"><label>Vade (Ay)</label><select id="vade-select" onchange="resetResults()"></select></div>
            <div class="field" id="box-sub" style="width:70px;"><label>Sübv. %</label><input type="number" id="subOran" oninput="updateSub()"></div>
            <div class="field" style="width:65px;"><label>BSMV %</label><input type="number" id="bsmv" readonly></div>
            <div class="field" style="width:65px;"><label>KKDF %</label><input type="number" id="kkdf" readonly></div>
        </div>

        <div class="options-container no-print" id="extra-opts">
            <div class="opt-flex">
                <div class="opt-item" id="col-yerli">
                    <label class="opt-row">
                        <input type="checkbox" id="yerli" checked onchange="handleYerli()"> Yerli Malı
                    </label>
                    <div id="msg-yerli" class="dynamic-msg" style="color: #666;"></div>
                </div>
                
                <div class="opt-item" id="col-bb">
                    <label class="opt-row">
                        <input type="checkbox" id="buyback" checked onchange="updateDynamicTexts()"> Buy Back
                    </label>
                    <div id="msg-buyback" class="dynamic-msg"></div>
                </div>
            </div>
        </div>

        <div class="actions no-print" id="action-group">
            <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
            <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF İNDİR</button>
            <button class="btn btn-print" id="printBtn" onclick="window.print()" disabled>YAZDIR</button>
        </div>

        <div id="result-main-container" class="result-main-container">
            <div class="result-main-title">Ödeme Planı Detayları</div>
            <div id="result-area" style="padding:10px;"></div>
        </div>
    </div>
</div>

<script>
    let currentMode = 'traktor';
    const states = {
        traktor: { faiz: 40.50, bsmv: 5, kkdf: 0, sub: 50, defVade: 60 },
        ekipman: { faiz: 40.50, bsmv: 5, kkdf: 0, sub: 75, defVade: 60 },
        zirai: { faiz: 46.00, bsmv: 15, kkdf: 15, sub: 0, defVade: 12 },
        isletme: { faiz: 40.50, bsmv: 5, kkdf: 0, sub: 0, defVade: 12 },
        ticari_taksitli: { faiz: 46.00, bsmv: 5, kkdf: 0, sub: 0, defVade: 12 },
        konut: { faiz: 34.08, bsmv: 0, kkdf: 0, sub: 0, defVade: 120 },
        tasit: { faiz: 40.50, bsmv: 15, kkdf: 15, sub: 0, defVade: 48 },
        ihtiyac: { faiz: 52.68, bsmv: 15, kkdf: 15, sub: 0, defVade: 24 }
    };

    function updateDynamicTexts() {
        const isYerli = document.getElementById('yerli').checked;
        const isBB = document.getElementById('buyback').checked;
        const msgYerli = document.getElementById('msg-yerli');
        const msgBB = document.getElementById('msg-buyback');

        msgYerli.innerText = isYerli ? "Faizin %25'ini devlet ödemektedir." : "";

        if (isBB) {
            msgBB.innerText = "Krediniz sabit faizlidir.";
            msgBB.className = "dynamic-msg msg-green";
        } else {
            msgBB.innerText = "Krediniz değişken faizlidir.";
            msgBB.className = "dynamic-msg msg-blink";
        }
    }

    function initApp() { document.getElementById('tutar').value = "1.000.000"; fmtMoney(document.getElementById('tutar')); switchSegment('tarimsal'); }
    
    function switchSegment(seg) {
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('seg-' + seg.substring(0,3)).classList.add('active');
        document.querySelectorAll('.tabs').forEach(t => t.style.display = 'none');
        const tabEl = document.getElementById(`tabs-${seg}`);
        tabEl.style.display = 'flex';
        tabEl.querySelector('.tab-btn').click();
    }

    function switchTab(btn, mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const s = states[mode];
        const isIsletme = (mode === 'isletme');
        const isTarimVadesiz = (mode === 'traktor' || mode === 'ekipman' || mode === 'zirai');
        const isSubActive = (mode === 'traktor' || mode === 'ekipman');

        document.getElementById('action-group').style.display = isIsletme ? 'none' : 'grid';
        document.getElementById('isletme-ozel').style.display = isIsletme ? 'block' : 'none';
        document.getElementById('calc-fields').style.display = isIsletme ? 'none' : 'flex';
        document.getElementById('box-vade').style.display = isTarimVadesiz ? 'none' : 'flex';
        document.getElementById('box-sub').style.display = isSubActive ? 'flex' : 'none';
        
        document.getElementById('extra-opts').style.display = isSubActive ? 'block' : 'none';
        document.getElementById('col-yerli').style.display = isSubActive ? 'flex' : 'none';
        document.getElementById('col-bb').style.display = (mode === 'traktor') ? 'flex' : 'none';

        if(!isIsletme) {
            document.getElementById('faiz').value = s.faiz.toFixed(2);
            document.getElementById('faizAylik').value = (s.faiz / 12).toFixed(2);
            document.getElementById('subOran').value = s.sub;
            document.getElementById('bsmv').value = s.bsmv;
            document.getElementById('kkdf').value = s.kkdf;
            const vSel = document.getElementById('vade-select'); vSel.innerHTML = '';
            const maxV = (mode === 'konut') ? 120 : 60;
            for(let i=12; i<=maxV; i+=12) {
                let o = document.createElement('option'); o.value = i; o.text = i + " Ay";
                if(i === s.defVade) o.selected = true;
                vSel.appendChild(o);
            }
        }
        updateDynamicTexts();
        resetResults();
    }

    function handleYerli() {
        const isYerli = document.getElementById('yerli').checked;
        if(currentMode === 'traktor') states.traktor.sub = isYerli ? 50 : 25;
        if(currentMode === 'ekipman') states.ekipman.sub = isYerli ? 75 : 50;
        document.getElementById('subOran').value = states[currentMode].sub;
        updateDynamicTexts();
        resetResults();
    }

    function updateSub() { states[currentMode].sub = parseFloat(document.getElementById('subOran').value) || 0; resetResults(); }
    function updateFaiz(type) { const y = document.getElementById('faiz'), a = document.getElementById('faizAylik'); if (type === 'yillik') a.value = (parseFloat(y.value) / 12).toFixed(2); else y.value = (parseFloat(a.value) * 12).toFixed(2); states[currentMode].faiz = parseFloat(y.value); resetResults(); }
    function fmtMoney(i) { let v = i.value.replace(/\D/g, ""); if(v) i.value = new Intl.NumberFormat('tr-TR').format(v); resetResults(); }
    function resetResults() { document.getElementById('result-main-container').style.display = 'none'; document.getElementById('pdfBtn').disabled = true; document.getElementById('printBtn').disabled = true; }
    function hesaplaHayvan() { const sayi = document.getElementById('hayvanSayisi').value || 0; document.getElementById('hayvanSonuc').value = new Intl.NumberFormat('tr-TR').format(sayi * 5000) + " TL"; }
    
    function hesapla() {
        const res = document.getElementById('result-area'); res.innerHTML = '';
        const tutar = parseFloat(document.getElementById('tutar').value.replace(/\./g, "")) || 0;
        const yF = parseFloat(document.getElementById('faiz').value) / 100;
        const b = parseFloat(document.getElementById('bsmv').value) / 100;
        const k = parseFloat(document.getElementById('kkdf').value) / 100;
        const sub = (parseFloat(document.getElementById('subOran').value) || 0) / 100;
        const vade = parseInt(document.getElementById('vade-select').value) || 12;

        const aylikBrut = (yF / 12) * (1 - sub) * (1 + b + k);
        const taksit = (tutar * aylikBrut * Math.pow(1+aylikBrut, vade)) / (Math.pow(1+aylikBrut, vade)-1);

        let html = `<table><thead><tr style="background:#eee"><th>Tks</th><th>Ana Para</th><th>Faiz+Vergi</th><th>Kalan</th><th>Tutar</th></tr></thead><tbody>`;
        let kalan = tutar;
        for(let i=1; i<=vade; i++) {
            let fv = kalan * aylikBrut; let ana = taksit - fv;
            if(i === vade) ana = kalan;
            kalan -= ana;
            html += `<tr><td>${i}</td><td>${Math.round(ana).toLocaleString('tr-TR')}</td><td>${Math.round(fv).toLocaleString('tr-TR')}</td><td>${Math.max(0, Math.round(kalan)).toLocaleString('tr-TR')}</td><td>${Math.round(taksit).toLocaleString('tr-TR')}</td></tr>`;
        }
        res.innerHTML = html + `</tbody></table>`;
        document.getElementById('result-main-container').style.display = 'block';
        document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false;
    }

    function indir() {
        html2pdf().set({ margin: 5, filename: 'Kredi_Plani.pdf', html2canvas: { scale: 2 }, jsPDF: { format: 'a4' } })
        .from(document.getElementById('pdf-area')).save();
    }
</script>
</body>
</html>
