<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --genel: #95a5a6; --tarimsal: #2ecc71; --ticari: #e67e22; --bireysel: #3498db; --hakkimda: #34495e;
            --success: #27ae60; --danger: #e74c3c; --dark: #2c3e50; --light: #ecf0f1; --border: #dcdde1;
            --input-height: 40px;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f6fa; margin: 0; padding: 10px; color: var(--dark); font-size: 13px; }
        
        .container { 
            max-width: 1000px; margin: 10px auto; background: #fff; padding: 20px; 
            border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); 
            position: relative; min-height: 200px;
        }
        
        .segment-nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; white-space: nowrap; padding-bottom: 8px; width: 100%; }
        .seg-btn { 
            flex: 1 0 auto; min-width: 95px; border: 2px solid transparent; 
            height: 40px; border-radius: 6px; color: white; font-weight: bold; 
            cursor: pointer; font-size: 11px; opacity: 0.5; transition: 0.3s; padding: 0 15px;
        }
        .seg-btn.active { opacity: 1; border-color: #fff; outline: 2px solid var(--dark); }
        .bg-gen { background: var(--genel); } .bg-tar { background: var(--tarimsal); } .bg-tic { background: var(--ticari); }
        .bg-bir { background: var(--bireysel); } .bg-hak { background: var(--hakkimda); }

        .tabs { display: none; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--light); padding-bottom: 8px; }
        .tab-btn { padding: 6px 10px; border: none; background: #eee; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; }
        .tab-btn.active { background: var(--dark); color: white; }
        
        .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        
        input, select, textarea { 
            height: var(--input-height); padding: 0 8px; 
            border: 1px solid var(--border); border-radius: 5px; 
            font-size: 12px; outline: none; background: white; width: 100%;
        }
        textarea { height: 80px; padding: 8px; resize: none; }
        input[readonly] { background-color: #f1f2f6; color: #7f8c8d; cursor: not-allowed; }

        .options-container { 
            display: flex; flex-direction: row; gap: 10px; width: 100%;
            padding: 12px; background: #fdfdfd; border: 1px dashed var(--border); border-radius: 5px; 
            margin: 10px 0; flex-wrap: wrap; align-items: center;
        }
        .opt-row { display: flex; align-items: center; gap: 6px; cursor: pointer; min-width: 90px; }
        .opt-row input[type="checkbox"] { width: 14px; height: 14px; margin: 0; cursor: pointer; flex-shrink: 0; }
        
        .result-main-container { margin-top: 15px; border: 2px solid var(--dark); border-radius: 6px; overflow: hidden; display: none; }
        .result-main-title { background: var(--dark); color: white; padding: 10px; text-align: center; font-weight: bold; }
        
        /* Başvuru Konteynırı */
        .apply-container { margin-top: 20px; padding: 20px; border: 1px solid var(--border); border-radius: 8px; background: #f9f9f9; display: none; }
        .apply-title { font-weight: bold; font-size: 14px; margin-bottom: 15px; color: var(--dark); border-bottom: 2px solid var(--success); padding-bottom: 5px; }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 8px; margin-top: 15px; }
        .btn { height: 45px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #9b59b6; }
        .btn-print { background: var(--dark); }
        .btn-apply { background: var(--success); width: 100%; margin-top: 10px; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">

    <div class="segment-nav no-print">
        <button id="seg-tar" class="seg-btn bg-tar" onclick="switchSegment('tarimsal')">TARIMSAL</button>
        <button id="seg-tic" class="seg-btn bg-tic" onclick="switchSegment('ticari')">TİCARİ</button>
        <button id="seg-bir" class="seg-btn bg-bir" onclick="switchSegment('bireysel')">BİREYSEL</button>
        <button id="seg-hak" class="seg-btn bg-hak" onclick="switchSegment('hakkimda')">HAKKIMDA</button>
        <button id="seg-gen" class="seg-btn bg-gen" onclick="switchSegment('genel')">GENEL VERİLER</button>
    </div>

    <div id="calculator-ui">
        <div id="content-genel" style="display:none; padding:20px; text-align:center; color:#7f8c8d;">
            Henüz genel veri girişi yapılmamıştır.
        </div>

        <div class="tabs no-print" id="tabs-tarimsal">
            <button class="tab-btn" onclick="switchTab(this, 'traktor')">Traktör</button>
            <button class="tab-btn" onclick="switchTab(this, 'ekipman')">Ekipman</button>
            <button class="tab-btn" onclick="switchTab(this, 'zirai')">Çiftçi Taksitli</button>
            <button class="tab-btn" onclick="switchTab(this, 'isletme')">İşletme Kredisi</button>
        </div>
        
        <div class="tabs no-print" id="tabs-ticari">
            <button class="tab-btn" onclick="switchTab(this, 'ticari_taksitli')">Ticari Taksitli</button>
        </div>

        <div class="tabs no-print" id="tabs-bireysel">
            <button class="tab-btn" onclick="switchTab(this, 'konut')">Konut</button>
            <button class="tab-btn" onclick="switchTab(this, 'tasit')">Taşıt</button>
            <button class="tab-btn" onclick="switchTab(this, 'ihtiyac')">İhtiyaç</button>
        </div>

        <div id="calc-fields" class="grid no-print">
            <div class="field" style="width:140px;"><label>Proforma Bedeli</label><input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)"></div>
            <div class="field" style="width:140px;"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
            <div class="field" style="width:65px;"><label>Yıllık %</label><input type="number" id="faiz" value="40.50" step="0.01" oninput="syncFaiz('yillik')"></div>
            <div class="field" style="width:65px;"><label>Aylık %</label><input type="number" id="faizAylik" value="3.38" step="0.01" oninput="syncFaiz('aylik')"></div>
            <div class="field" style="width:65px;"><label>BSMV %</label><input type="number" id="bsmv" value="5" readonly></div>
            <div class="field" style="width:65px;"><label>KKDF %</label><input type="number" id="kkdf" value="0" readonly></div>
            <div class="field" style="width:85px;" id="vade-box-select"><label>Vade</label><select id="vade-select" onchange="reset()"></select></div>
            <div class="field" style="width:70px;" id="sub-input-box"><label>İndirim %</label><input type="number" id="subOran" value="50" readonly></div>
            <div class="field" style="width:130px;" id="periyot-box"><label>Ödeme Periyodu</label><select id="periyot" onchange="reset()"></select></div>
        </div>

        <div class="options-container no-print" id="ziraiOpts">
            <div class="opt-row"><input type="checkbox" id="yerli" checked onchange="updateYerli()"><label for="yerli">Yerli Malı</label></div>
            <div class="opt-row" id="bb-box"><input type="checkbox" id="buyback" checked onchange="reset()"><label for="buyback">Buy Back</label></div>
        </div>

        <div class="actions no-print" id="calc-actions">
            <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
            <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF İNDİR</button>
            <button class="btn btn-print" id="printBtn" onclick="window.print()" disabled>YAZDIR</button>
        </div>

        <div id="result-main-container" class="result-main-container">
            <div class="result-main-title">Ödeme Planı Detayları</div>
            <div id="result-area" style="padding:10px;"></div>
        </div>

        <!-- Başvuru Bölümü -->
        <div id="apply-section" class="apply-container no-print">
            <div class="apply-title">Hemen Başvur</div>
            <div class="grid" style="gap:15px;">
                <div class="field" style="flex:1; min-width:200px;">
                    <label>TC Kimlik Numarası</label>
                    <input type="text" id="app-tckn" maxlength="11" placeholder="11 Haneli TCKN">
                </div>
                <div class="field" style="flex:1; min-width:200px;">
                    <label>Cep Telefonu</label>
                    <input type="tel" id="app-phone" placeholder="05xx xxx xx xx">
                </div>
                <div class="field" style="width:100%;">
                    <label>Açıklama / Not</label>
                    <textarea id="app-note" placeholder="Eklemek istediğiniz notlar..."></textarea>
                </div>
                <button class="btn btn-apply" onclick="alert('Başvurunuz iletilmiştir.')">BAŞVURUYU TAMAMLA</button>
            </div>
        </div>
    </div>

    <div id="about-box" style="display:none; padding:40px; text-align:center;">
        <h2 style="color:var(--dark)">Süleyman Coşkun</h2>
        <p>Finansal Çözümler ve Kredi Danışmanlığı</p>
    </div>
</div>

<script>
    let mode = 'traktor'; let segment = 'tarimsal';
    function initApp() { fmtMoney(document.getElementById('proforma')); fmtMoney(document.getElementById('tutar')); switchSegment('tarimsal'); }
    
    function syncFaiz(src) {
        const y = document.getElementById('faiz'), a = document.getElementById('faizAylik');
        if (src === 'yillik') a.value = (parseFloat(y.value) / 12).toFixed(2);
        else y.value = (parseFloat(a.value) * 12).toFixed(2);
        reset();
    }

    function switchSegment(seg) {
        segment = seg;
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('seg-' + seg.substring(0,3)).classList.add('active');
        
        const isSpecial = (seg === 'hakkimda' || seg === 'genel');
        document.getElementById('calculator-ui').style.display = seg === 'hakkimda' ? 'none' : 'block';
        document.getElementById('about-box').style.display = seg === 'hakkimda' ? 'block' : 'none';
        document.getElementById('content-genel').style.display = seg === 'genel' ? 'block' : 'none';
        document.getElementById('calc-fields').style.display = isSpecial ? 'none' : 'flex';
        document.getElementById('calc-actions').style.display = isSpecial ? 'none' : 'grid';

        document.querySelectorAll('.tabs').forEach(t => t.style.display = 'none');
        if (!isSpecial) {
            const tabEl = document.getElementById(`tabs-${seg}`);
            if(tabEl) { tabEl.style.display = 'flex'; tabEl.querySelector('.tab-btn').click(); }
        }
        reset();
    }

    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); mode = m;
        const isSub = (mode === 'traktor' || mode === 'ekipman');
        const showVadePeriyot = (segment !== 'tarimsal' || mode === 'isletme');
        document.getElementById('vade-box-select').style.display = showVadePeriyot ? 'flex' : 'none';
        document.getElementById('periyot-box').style.display = showVadePeriyot ? 'flex' : 'none';
        document.getElementById('ziraiOpts').style.display = isSub ? 'flex' : 'none';
        document.getElementById('sub-input-box').style.display = isSub ? 'flex' : 'none';
        fillVades(segment === 'ticari' ? 60 : 36);
        updatePeriyotOptions();
        reset();
    }

    function updatePeriyotOptions() {
        const p = document.getElementById('periyot'); p.innerHTML = '';
        const opts = [{v:"1",t:"Aylık"}, {v:"3",t:"3 Ayda Bir"}, {v:"6",t:"6 Ayda Bir"}, {v:"12",t:"Yıllık"}];
        opts.forEach(o => { let el = document.createElement('option'); el.value = o.v; el.text = o.t; p.appendChild(el); });
        p.value = segment === 'tarimsal' ? "12" : "1";
    }

    function fillVades(max) {
        const s = document.getElementById('vade-select'); s.innerHTML = '';
        for(let i=1; i<=max; i++) {
            let o = document.createElement('option'); o.value = i; o.text = i + " Ay";
            if(i===12) o.selected = true; s.appendChild(o);
        }
    }

    function fmtMoney(i) { let v = i.value.replace(/\D/g, ""); if(v) i.value = new Intl.NumberFormat('tr-TR').format(v); reset(); }
    
    function reset() { 
        document.getElementById('result-main-container').style.display = 'none'; 
        document.getElementById('apply-section').style.display = 'none'; // Segment/Tab değişince gizle
        document.getElementById('pdfBtn').disabled = true; 
        document.getElementById('printBtn').disabled = true; 
    }

    function updateYerli() { 
        if(mode === 'traktor') document.getElementById('subOran').value = document.getElementById('yerli').checked ? 50 : 25;
        else if(mode === 'ekipman') document.getElementById('subOran').value = document.getElementById('yerli').checked ? 75 : 50;
        reset(); 
    }

    function hesapla() {
        const res = document.getElementById('result-area'); res.innerHTML = '';
        const anaPara = parseFloat(document.getElementById('tutar').value.replace(/\./g, "")) || 0;
        if(anaPara <= 0) return;

        const yF = document.getElementById('faiz').value / 100, bsmv = document.getElementById('bsmv').value / 100, kkdf = document.getElementById('kkdf').value / 100;
        const periyot = (segment === 'tarimsal' && mode !== 'isletme') ? 12 : parseInt(document.getElementById('periyot').value);
        const subO = (segment === 'tarimsal' && (mode === 'traktor' || mode === 'ekipman')) ? document.getElementById('subOran').value / 100 : 0;
        
        let vades = (segment === 'tarimsal' && mode !== 'isletme') ? [5, 4, 3, 2, 1] : [parseInt(document.getElementById('vade-select').value)];
        
        vades.forEach(v => {
            let tSayisi = (segment === 'tarimsal' && mode !== 'isletme') ? v : Math.ceil(v / periyot);
            let dF = (yF / 12) * periyot, bF = dF * (1 + bsmv + kkdf);
            let taksit = (anaPara * bF * Math.pow(1+bF, tSayisi)) / (Math.pow(1+bF, tSayisi)-1);
            let label = (segment === 'tarimsal' && mode !== 'isletme') ? `${v} Yıl` : `${v} Ay`;
            let h = `<div style="margin-bottom:15px"><div style="background:#f1f2f6;padding:8px;text-align:center;font-weight:bold">${label}</div><table style="width:100%;font-size:11px;border-collapse:collapse;"><thead><tr style="background:#eee"><th>Tks</th><th>Ana Para</th><th>Brüt Faiz</th>${subO>0?'<th>Ind. Faiz</th>':''}<th>Taksit</th></tr></thead><tbody>`;
            let kalan = anaPara;
            for(let i=1; i<=tSayisi; i++){
                let f = kalan * dF, b = f * (bsmv + kkdf), ind = f * subO, a = (i===tSayisi) ? kalan : taksit - (f + b);
                h += `<tr style="text-align:center;border-bottom:1px solid #ddd"><td>${i}</td><td>${Math.round(a).toLocaleString('tr-TR')}</td><td>${Math.round(f+b).toLocaleString('tr-TR')}</td>${subO>0?`<td>${Math.round(ind).toLocaleString('tr-TR')}</td>`:''}<td>${Math.round(taksit-ind).toLocaleString('tr-TR')}</td></tr>`;
                kalan -= a;
            }
            h += `</tbody></table></div>`; res.innerHTML += h;
        });

        document.getElementById('result-main-container').style.display = 'block';
        // Sadece Hakkımda ve Genel Veriler değilse göster
        if(segment !== 'hakkimda' && segment !== 'genel') {
            document.getElementById('apply-section').style.display = 'block';
        }
        document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false;
    }

    function indir() {
        const el = document.getElementById('pdf-area');
        html2pdf().set({ margin: 5, filename: 'Kredi_Plani.pdf', html2canvas: { scale: 2, ignoreElements: (e) => e.classList.contains('no-print') }, jsPDF: { unit: 'mm', format: 'a4' } }).from(el).save();
    }
</script>
</body>
</html>
