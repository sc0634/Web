<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --navy: #0f172a; --blue: #2563eb; --gray: #64748b; --border: #e2e8f0; --success: #10b981; --accent: #f59e0b; --red: #ef4444; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f8fafc; margin: 0; padding: 10px; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .tabs { display: flex; background: var(--navy); border-radius: 8px; padding: 4px; gap: 4px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 80px; padding: 12px 2px; color: #cbd5e1; border: none; background: transparent; font-weight: 700; border-radius: 6px; font-size: 10px; cursor: pointer; line-height: 1.2; text-transform: uppercase; }
        .tab-btn.active { background: var(--blue); color: #fff; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: #f1f5f9; padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field-row { grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        label { font-size: 10px; font-weight: 800; color: var(--gray); text-transform: uppercase; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; width: 100%; }
        
        .options-row { grid-column: span 2; display: flex; gap: 15px; margin-top: 5px; padding-top: 10px; border-top: 1px solid #e2e8f0; }
        .opt { display: flex; align-items: center; gap: 2px; cursor: pointer; }
        .opt input[type="checkbox"] { width: 16px; height: 16px; margin: 0; cursor: pointer; }
        .opt label { font-size: 11px; color: var(--navy); font-weight: 600; cursor: pointer; line-height: 1.2; margin-bottom: 0; text-transform: none; }
        
        .hazine-label { display: block; font-size: 8px; color: #1e40af; font-style: italic; font-weight: 600; margin-top: 2px; }
        .status-label { display: block; font-size: 9px; color: var(--gray); font-weight: 700; margin-top: 2px; }
        
        .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin: 20px 0; }
        .btn { padding: 14px 5px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; color: #fff; text-transform: uppercase; font-size: 12px; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #6366f1; }
        .btn-print { background: var(--navy); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .table-res { overflow-x: auto; margin-top: 10px; width: calc(100% + 6px); margin-left: -3px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 100%; }
        th { background: #1e293b; color: #fff; padding: 10px 2px; font-size: 10px; border: 1px solid #334155; }
        td { padding: 10px 2px; text-align: center; border: 1px solid var(--border); font-weight: 400; color: #000; font-size: 13px; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .total-row td { background: #f1f5f9 !important; font-weight: 800 !important; color: var(--navy); border-top: 2px solid var(--navy); }

        .expense-box { margin-top: 20px; padding: 15px; border-radius: 10px; background: #fff5f5; border: 1px solid #fecaca; }
        .expense-box h3 { margin: 0 0 10px 0; font-size: 13px; color: var(--red); text-transform: uppercase; border-bottom: 1px solid #fecaca; padding-bottom: 5px; }
        .expense-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .exp-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 8px; border-radius: 6px; border: 1px solid #fee2e2; }
        .exp-item span:first-child { font-size: 11px; font-weight: 700; color: var(--gray); }
        .exp-item span:last-child { font-size: 12px; font-weight: 800; color: var(--navy); }

        /* GÜNCELLENMİŞ BAŞVURU FORMU */
        .apply-box { margin-top: 20px; padding: 20px; border: 2px solid var(--blue); border-radius: 12px; background: #f0f7ff; }
        .apply-box h3 { margin-top: 0; color: var(--navy); font-size: 14px; text-align: center; text-transform: uppercase; }
        .apply-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .apply-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .btn-send { background: var(--blue); width: 100%; margin-top: 10px; padding: 15px; font-size: 14px; }

        @media (min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        @media print { .no-print { display: none !important; } .container { box-shadow: none; width: 100%; padding: 0; } }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <div class="tabs no-print">
        <button class="tab-btn active" onclick="switchTab(this, 'traktor')">ZİRAİ <br> TRAKTÖR</button>
        <button class="tab-btn" onclick="switchTab(this, 'ticari')">TİCARİ</button>
        <button class="tab-btn" onclick="switchTab(this, 'zirai')">ÇİFTÇİ <br> TAKSİTLİ</button>
        <button class="tab-btn" onclick="switchTab(this, 'tuketici')">TÜKETİCİ</button>
    </div>

    <div id="calc-panel">
        <div class="grid no-print">
            <div class="field-row">
                <div class="field"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
                <div class="field"><label>Vade</label><select id="vade" onchange="reset()"></select></div>
            </div>
            
            <div class="field-row">
                <div class="field"><label>Yıllık Faiz %</label><input type="number" id="faiz" value="40.50" step="0.01" oninput="updateMonthly(); reset();"></div>
                <div class="field"><label>Aylık Faiz %</label><input type="number" id="aylikFaiz" step="0.0001" readonly style="background: #f8fafc; color: var(--blue); font-weight: bold;"></div>
            </div>

            <div class="field-row">
                <div class="field"><label>BSMV %</label><input type="number" id="bsmv" value="5" oninput="reset()"></div>
                <div class="field"><label>KKDF %</label><input type="number" id="kkdf" value="0" oninput="reset()"></div>
            </div>

            <div class="field" id="subBox"><label>Sübvansiyon %</label><input type="number" id="subOran" value="50" oninput="reset()"></div>
            <div class="field"><label>Ödeme Sıklığı</label>
                <select id="periyot" onchange="reset()">
                    <option value="1">Yılda 1</option><option value="2">6 Ayda 1</option><option value="4">3 Ayda 1</option><option value="12">Ayda 1</option>
                </select>
            </div>
            
            <div class="field" style="grid-column: span 2;"><label>Ödeme Tipi</label><select id="tip" onchange="reset()"><option value="esit">Eşit Taksit</option><option value="anapara">Anapara Eşit</option></select></div>

            <div class="options-row" id="traktorOpts">
                <div class="opt">
                    <input type="checkbox" id="yerli" checked onchange="toggleYerli(this)"> 
                    <label for="yerli">Yerli Malı Desteği<span id="hazine-note" class="hazine-label">Faizin %25'ini hazine ödemektedir</span></label>
                </div>
                <div class="opt">
                    <input type="checkbox" id="buyback" checked onchange="updateBuyBackText(); reset();"> 
                    <label for="buyback">Buy Back Kapsamında <span id="bb-status" class="status-label">Kredi sabit faizlidir</span></label>
                </div>
            </div>
        </div>

        <div class="actions no-print">
            <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
            <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF</button>
            <button class="btn btn-print" id="printBtn" onclick="yazdir()" disabled>YAZDIR</button>
        </div>

        <div id="result" style="display:none;">
            <div class="table-res">
                <table id="table">
                    <thead>
                        <tr>
                            <th style="width: 35px;">No</th>
                            <th>Anapara</th>
                            <th>Faiz</th>
                            <th id="hIndFaiz">İnd. Faiz</th>
                            <th>BSMV</th>
                            <th id="hKkdf">KKDF</th>
                            <th id="hTutar">Taksit</th>
                            <th id="hSub">Sübv. Taksit</th>
                            <th>Kalan</th>
                        </tr>
                    </thead>
                    <tbody id="plan"></tbody>
                    <tfoot id="tableFoot"></tfoot>
                </table>
            </div>

            <div class="expense-box" id="expense-container">
                <h3>Kredi Masrafları & Kesintiler</h3>
                <div class="expense-grid">
                    <div class="exp-item"><span>Kredi Tahsis Ücreti (%0.5)</span><span id="exp-tahsis">0 TL</span></div>
                    <div class="exp-item"><span>Ekspertiz Ücreti</span><span>7.500 TL</span></div>
                    <div class="exp-item"><span>Rehin Tesisi</span><span>1.250 TL</span></div>
                    <div class="exp-item"><span>Hesaba Geçecek Net Tutar</span><span id="exp-net" style="color:var(--success)">0 TL</span></div>
                </div>
            </div>

            <div class="apply-box no-print" id="apply-form">
                <h3>Kredi Başvuru Formu</h3>
                <div class="apply-grid">
                    <div class="apply-field"><label>T.C. Kimlik No</label><input type="number" id="user_tckn" placeholder="11 Haneli"></div>
                    <div class="apply-field"><label>Telefon</label><input type="tel" id="user_phone" placeholder="05xx xxx xx xx"></div>
                </div>
                <button class="btn btn-send" onclick="sendEmail()">BAŞVURUYU GÖNDER</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){ emailjs.init("jDMRD7zxVCGxvmiRX"); })();
    let mode = 'traktor'; 

    function initApp() { fmtMoney(document.getElementById('tutar')); checkLocks(); fillVade(); updateBuyBackText(); updateMonthly(); }
    function fmtMoney(i) { let v = i.value.replace(/\D/g, ""); if(v) i.value = new Intl.NumberFormat('tr-TR').format(v); reset(); }
    function updateMonthly() {
        const yFaiz = parseFloat(document.getElementById('faiz').value) || 0;
        document.getElementById('aylikFaiz').value = (yFaiz / 12).toFixed(4);
    }
    function toggleYerli(cb) {
        document.getElementById('subOran').value = cb.checked ? 50 : 25;
        document.getElementById('hazine-note').style.display = cb.checked ? 'block' : 'none';
        reset();
    }
    function updateBuyBackText() {
        const isChecked = document.getElementById('buyback').checked;
        const statusSpan = document.getElementById('bb-status');
        statusSpan.innerText = isChecked ? "Kredi sabit faizlidir" : "Kredi değişken faizlidir";
        statusSpan.style.color = isChecked ? "var(--success)" : "var(--accent)";
    }
    function fillVade() {
        const s = document.getElementById('vade');
        s.innerHTML = '';
        let isMonthly = (mode !== 'traktor');
        let max = (mode === 'tuketici') ? 36 : (isMonthly ? 60 : 5);
        let unit = isMonthly ? ' Ay' : ' Yıl';
        for(let i=1; i<=max; i++) {
            let o = document.createElement('option'); o.value = i; o.text = i + unit;
            if(i === (isMonthly ? 36 : 5)) o.selected = true; 
            s.appendChild(o);
        }
    }
    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); 
        mode = m;
        document.getElementById('traktorOpts').style.display = (m === 'traktor') ? 'flex' : 'none';
        document.getElementById('subBox').style.visibility = (m === 'traktor') ? 'visible' : 'hidden';
        checkLocks(); fillVade(); updateMonthly(); reset();
    }
    function checkLocks() {
        const perSelect = document.getElementById('periyot');
        document.getElementById('bsmv').value = (mode === 'zirai' || mode === 'tuketici') ? 15 : 5;
        document.getElementById('kkdf').value = (mode === 'zirai' || mode === 'tuketici') ? 15 : 0;
        if(mode === 'zirai') { document.getElementById('faiz').value = "45.00"; perSelect.value = "1"; }
        else if(mode === 'ticari') { document.getElementById('faiz').value = "48.00"; perSelect.value = "12"; }
        else if(mode === 'tuketici') { document.getElementById('faiz').value = "52.68"; perSelect.value = "12"; }
        else { document.getElementById('faiz').value = "40.50"; perSelect.value = "1"; }
    }
    function reset() { 
        document.getElementById('result').style.display = 'none';
        document.getElementById('pdfBtn').disabled = true; document.getElementById('printBtn').disabled = true; 
    }
    function hesapla() {
        const anaPara = parseFloat(document.getElementById('tutar').value.replace(/\./g, ""));
        const yFaiz = parseFloat(document.getElementById('faiz').value) / 100;
        const subOran = (mode === 'traktor') ? parseFloat(document.getElementById('subOran').value) / 100 : 0;
        const vade = parseInt(document.getElementById('vade').value);
        const per = parseInt(document.getElementById('periyot').value);
        const tip = document.getElementById('tip').value;
        const v_kkdf = parseFloat(document.getElementById('kkdf').value) / 100;
        const v_bsmv = parseFloat(document.getElementById('bsmv').value) / 100;
        
        let taksitSayisi = (mode !== 'traktor') ? Math.max(1, Math.ceil(vade / (12 / per))) : vade * per;
        const donemFaiz = yFaiz / per; 
        const bilesikFaiz = donemFaiz * (1 + v_kkdf + v_bsmv);

        let html = '', kalan = anaPara; 
        let tTaksit = 0, tAnapara = 0, tFaiz = 0, tIndFaiz = 0, tBsmv = 0, tKkdf = 0, tSubTaksit = 0;

        for(let i=1; i<=taksitSayisi; i++) {
            let f = kalan * donemFaiz; let indF = f * (1 - subOran); let bsmvM = f * v_bsmv; let kkdfM = f * v_kkdf;
            let a, t;
            if(tip === 'esit') { 
                t = (anaPara * bilesikFaiz * Math.pow(1+bilesikFaiz, taksitSayisi)) / (Math.pow(1+bilesikFaiz, taksitSayisi)-1); 
                a = t - (f + bsmvM + kkdfM); 
            } else { a = anaPara / taksitSayisi; t = a + f + bsmvM + kkdfM; }
            if(i === taksitSayisi) a = kalan; 
            let subT = a + indF + bsmvM; kalan -= a;
            tTaksit += t; tAnapara += a; tFaiz += f; tIndFaiz += indF; tBsmv += bsmvM; tKkdf += kkdfM; tSubTaksit += subT;
            html += `<tr><td>${i}</td><td>${Math.round(a).toLocaleString('tr-TR')}</td><td>${Math.round(f).toLocaleString('tr-TR')}</td><td style="${mode==='traktor'?'':'display:none'}">${Math.round(indF).toLocaleString('tr-TR')}</td><td>${Math.round(bsmvM).toLocaleString('tr-TR')}</td><td style="${mode==='traktor'?'display:none':''}">${Math.round(kkdfM).toLocaleString('tr-TR')}</td><td style="${mode==='traktor'?'display:none':''}">${Math.round(t).toLocaleString('tr-TR')}</td><td style="${mode==='traktor'?'':'display:none'}">${Math.round(subT).toLocaleString('tr-TR')}</td><td>${Math.max(0, Math.round(kalan)).toLocaleString('tr-TR')}</td></tr>`;
        }

        const tahsis = anaPara * 0.005;
        const ekspertiz = 7500;
        const rehin = 1250;
        const net = anaPara - (tahsis + ekspertiz + rehin);

        document.getElementById('exp-tahsis').innerText = Math.round(tahsis).toLocaleString('tr-TR') + " TL";
        document.getElementById('exp-net').innerText = Math.round(net).toLocaleString('tr-TR') + " TL";

        document.getElementById('hTutar').style.display = (mode === 'traktor') ? 'none' : 'table-cell';
        document.getElementById('hIndFaiz').style.display = (mode === 'traktor') ? 'table-cell' : 'none';
        document.getElementById('hKkdf').style.display = (mode === 'traktor') ? 'none' : 'table-cell';
        document.getElementById('hSub').style.display = (mode === 'traktor') ? 'table-cell' : 'none';
        document.getElementById('plan').innerHTML = html;
        document.getElementById('tableFoot').innerHTML = `<tr class="total-row"><td>TOP</td><td>${Math.round(tAnapara).toLocaleString('tr-TR')}</td><td>${Math.round(tFaiz).toLocaleString('tr-TR')}</td><td style="${mode==='traktor'?'':'display:none'}">${Math.round(tIndFaiz).toLocaleString('tr-TR')}</td><td>${Math.round(tBsmv).toLocaleString('tr-TR')}</td><td style="${mode==='traktor'?'display:none':''}">${Math.round(tKkdf).toLocaleString('tr-TR')}</td><td style="${mode==='traktor'?'display:none':''}">${Math.round(tTaksit).toLocaleString('tr-TR')}</td><td style="${mode==='traktor'?'':'display:none'}">${Math.round(tSubTaksit).toLocaleString('tr-TR')}</td><td>-</td></tr>`;
        document.getElementById('result').style.display = 'block';
        document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false;
    }
    function sendEmail() {
        const tckn = document.getElementById('user_tckn').value;
        const phone = document.getElementById('user_phone').value;
        const amount = document.getElementById('tutar').value;
        if(tckn.length !== 11 || !phone) { alert("Lütfen geçerli bir TC No (11 hane) ve Telefon girin."); return; }
        const params = { user_tckn: tckn, user_phone: phone, loan_amount: amount, loan_type: mode.toUpperCase() };
        emailjs.send("service_default", "template_default", params).then(() => {
            alert("Başvurunuz başarıyla gönderildi! Sizinle iletişime geçilecektir.");
        }, (err) => {
            alert("Hata oluştu: " + JSON.stringify(err));
        });
    }
    function yazdir() { window.print(); }
    function indir() { html2pdf().from(document.getElementById('pdf-area')).set({ margin: 5, filename: 'Kredi_Plani.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).save(); }
</script>
</body>
</html>
