<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --tarimsal: #2ecc71; --ticari: #e67e22; --bireysel: #3498db; --hakkimda: #34495e;
            --success: #27ae60; --dark: #2c3e50; --light: #ecf0f1; --border: #dcdde1;
            --input-height: 38px;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f6fa; margin: 0; padding: 10px; color: var(--dark); font-size: 13px; }
        
        .container { 
            max-width: 1200px; margin: 10px auto; background: #fff; padding: 15px; 
            border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); 
        }
        
        .segment-nav { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .seg-btn { 
            flex: 1; min-width: 90px; border: 2px solid transparent; height: 38px; 
            border-radius: 6px; color: white; font-weight: bold; cursor: pointer; 
            font-size: 11px; opacity: 0.6; transition: 0.3s;
        }
        .seg-btn.active { opacity: 1; border-color: var(--dark); }
        .bg-tar { background: var(--tarimsal); } .bg-tic { background: var(--ticari); }
        .bg-bir { background: var(--bireysel); } .bg-hak { background: var(--hakkimda); }

        .tabs { display: none; gap: 5px; margin-bottom: 15px; border-bottom: 1px solid var(--light); padding-bottom: 10px; }
        .tab-btn { padding: 6px 12px; border: none; background: #eee; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; }
        .tab-btn.active { background: var(--dark); color: white; }
        
        /* PC TEK SATIR DÜZENİ */
        .calculator-grid { 
            display: flex; flex-wrap: nowrap; gap: 8px; align-items: flex-end; 
            background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid var(--border);
            margin-bottom: 15px;
        }
        
        .field { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
        .field.narrow { flex: 0.4; min-width: 50px; }
        .field.medium { flex: 0.7; min-width: 80px; }
        .field.large { flex: 1.2; min-width: 110px; }

        label { 
            font-weight: bold; font-size: 9px; color: #57606f; 
            text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        input, select { 
            height: var(--input-height); padding: 0 8px; border: 1px solid var(--border); 
            border-radius: 4px; font-size: 12px; width: 100%; outline: none;
        }
        input[readonly] { background: #eee; color: #7f8c8d; }

        /* Vade Kaydırıcı PC'de de şık dursun */
        .slider-wrapper { 
            display: flex; align-items: center; gap: 5px; height: var(--input-height); 
            background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 0 8px;
        }
        .slider-wrapper input { flex: 1; height: 4px; }
        .slider-wrapper span { font-weight: bold; font-size: 12px; min-width: 20px; }

        .options-bar { 
            display: flex; gap: 15px; margin-bottom: 15px; padding: 10px; 
            background: #fffbe6; border: 1px dashed #ffe58f; border-radius: 4px;
        }
        .opt-item { display: flex; align-items: center; gap: 5px; font-size: 11px; cursor: pointer; }
        .opt-item input { width: 14px; height: 14px; cursor: pointer; }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
        .btn { height: 42px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #9b59b6; }
        .btn-print { background: var(--dark); }

        .result-container { margin-top: 20px; border: 1px solid var(--dark); border-radius: 6px; display: none; overflow: hidden; }
        .result-header { background: var(--dark); color: white; padding: 10px; text-align: center; font-weight: bold; }
        .table-wrap { overflow-x: auto; padding: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { border: 1px solid var(--border); padding: 6px 4px; text-align: center; }
        tfoot { background: #f8f9fa; font-weight: bold; }

        #about-box { display: none; padding: 30px; text-align: center; background: #f8f9fa; border-radius: 8px; }

        @media (max-width: 992px) {
            .calculator-grid { flex-wrap: wrap; }
            .field { flex: 1 1 calc(33% - 10px); min-width: 120px; }
        }

        @media (max-width: 600px) {
            .field { flex: 1 1 calc(50% - 10px); }
            .actions { grid-template-columns: 1fr; }
        }

        @media print {
            .no-print { display: none !important; }
            .container { box-shadow: none; border: none; width: 100%; max-width: none; }
            .result-container { display: block !important; border: 1px solid #000; }
        }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="main-content">
    <!-- Navigasyon -->
    <div class="segment-nav no-print">
        <button id="seg-tar" class="seg-btn bg-tar" onclick="switchSegment('tarimsal')">TARIMSAL</button>
        <button id="seg-tic" class="seg-btn bg-tic" onclick="switchSegment('ticari')">TİCARİ</button>
        <button id="seg-bir" class="seg-btn bg-bir" onclick="switchSegment('bireysel')">BİREYSEL</button>
        <button id="seg-hak" class="seg-btn bg-hak" onclick="switchSegment('hakkimda')">HAKKIMDA</button>
    </div>

    <div id="calculator-ui">
        <!-- Alt Sekmeler -->
        <div class="tabs no-print" id="tabs-tarimsal">
            <button class="tab-btn" onclick="switchTab(this, 'traktor')">Traktör</button>
            <button class="tab-btn" onclick="switchTab(this, 'ekipman')">Ekipman</button>
            <button class="tab-btn" onclick="switchTab(this, 'zirai')">Çiftçi Taksitli</button>
        </div>
        <div class="tabs no-print" id="tabs-ticari"><button class="tab-btn" onclick="switchTab(this, 'ticari')">İşletme</button></div>
        <div class="tabs no-print" id="tabs-bireysel"><button class="tab-btn" onclick="switchTab(this, 'tuketici')">İhtiyaç</button></div>

        <!-- TEK SATIR INPUT GRID -->
        <div class="calculator-grid no-print">
            <div class="field large" id="prof-box"><label>Proforma Bedeli</label><input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)"></div>
            <div class="field large"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
            <div class="field narrow"><label>Yıllık %</label><input type="number" id="faiz" value="40.50" step="0.01" oninput="syncFaiz('yillik')"></div>
            <div class="field narrow"><label>Aylık %</label><input type="number" id="faizAylik" value="3.38" step="0.01" oninput="syncFaiz('aylik')"></div>
            <div class="field narrow"><label>BSMV %</label><input type="number" id="bsmv" value="5" readonly></div>
            <div class="field narrow"><label>KKDF %</label><input type="number" id="kkdf" value="0" readonly></div>
            
            <!-- Vade Alanı (Select veya Slider) -->
            <div class="field medium" id="vade-select-box"><label>Vade</label><select id="vade-select" onchange="reset()"></select></div>
            <div class="field large" id="vade-slider-box" style="display:none;">
                <label>Vade: <span id="vade-val">12</span> Ay</label>
                <div class="slider-wrapper">
                    <input type="range" id="vade-slider" min="1" max="36" value="12" oninput="updateSlider(this.value)">
                </div>
            </div>

            <div class="field narrow" id="sub-box"><label>Sübv %</label><input type="number" id="subOran" value="50" oninput="reset()"></div>
            
            <div class="field medium" id="periyot-box">
                <label>Ödeme Sıklığı</label>
                <select id="periyot" onchange="reset()">
                    <option value="1">Aylık</option>
                    <option value="3">3 Ayda Bir</option>
                    <option value="6">6 Ayda Bir</option>
                    <option value="12" selected>Yıllık</option>
                </select>
            </div>
        </div>

        <!-- Opsiyonlar Bar -->
        <div class="options-bar no-print" id="zirai-options">
            <div class="opt-item"><input type="checkbox" id="yerli" checked onchange="updateSub()"><label for="yerli">Yerli Malı</label></div>
            <div class="opt-item" id="bb-container"><input type="checkbox" id="buyback" checked onchange="updateSub()"><label for="buyback">Buy Back</label></div>
        </div>

        <div class="actions no-print">
            <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
            <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF İNDİR</button>
            <button class="btn btn-print" id="printBtn" onclick="window.print()" disabled>YAZDIR</button>
        </div>

        <div id="result-main" class="result-container">
            <div class="result-header">ÖDEME PLANI</div>
            <div id="result-content"></div>
        </div>
    </div>

    <div id="about-box">
        <h2>Süleyman Coşkun</h2>
        <p>Finansal analiz ve kredi yapılandırma uzmanı.</p>
    </div>
</div>

<script>
    let mode = 'traktor'; let segment = 'tarimsal';

    function initApp() {
        fmtMoney(document.getElementById('proforma'));
        fmtMoney(document.getElementById('tutar'));
        switchSegment('tarimsal');
    }

    function syncFaiz(src) {
        const y = document.getElementById('faiz'), a = document.getElementById('faizAylik');
        if(src === 'yillik') a.value = (parseFloat(y.value)/12).toFixed(2);
        else y.value = (parseFloat(a.value)*12).toFixed(2);
        reset();
    }

    function switchSegment(seg) {
        segment = seg;
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('seg-' + seg.substring(0,3)).classList.add('active');
        
        if(seg === 'hakkimda') {
            document.getElementById('calculator-ui').style.display = 'none';
            document.getElementById('about-box').style.display = 'block';
        } else {
            document.getElementById('calculator-ui').style.display = 'block';
            document.getElementById('about-box').style.display = 'none';
            document.querySelectorAll('.tabs').forEach(t => t.style.display = 'none');
            const tabEl = document.getElementById('tabs-' + seg);
            tabEl.style.display = 'flex';
            tabEl.querySelector('.tab-btn').click();
        }
    }

    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); mode = m;
        
        const isBir = (segment === 'bireysel'), isTic = (segment === 'ticari'), isSub = (mode === 'traktor' || mode === 'ekipman');
        const f = document.getElementById('faiz'), fa = document.getElementById('faizAylik');

        // FAİZ SETLEME
        if(isSub) { f.value = "40.50"; fa.value = "3.38"; }
        else if(mode === 'zirai' || isTic) { f.value = "46.00"; fa.value = "3.83"; }
        else if(isBir) { fa.value = "4.39"; f.value = "52.68"; }

        // GÖRÜNÜRLÜK AYARLARI
        document.getElementById('prof-box').style.display = (segment === 'tarimsal' && mode !== 'zirai') ? 'flex' : 'none';
        document.getElementById('sub-box').style.display = isSub ? 'flex' : 'none';
        document.getElementById('zirai-options').style.display = isSub ? 'flex' : 'none';
        document.getElementById('periyot-box').style.display = (segment === 'tarimsal') ? 'none' : 'flex';
        
        document.getElementById('vade-slider-box').style.display = isBir ? 'flex' : 'none';
        document.getElementById('vade-select-box').style.display = isBir ? 'none' : 'flex';

        if(segment === 'tarimsal') {
            document.getElementById('bsmv').value = (mode === 'zirai' ? 15 : 5);
            document.getElementById('kkdf').value = (mode === 'zirai' ? 15 : 0);
        } else {
            document.getElementById('bsmv').value = (isTic ? 5 : 15);
            document.getElementById('kkdf').value = (isTic ? 0 : 15);
            fillVades();
        }
        reset();
    }

    function fillVades() {
        const s = document.getElementById('vade-select'); s.innerHTML = '';
        const max = (segment === 'ticari' ? 60 : 36);
        for(let i=1; i<=max; i++) {
            let o = document.createElement('option'); o.value = i; o.text = i + (segment === 'tarimsal' ? ' Yıl' : ' Ay');
            if(i === 12) o.selected = true;
            s.appendChild(o);
        }
    }

    function updateSlider(v) { document.getElementById('vade-val').innerText = v; reset(); }
    function fmtMoney(i) { let v = i.value.replace(/\D/g, ""); if(v) i.value = new Intl.NumberFormat('tr-TR').format(v); reset(); }
    function reset() { document.getElementById('result-main').style.display = 'none'; document.getElementById('pdfBtn').disabled = true; document.getElementById('printBtn').disabled = true; }

    function hesapla() {
        const res = document.getElementById('result-content'); res.innerHTML = '';
        const anaPara = parseFloat(document.getElementById('tutar').value.replace(/\./g, ""));
        const yF = parseFloat(document.getElementById('faiz').value)/100, bsmv = parseFloat(document.getElementById('bsmv').value)/100, kkdf = parseFloat(document.getElementById('kkdf').value)/100;
        const periyot = (segment === 'tarimsal' ? 12 : parseInt(document.getElementById('periyot').value));
        const subO = (mode === 'traktor' || mode === 'ekipman' ? document.getElementById('subOran').value/100 : 0);
        
        let vades = (segment === 'tarimsal' ? [5,4,3,2,1] : [isBir ? parseInt(document.getElementById('vade-slider').value) : parseInt(document.getElementById('vade-select').value)]);

        vades.forEach(v => {
            let tSayisi = (segment === 'tarimsal' ? v : Math.ceil(v/periyot));
            let dF = (yF/12) * periyot;
            let bF = dF * (1 + bsmv + kkdf);
            let taksit = (anaPara * bF * Math.pow(1+bF, tSayisi)) / (Math.pow(1+bF, tSayisi)-1);
            
            let html = `<div style="margin-bottom:20px"><div style="background:#eee; padding:8px; font-weight:bold; text-align:center">${v} ${segment === 'tarimsal' ? 'Yıl' : 'Vade'}</div><div class="table-wrap"><table><thead><tr><th>Tks</th><th>Ana Para</th><th>Faiz</th>${subO>0?'<th>Sübv.</th>':''}<th>Vergi</th><th>Taksit</th><th>Kalan</th></tr></thead><tbody>`;
            
            let kalan = anaPara;
            for(let i=1; i<=tSayisi; i++) {
                let f = kalan * dF, b = f * (bsmv+kkdf), ind = f * subO, a = (i === tSayisi ? kalan : taksit - (f+b));
                let sTaksit = taksit - ind;
                html += `<tr><td>${i}</td><td>${Math.round(a).toLocaleString('tr-TR')}</td><td>${Math.round(f).toLocaleString('tr-TR')}</td>${subO>0?`<td style="color:red">-${Math.round(ind).toLocaleString('tr-TR')}</td>`:''}<td>${Math.round(b).toLocaleString('tr-TR')}</td><td>${Math.round(sTaksit).toLocaleString('tr-TR')}</td><td>${Math.max(0, Math.round(kalan-a)).toLocaleString('tr-TR')}</td></tr>`;
                kalan -= a;
            }
            res.innerHTML += html + `</tbody></table></div></div>`;
        });

        document.getElementById('result-main').style.display = 'block';
        document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false;
    }

    function updateSub() {
        if(mode === 'traktor') document.getElementById('subOran').value = document.getElementById('yerli').checked ? 50 : 25;
        else if(mode === 'ekipman') document.getElementById('subOran').value = document.getElementById('yerli').checked ? 75 : 50;
        reset();
    }

    function indir() {
        const element = document.getElementById('main-content');
        html2pdf().from(element).set({ margin: 10, filename: 'kredi_plani.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).save();
    }
</script>
</body>
</html>
