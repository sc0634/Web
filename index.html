<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Hesaplama & Başvuru</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --tarimsal: #2ecc71; --ticari: #e67e22; --bireysel: #3498db; --hakkimda: #34495e;
            --success: #27ae60; --dark: #2c3e50; --light: #ecf0f1; --border: #dcdde1;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f6fa; margin: 0; padding: 0; color: var(--dark); font-size: 13px; padding-bottom: 140px; }
        
        .container { max-width: 1000px; margin: 10px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        
        .segment-nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding: 5px; }
        .seg-btn { flex: 1; min-width: 100px; height: 45px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; border: none; opacity: 0.6; transition: 0.3s; }
        .seg-btn.active { opacity: 1; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .bg-tar { background: var(--tarimsal); } .bg-tic { background: var(--ticari); }
        .bg-bir { background: var(--bireysel); } .bg-hak { background: var(--hakkimda); }

        .tabs { display: none; gap: 5px; margin-bottom: 15px; border-bottom: 1px solid var(--light); padding-bottom: 10px; }
        .tab-btn { padding: 8px 15px; border: none; background: #eee; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 11px; }
        .tab-btn.active { background: var(--dark); color: white; }

        .grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 15px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 10px; font-weight: bold; color: #7f8c8d; text-transform: uppercase; }
        input, select { height: 40px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; width: 100%; }
        input[readonly] { background: #f9f9f9; }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin: 20px 0; }
        .btn { height: 45px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #9b59b6; }
        .btn-print { background: var(--dark); }

        .result-main-container { margin-top: 20px; border: 2px solid var(--dark); border-radius: 8px; overflow: hidden; display: none; }
        .result-title { background: var(--dark); color: white; padding: 10px; text-align: center; font-weight: bold; }
        .table-res { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { padding: 8px 4px; border: 1px solid var(--border); text-align: center; }
        .row-total { background: #f1f2f6; font-weight: bold; }

        /* SABİT BAŞVURU BARI */
        .fixed-apply-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #fff;
            border-top: 3px solid var(--bireysel); box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
            padding: 15px 20px; z-index: 9999; display: flex; justify-content: center;
        }
        .apply-content {
            max-width: 1100px; width: 100%; display: grid;
            grid-template-columns: 1fr 1.5fr 1.5fr 1.2fr 1.2fr; gap: 12px; align-items: center;
        }
        .apply-text { font-weight: bold; color: var(--dark); font-size: 13px; }
        .captcha-box { display: flex; align-items: center; gap: 5px; background: #f8f9fa; padding: 5px; border-radius: 6px; border: 1px solid var(--border); }
        .btn-apply { background: var(--bireysel); color: white; height: 40px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        @media (max-width: 850px) {
            .apply-content { grid-template-columns: 1fr; }
            body { padding-bottom: 300px; }
        }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <div class="segment-nav no-print">
        <button id="seg-tar" class="seg-btn bg-tar" onclick="switchSegment('tarimsal')">TARIMSAL</button>
        <button id="seg-tic" class="seg-btn bg-tic" onclick="switchSegment('ticari')">TİCARİ</button>
        <button id="seg-bir" class="seg-btn bg-bir" onclick="switchSegment('bireysel')">BİREYSEL</button>
        <button id="seg-hak" class="seg-btn bg-hak" onclick="switchSegment('hakkimda')">HAKKIMDA</button>
    </div>

    <div class="tabs no-print" id="tabs-tarimsal">
        <button class="tab-btn" onclick="switchTab(this, 'traktor')">Traktör</button>
        <button class="tab-btn" onclick="switchTab(this, 'ekipman')">Ekipman</button>
        <button class="tab-btn" onclick="switchTab(this, 'zirai')">Çiftçi Taksitli</button>
    </div>
    <div class="tabs no-print" id="tabs-ticari"><button class="tab-btn" onclick="switchTab(this, 'ticari')">İşletme</button></div>
    <div class="tabs no-print" id="tabs-bireysel"><button class="tab-btn" onclick="switchTab(this, 'tuketici')">İhtiyaç</button></div>

    <div class="grid">
        <div class="field" id="box-proforma" style="width:140px;"><label>Proforma</label><input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)"></div>
        <div class="field" style="width:140px;"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
        <div class="field" style="width:70px;"><label>Yıllık %</label><input type="number" id="faiz" step="0.01" oninput="syncFaiz('yillik')"></div>
        <div class="field" style="width:70px;"><label>Aylık %</label><input type="number" id="faizAylik" step="0.01" oninput="syncFaiz('aylik')"></div>
        <div class="field" style="width:50px;"><label>BSMV</label><input type="number" id="bsmv" readonly></div>
        <div class="field" style="width:50px;"><label>KKDF</label><input type="number" id="kkdf" readonly></div>
        <div class="field" id="box-vade" style="width:90px;"><label>Vade</label><select id="vade-select" onchange="reset()"></select></div>
        <div class="field" id="box-periyot" style="width:110px;"><label>Ödeme Sıklığı</label><select id="periyot" onchange="reset()"></select></div>
    </div>

    <div class="actions no-print">
        <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
        <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF</button>
        <button class="btn btn-print" id="printBtn" onclick="window.print()" disabled>YAZDIR</button>
    </div>

    <div id="result-main-container" class="result-main-container">
        <div class="result-title">Kredi Geri Ödeme Planı</div>
        <div class="table-res" id="result-area"></div>
    </div>
</div>

<div class="fixed-apply-bar no-print">
    <div class="apply-content">
        <div class="apply-text">HIZLI BAŞVURU</div>
        <input type="text" id="app-tckn" placeholder="TC Kimlik No" maxlength="11" oninput="this.value=this.value.replace(/[^\d]/,'')">
        <input type="tel" id="app-tel" placeholder="Cep Telefonu (5XX...)" maxlength="10" oninput="this.value=this.value.replace(/[^\d]/,'')">
        <div class="captcha-box">
            <span id="cap-ques" style="font-weight:bold; color:var(--bireysel);"></span>
            <input type="text" id="cap-ans" placeholder="?" style="width:35px; height:25px; text-align:center;">
        </div>
        <button class="btn-apply" onclick="completeApp()">GÖNDER</button>
    </div>
</div>

<script>
    let mode = 'traktor', segment = 'tarimsal', capRes;

    function initApp() { 
        fmtMoney(document.getElementById('proforma')); 
        fmtMoney(document.getElementById('tutar')); 
        switchSegment('tarimsal'); 
        genCap();
    }

    function genCap() {
        const n1 = Math.floor(Math.random() * 9) + 1, n2 = Math.floor(Math.random() * 9) + 1;
        capRes = n1 + n2;
        document.getElementById('cap-ques').innerText = `${n1}+${n2}=`;
        document.getElementById('cap-ans').value = '';
    }

    function switchSegment(seg) {
        segment = seg;
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('seg-' + seg.substring(0,3)).classList.add('active');
        document.querySelectorAll('.tabs').forEach(t => t.style.display = 'none');
        document.getElementById('tabs-' + seg).style.display = 'flex';
        
        const p = document.getElementById('periyot'); p.innerHTML = '';
        const opts = (seg === 'tarimsal') ? [{v:12, t:'Yıllık'}] : [{v:1, t:'Aylık'},{v:3, t:'3 Ayda Bir'},{v:6, t:'6 Ayda Bir'}];
        opts.forEach(o => { let el = document.createElement('option'); el.value = o.v; el.text = o.t; p.appendChild(el); });

        document.getElementById('tabs-' + seg).querySelector('.tab-btn').click();
    }

    function switchTab(btn, m) {
        mode = m;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const bsmv = document.getElementById('bsmv'), kkdf = document.getElementById('kkdf'), fA = document.getElementById('faizAylik');
        if(segment === 'bireysel' || mode === 'zirai') { bsmv.value = 15; kkdf.value = 15; } else { bsmv.value = 5; kkdf.value = 0; }
        
        if(segment === 'bireysel') { fA.value = 4.39; } 
        else if(segment === 'ticari' || mode === 'zirai') { fA.value = (46/12).toFixed(2); }
        else { fA.value = (40.5/12).toFixed(2); }
        syncFaiz('aylik');

        const vs = document.getElementById('vade-select'); vs.innerHTML = '';
        let max = (segment === 'tarimsal') ? 5 : (segment === 'ticari' ? 60 : 36);
        for(let i=1; i<=max; i++) { 
            let o = document.createElement('option'); o.value = i; o.text = i + (segment === 'tarimsal' ? ' Yıl' : ' Ay'); 
            if(i===max) o.selected = true; vs.appendChild(o); 
        }
        document.getElementById('box-proforma').style.display = (segment === 'tarimsal' && mode !== 'zirai') ? 'flex' : 'none';
        reset();
    }

    function syncFaiz(src) {
        const y = document.getElementById('faiz'), a = document.getElementById('faizAylik');
        if(src === 'aylik') y.value = (a.value * 12).toFixed(2);
        else a.value = (y.value / 12).toFixed(2);
    }

    function fmtMoney(i) { let v = i.value.replace(/\D/g, ""); if(v) i.value = new Intl.NumberFormat('tr-TR').format(v); reset(); }
    function reset() { document.getElementById('result-main-container').style.display = 'none'; document.getElementById('pdfBtn').disabled = true; document.getElementById('printBtn').disabled = true; }
    function getVal(id) { return parseFloat(document.getElementById(id).value.replace(/\./g, "")) || 0; }

    function hesapla() {
        const anaPara = getVal('tutar'); if(anaPara <= 0) return;
        const yF = document.getElementById('faiz').value / 100, bsmv = document.getElementById('bsmv').value / 100, kkdf = document.getElementById('kkdf').value / 100;
        const per = parseInt(document.getElementById('periyot').value), vade = parseInt(document.getElementById('vade-select').value);
        
        let tSayisi = (segment === 'tarimsal') ? vade : Math.ceil(vade / per);
        let dF = (yF / 12) * per, bF = dF * (1 + bsmv + kkdf);
        let taksit = (anaPara * bF * Math.pow(1+bF, tSayisi)) / (Math.pow(1+bF, tSayisi)-1);

        let html = `<table><thead><tr><th>Taksit</th><th>Ana Para</th><th>Faiz</th><th>Vergi</th><th>Taksit Tutarı</th><th>Kalan</th></tr></thead><tbody>`;
        let kal = anaPara, tA=0, tF=0, tV=0, tT=0;

        for(let i=1; i<=tSayisi; i++) {
            let f = kal * dF, v = f * (bsmv + kkdf), a = (i === tSayisi) ? kal : taksit - (f + v);
            html += `<tr><td>${i}</td><td>${Math.round(a).toLocaleString('tr-TR')}</td><td>${Math.round(f).toLocaleString('tr-TR')}</td><td>${Math.round(v).toLocaleString('tr-TR')}</td><td>${Math.round(taksit).toLocaleString('tr-TR')}</td><td>${Math.max(0, Math.round(kal-a)).toLocaleString('tr-TR')}</td></tr>`;
            tA += a; tF += f; tV += v; tT += taksit; kal -= a;
        }
        html += `<tr class="row-total"><td>TOPLAM</td><td>${Math.round(tA).toLocaleString('tr-TR')}</td><td>${Math.round(tF).toLocaleString('tr-TR')}</td><td>${Math.round(tV).toLocaleString('tr-TR')}</td><td>${Math.round(tT).toLocaleString('tr-TR')}</td><td>-</td></tr></tbody></table>`;
        
        document.getElementById('result-area').innerHTML = html;
        document.getElementById('result-main-container').style.display = 'block';
        document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false;
    }

    function completeApp() {
        const tckn = document.getElementById('app-tckn').value, tel = document.getElementById('app-tel').value, ans = document.getElementById('cap-ans').value;
        if(tckn.length !== 11 || tel.length < 10) { alert("TCKN ve Telefon eksik!"); return; }
        if(parseInt(ans) !== capRes) { alert("Güvenlik sorusu hatalı!"); genCap(); return; }
        
        if(confirm(`${tckn} TCKN ile başvuruyu onaylıyor musunuz? Plan e-posta ile gönderilecektir.`)) {
            alert("Başvurunuz başarıyla iletildi!"); genCap();
        }
    }
    function indir() { html2pdf().from(document.getElementById('pdf-area')).set({ margin: 10, filename: 'Plan.pdf' }).save(); }
</script>
</body>
</html>
