<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Finansal Analiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; background: #fff; padding: 10px; box-sizing: border-box; }

        .tabs { display: flex; background: var(--primary); overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .tab-link { flex: 0 0 auto; padding: 12px 15px; color: #ecf0f1; border: none; background: none; font-weight: bold; font-size: 12px; cursor: pointer; }
        .tab-link.active { background: var(--secondary); color: #fff; box-shadow: inset 0 -3px 0 #fff; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; }
        .field { display: flex; flex-direction: column; }
        .field-row { flex-direction: row !important; align-items: center; gap: 5px; }
        .field-row label { flex: 0 0 85px; margin-bottom: 0 !important; }
        .field label { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #2c3e50; }
        
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; outline: none; }
        input[readonly] { background-color: #eeeeee; color: #7f8c8d; cursor: not-allowed; border: 1px dashed #bbb; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        button { padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; color: #fff; }
        .btn-calc { background: var(--success); grid-column: span 2; font-size: 14px; }
        .btn-clear { background: var(--danger); }
        #btnPdf { background: var(--secondary); }
        #btnYazdir { background: #f39c12; grid-column: span 2; }

        .table-wrapper { width: 100%; overflow: hidden; margin-top: 15px; }
        #sonucTablosu { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 1000px; transform-origin: top left; }
        th { background: var(--primary); color: #fff; padding: 10px 5px; border: 1px solid #444; }
        td { padding: 8px 5px; border: 1px solid #eee; text-align: right; }
        td:first-child { text-align: center; }

        @media print { .no-print, .tabs, .btn-group, .input-grid { display: none !important; } }
        .force-hide { display: none !important; }

        @media (min-width: 768px) {
            .container { padding: 20px; border-radius: 8px; margin-top: 10px; }
            .field { flex-direction: row; align-items: center; }
            .field label { flex: 0 0 110px; margin-bottom: 0; }
            .field-row label { flex: 0 0 110px; }
            .btn-group { grid-template-columns: repeat(4, 1fr); }
            .btn-calc, #btnYazdir { grid-column: auto; }
            .tab-link { flex: 1; }
        }
    </style>
</head>
<body onload="vadeYukle(); yilliktanAyliga();" onresize="tabloyuSigdir()">

<div class="tabs no-print">
    <button class="tab-link active" onclick="openTab(event, 'traktor')">🚜 Zirai Traktör</button>
    <button class="tab-link" onclick="openTab(event, 'ticari')">💼 Ticari Kredi</button>
    <button class="tab-link" onclick="openTab(event, 'zirai')">👨‍🌾 Çiftçi Tüketici</button>
    <button class="tab-link" onclick="openTab(event, 'zirai_isletme')">🏚️ Zirai/İşletme</button>
    <button class="tab-link" onclick="openTab(event, 'tuketici')">🛒 Tüketici Kredisi</button>
    <button class="tab-link" onclick="openTab(event, 'hakkimda')">👤 Hakkımda</button>
</div>

<div class="container" id="pdf-area">
    <div id="calc-container" class="tab-content active">
        <h2 id="baslikText" style="text-align:center; font-size: 18px; margin: 10px 0;">Zirai Traktör Kredisi Hesaplama</h2>
        
        <div class="input-grid no-print" id="inputSection">
            <div class="field"><label>Tutar (₺)</label><input type="text" id="tutar" value="1.000.000" oninput="formatTutar(this); resetButtons();"></div>
            <div class="field"><label id="vadeLabel">Vade</label><select id="vadeSecim" onchange="resetButtons();"></select></div>
            <div class="field field-row"><label>Ödeme Sıklığı</label><select id="periyot" onchange="resetButtons();"><option value="1">Yılda 1</option><option value="2">6 Ayda 1</option><option value="4">3 Ayda 1</option><option value="12">Ayda 1</option></select></div>
            <div class="field field-row"><label>Plan Tipi</label><select id="planTipi" onchange="resetButtons();"><option value="esit_taksit" selected>Eşit Taksit</option></select></div>
            
            <div class="field field-row"><label>Aylık Faiz %</label><input type="number" id="faizAylik" step="0.0001" oninput="ayliktanYilliga(); resetButtons();"></div>
            <div class="field field-row"><label>Yıllık Faiz %</label><input type="number" id="faizYillik" value="40.50" step="0.0001" oninput="yilliktanAyliga(); resetButtons();"></div>
            <div class="field field-row"><label>KKDF %</label><input type="number" id="kkdfOran" value="0" readonly></div>
            <div class="field field-row"><label>BSMV %</label><input type="number" id="bsmvOran" value="5" readonly></div>
            <div class="field field-row" id="subContainer"><label>Sübvansiyon %</label><input type="number" id="subOran" value="50" oninput="resetButtons();"></div>
        </div>

        <div class="btn-group no-print" id="buttonGroup">
            <button class="btn-calc" onclick="hesapla()">HESAPLA</button>
            <button class="btn-clear" onclick="location.reload()">SIFIRLA</button>
            <button id="btnPdf" onclick="indirPDF()" disabled>PDF KAYDET</button>
            <button id="btnYazdir" onclick="window.print()" disabled>YAZDIR</button>
        </div>

        <div id="sonucAlani" style="display:none;">
            <div class="table-wrapper" id="wrapper">
                <table id="sonucTablosu">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Anapara</th>
                            <th>İndirimli Faiz</th>
                            <th>Brüt Faiz</th>
                            <th>BSMV</th>
                            <th>KKDF</th>
                            <th>İndirimli Taksit</th>
                            <th>Brüt Taksit</th>
                            <th>Borç Bakiye</th>
                        </tr>
                    </thead>
                    <tbody id="planBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let currentType = 'traktor';

    function tabloyuSigdir() {
        const wrapper = document.getElementById('wrapper');
        const tablo = document.getElementById('sonucTablosu');
        if (!wrapper || !tablo || document.getElementById('sonucAlani').style.display === 'none') return;
        const wrapperWidth = wrapper.offsetWidth;
        const tabloWidth = 1000;
        if (wrapperWidth < tabloWidth) {
            const oran = wrapperWidth / tabloWidth;
            tablo.style.transform = `scale(${oran})`;
            wrapper.style.height = (tablo.offsetHeight * oran) + "px";
        } else {
            tablo.style.transform = "scale(1)";
            wrapper.style.height = "auto";
        }
    }

    function yilliktanAyliga() {
        const y = parseFloat(document.getElementById('faizYillik').value);
        if (!isNaN(y)) document.getElementById('faizAylik').value = (y / 12).toFixed(4);
    }
    function ayliktanYilliga() {
        const a = parseFloat(document.getElementById('faizAylik').value);
        if (!isNaN(a)) document.getElementById('faizYillik').value = (a * 12).toFixed(4);
    }
    function formatTutar(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
    }
    function resetButtons() {
        document.getElementById('btnYazdir').disabled = true;
        document.getElementById('btnPdf').disabled = true;
        document.getElementById('sonucAlani').style.display = 'none';
    }

    function vadeYukle() {
        const select = document.getElementById('vadeSecim');
        select.innerHTML = '';
        let limit = (currentType === 'ticari' || currentType === 'zirai') ? 60 : 5;
        let suffix = (currentType === 'ticari' || currentType === 'zirai') ? " Ay" : " Yıl";
        let defaultVal = (currentType === 'ticari') ? 24 : limit;
        for (let i = 1; i <= limit; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerText = i + suffix;
            if (i === defaultVal) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        evt.currentTarget.classList.add('active');
        currentType = tabName;
        if(tabName === 'hakkimda' || tabName === 'zirai_isletme') {
            document.getElementById('baslikText').innerText = (tabName === 'hakkimda') ? "Süleyman Coşkun" : "Zirai/İşletme Kredisi";
            document.getElementById('inputSection').classList.add('force-hide');
            document.getElementById('buttonGroup').classList.add('force-hide');
            document.getElementById('sonucAlani').style.display = 'none';
        } else {
            document.getElementById('inputSection').classList.remove('force-hide');
            document.getElementById('buttonGroup').classList.remove('force-hide');
            const titles = {'traktor':'Zirai Traktör Kredisi Hesaplama','ticari':'Ticari Kredi Hesaplama','zirai':'Çiftçi Tüketici Kredisi Hesaplama','tuketici':'Tüketici Kredisi Hesaplama'};
            document.getElementById('baslikText').innerText = titles[tabName];
            
            const faizYillik = document.getElementById('faizYillik');
            const subContainer = document.getElementById('subContainer');
            subContainer.style.display = (tabName === 'traktor') ? 'flex' : 'none';

            if (tabName === 'ticari' || tabName === 'tuketici') { faizYillik.value = "49.00"; }
            else if (tabName === 'traktor') { faizYillik.value = "40.50"; }
            else if (tabName === 'zirai') { faizYillik.value = "45.00"; }

            if (tabName === 'tuketici' || tabName === 'zirai') { 
                document.getElementById('kkdfOran').value = 15; 
                document.getElementById('bsmvOran').value = 15; 
            } else { 
                document.getElementById('kkdfOran').value = 0; 
                document.getElementById('bsmvOran').value = 5; 
            }
            vadeYukle(); yilliktanAyliga(); resetButtons();
        }
    }

    function hesapla() {
        const tutar = parseFloat(document.getElementById('tutar').value.replace(/\./g, ""));
        const yFaiz = parseFloat(document.getElementById('faizYillik').value) / 100;
        const subOran = parseFloat(document.getElementById('subOran').value) / 100;
        const vade = parseInt(document.getElementById('vadeSecim').value);
        const per = parseInt(document.getElementById('periyot').value);
        const bsmv_r = parseFloat(document.getElementById('bsmvOran').value) / 100;
        const kkdf_r = parseFloat(document.getElementById('kkdfOran').value) / 100;

        let toplamTaksit = (currentType === 'ticari' || currentType === 'zirai') ? Math.ceil(vade / (12 / per)) : vade * per;
        const dFaiz = yFaiz / per;
        
        // Banka sistemindeki gibi Brüt Taksit (Vergili) üzerinden hesaplama
        const i_vergi = dFaiz * (1 + bsmv_r + kkdf_r);
        const brutTaksit = (tutar * i_vergi * Math.pow(1+i_vergi, toplamTaksit)) / (Math.pow(1+i_vergi, toplamTaksit)-1);
        
        let body = '', kalanAnapara = tutar;

        for(let j=1; j<=toplamTaksit; j++){
            let brutFaiz = kalanAnapara * dFaiz;
            let bsmv = brutFaiz * bsmv_r;
            let kkdf = brutFaiz * kkdf_r;
            let anapara = brutTaksit - (brutFaiz + bsmv + kkdf);
            
            if(j === toplamTaksit) anapara = kalanAnapara;
            
            let indirimliFaiz = brutFaiz * (1 - subOran);
            let indirimliTaksit = anapara + indirimliFaiz + bsmv + kkdf;
            
            kalanAnapara -= anapara;
            
            body += `<tr>
                <td>${j}</td>
                <td>${anapara.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})}₺</td>
                <td>${indirimliFaiz.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})}₺</td>
                <td>${brutFaiz.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})}₺</td>
                <td>${bsmv.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})}₺</td>
                <td>${kkdf.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})}₺</td>
                <td style="font-weight:bold; color:var(--success)">${indirimliTaksit.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})}₺</td>
                <td>${brutTaksit.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})}₺</td>
                <td>${Math.max(0, kalanAnapara).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2})}₺</td>
            </tr>`;
        }
        document.getElementById('planBody').innerHTML = body;
        document.getElementById('sonucAlani').style.display = 'block';
        document.getElementById('btnYazdir').disabled = false;
        document.getElementById('btnPdf').disabled = false;
        setTimeout(tabloyuSigdir, 100);
    }

    function indirPDF() {
        const opt = { margin: 5, filename: 'kredi_plani.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } };
        html2pdf().set(opt).from(document.getElementById('pdf-area')).save();
    }
</script>
</body>
</html>
