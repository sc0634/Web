<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --navy: #0f172a; --blue: #2563eb; --gray: #64748b; --border: #e2e8f0; --success: #10b981; --accent: #f59e0b; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f8fafc; margin: 0; padding: 10px; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .tabs { display: flex; background: var(--navy); border-radius: 8px; padding: 4px; gap: 4px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px 2px; color: #cbd5e1; border: none; background: transparent; font-weight: 700; border-radius: 6px; font-size: 11px; cursor: pointer; line-height: 1.2; }
        .tab-btn.active { background: var(--blue); color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: #f1f5f9; padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
        .field { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 10px; font-weight: 800; color: var(--gray); text-transform: uppercase; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .options-row { grid-column: span 2; display: flex; gap: 15px; margin-top: 5px; padding-top: 10px; border-top: 1px solid #e2e8f0; }
        .opt { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .opt label { font-size: 11px; color: var(--navy); font-weight: 600; cursor: pointer; }
        .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin: 20px 0; }
        .btn { padding: 14px 5px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; color: #fff; text-transform: uppercase; font-size: 12px; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #6366f1; }
        .btn-print { background: var(--navy); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .print-info-header { display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; padding: 10px; border: 1px solid var(--navy); border-radius: 8px; background: #fff; }
        .print-info-item { display: flex; flex-direction: column; }
        .print-info-label { font-size: 9px; color: var(--gray); font-weight: bold; }
        .print-info-value { font-size: 13px; font-weight: 800; color: #000; }

        .table-res { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: #1e293b; color: #fff; padding: 10px 2px; font-size: 10px; border: 1px solid #334155; }
        td { padding: 10px 2px; text-align: center; border: 1px solid var(--border); font-weight: 400; color: #000; font-size: 13px; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8fafc; }
        
        .total-row td { background: #f1f5f9 !important; font-weight: 800 !important; color: var(--navy); border-top: 2px solid var(--navy); }

        @media print {
            @page { size: A4 portrait; margin: 0.5cm; }
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .print-info-header { display: grid !important; }
            .container { box-shadow: none; width: 100%; max-width: 100%; padding: 0; }
            table { width: 100% !important; table-layout: fixed !important; }
            th { font-size: 8pt !important; padding: 3px !important; color: black !important; background: #eee !important; border: 0.5pt solid #666 !important; }
            td { font-size: 8pt !important; padding: 3px !important; border: 0.5pt solid #666 !important; color: black !important; font-weight: 400; }
            .total-row td { font-weight: 800 !important; border-top: 1.2pt solid black !important; }
        }

        .apply-panel { background: #f0f9ff; border: 2px solid var(--blue); padding: 15px; border-radius: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .btn-apply { background: var(--accent); grid-column: span 2; height: 48px; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); } .apply-panel { grid-template-columns: 2fr 2fr 1fr; } .btn-apply { grid-column: span 1; } }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <div class="tabs no-print">
        <button class="tab-btn active" onclick="switchTab(this, 'traktor')">TRAKTÖR</button>
        <button class="tab-btn" onclick="switchTab(this, 'ticari')">TİCARİ</button>
        <button class="tab-btn" onclick="switchTab(this, 'zirai')">ÇİFTÇİ <br> TAKSİTLİ <br> KREDİ</button>
        <button class="tab-btn" onclick="switchTab(this, 'tuketici')">TÜKETİCİ</button>
    </div>

    <div class="grid no-print">
        <div class="field"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
        <div class="field"><label>Vade</label><select id="vade" onchange="reset()"></select></div>
        <div class="field"><label>Yıllık Faiz %</label><input type="number" id="faiz" value="40.50" step="0.01" oninput="reset()"></div>
        <div class="field"><label>BSMV %</label><input type="number" id="bsmv" value="5" oninput="reset()"></div>
        <div class="field"><label>KKDF %</label><input type="number" id="kkdf" value="0" oninput="reset()"></div>
        <div class="field" id="subBox"><label>Sübvansiyon %</label><input type="number" id="subOran" value="50" oninput="reset()"></div>
        <div class="field"><label>Ödeme Sıklığı</label>
            <select id="periyot" onchange="reset()">
                <option value="1">Yılda 1</option><option value="2">6 Ayda 1</option><option value="4">3 Ayda 1</option><option value="12">Ayda 1</option>
            </select>
        </div>
        <div class="field"><label>Ödeme Tipi</label><select id="tip" onchange="reset()"><option value="esit">Eşit Taksit</option><option value="anapara">Anapara Eşit</option></select></div>

        <div class="options-row" id="traktorOpts">
            <div class="opt"><input type="checkbox" id="yerli" checked onchange="document.getElementById('subOran').value=this.checked?50:25; reset();"> <label for="yerli">Yerli Malı Desteği</label></div>
            <div class="opt"><input type="checkbox" id="buyback" checked onchange="reset()"> <label for="buyback">Buy Back Kapsamında</label></div>
        </div>
    </div>

    <div class="actions no-print">
        <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
        <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF</button>
        <button class="btn btn-print" id="printBtn" onclick="yazdir()" disabled>YAZDIR</button>
    </div>

    <div id="result" style="display:none;">
        <h2 style="font-size: 18px; border-bottom: 2px solid var(--navy); padding-bottom: 8px; color: var(--navy);">Kredi Ödeme Planı</h2>
        
        <div class="print-info-header">
            <div class="print-info-item"><span class="print-info-label">KREDİ TUTARI</span><span id="p_tutar" class="print-info-value">-</span></div>
            <div class="print-info-item"><span class="print-info-label">VADE / SIKLIK</span><span id="p_vade" class="print-info-value">-</span></div>
            <div class="print-info-item"><span class="print-info-label">FAİZ ORANI</span><span id="p_faiz" class="print-info-value">-</span></div>
            <div class="print-info-item"><span class="print-info-label">KREDİ TÜRÜ</span><span id="p_tur" class="print-info-value">-</span></div>
        </div>

        <div class="table-res">
            <table id="table">
                <thead>
                    <tr>
                        <th style="width: 35px;">No</th>
                        <th>Anapara</th>
                        <th>Faiz</th>
                        <th id="hIndFaiz">İnd. Faiz</th>
                        <th>BSMV</th>
                        <th id="hKkdf">KKDF</th>
                        <th id="hTutar">Taksit</th>
                        <th id="hSub">Sübv. Taksit</th>
                        <th>Kalan</th>
                    </tr>
                </thead>
                <tbody id="plan"></tbody>
                <tfoot id="tableFoot"></tfoot>
            </table>
        </div>
        
        <div class="apply-panel no-print">
            <div class="field"><label>T.C. KİMLİK NO</label><input type="text" id="tc" maxlength="11" oninput="onlyNum(this); checkApply()"></div>
            <div class="field"><label>CEP TELEFONU</label><input type="text" id="tel" maxlength="10" placeholder="5xx xxxxxxx" oninput="onlyNum(this); checkApply()"></div>
            <button class="btn btn-apply" id="applyBtn" onclick="send()" disabled>BAŞVURUYU TAMAMLA</button>
        </div>
    </div>
</div>

<script>
    (function(){ emailjs.init("jDMRD7zxVCGxvmiRX"); })();
    let mode = 'traktor'; let calculated = false;

    function initApp() { fmtMoney(document.getElementById('tutar')); checkLocks(); fillVade(); }
    function fmtMoney(i) { let v = i.value.replace(/\D/g, ""); if(v) i.value = new Intl.NumberFormat('tr-TR').format(v); reset(); }
    function onlyNum(i) { i.value = i.value.replace(/[^0-9]/g,''); }
    
    function fillVade() {
        const s = document.getElementById('vade'); s.innerHTML = '';
        let isMonthly = (mode === 'ticari' || mode === 'zirai' || mode === 'tuketici');
        let max = (mode === 'tuketici') ? 36 : (isMonthly ? 60 : 5);
        let unit = isMonthly ? ' Ay' : ' Yıl';
        let defaultVal = (mode === 'ticari' || mode === 'tuketici') ? 36 : max;

        for(let i=1; i<=max; i++) {
            let o = document.createElement('option'); o.value = i; o.text = i + unit;
            if(i === defaultVal) o.selected = true; 
            s.appendChild(o);
        }
    }

    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); mode = m;
        document.getElementById('traktorOpts').style.display = (m === 'traktor') ? 'flex' : 'none';
        document.getElementById('subBox').style.visibility = (m === 'traktor') ? 'visible' : 'hidden';
        checkLocks(); fillVade(); reset();
    }

    function checkLocks() {
        const perSelect = document.getElementById('periyot');
        
        document.getElementById('bsmv').value = (mode === 'zirai' || mode === 'tuketici') ? 15 : 5;
        document.getElementById('kkdf').value = (mode === 'zirai' || mode === 'tuketici') ? 15 : 0;
        
        if(mode === 'zirai') { 
            document.getElementById('faiz').value = "45.00"; 
            perSelect.value = "1"; perSelect.disabled = false;
        } else if(mode === 'ticari') { 
            document.getElementById('faiz').value = "48.00"; 
            perSelect.value = "12"; perSelect.disabled = false;
        } else if(mode === 'tuketici') { 
            document.getElementById('faiz').value = "52.68"; 
            perSelect.value = "12"; perSelect.disabled = false; // Tüketici için kilit açıldı
        } else { 
            document.getElementById('faiz').value = "40.50"; 
            perSelect.value = "1"; perSelect.disabled = false;
        }
    }

    function reset() { 
        calculated = false; document.getElementById('result').style.display = 'none';
        document.getElementById('pdfBtn').disabled = true; document.getElementById('printBtn').disabled = true; checkApply();
    }
    function checkApply() {
        const tc = document.getElementById('tc').value.length === 11;
        const tel = document.getElementById('tel').value.length === 10;
        document.getElementById('applyBtn').disabled = !(tc && tel && calculated);
    }

    function hesapla() {
        const tutarVal = document.getElementById('tutar').value;
        const anaPara = parseFloat(tutarVal.replace(/\./g, ""));
        const yFaizVal = document.getElementById('faiz').value;
        const yFaiz = parseFloat(yFaizVal) / 100;
        const subOran = (mode === 'traktor') ? parseFloat(document.getElementById('subOran').value) / 100 : 0;
        const vade = parseInt(document.getElementById('vade').value);
        const perSelect = document.getElementById('periyot');
        const perText = perSelect.options[perSelect.selectedIndex].text;
        const per = parseInt(perSelect.value);
        const tip = document.getElementById('tip').value;
        const v_kkdf = parseFloat(document.getElementById('kkdf').value) / 100;
        const v_bsmv = parseFloat(document.getElementById('bsmv').value) / 100;
        
        let taksitSayisi;
        if(mode === 'ticari' || mode === 'zirai' || mode === 'tuketici') {
            taksitSayisi = Math.max(1, Math.ceil(vade / (12 / per)));
        } else {
            taksitSayisi = vade * per;
        }
        
        const donemFaiz = yFaiz / per; 
        const vergiOran = v_kkdf + v_bsmv; 
        const bilesikFaiz = donemFaiz * (1 + vergiOran);

        document.getElementById('p_tutar').innerText = tutarVal + " TL";
        document.getElementById('p_vade').innerText = taksitSayisi + " Taksit (" + perText + ")";
        document.getElementById('p_faiz').innerText = "%" + yFaizVal;
        document.getElementById('p_tur').innerText = (mode === 'zirai') ? "ÇİFTÇİ TAKSİTLİ" : mode.toUpperCase();
        
        let html = '', kalan = anaPara; 
        let tTaksit = 0, tAnapara = 0, tFaiz = 0, tIndFaiz = 0, tBsmv = 0, tKkdf = 0, tSubTaksit = 0;
        const sabitAnapara = anaPara / taksitSayisi;

        for(let i=1; i<=taksitSayisi; i++) {
            let f = kalan * donemFaiz; 
            let indF = f * (1 - subOran);
            let bsmvMiktar = f * v_bsmv;
            let kkdfMiktar = f * v_kkdf;
            let a, t;
            if(tip === 'esit') { 
                t = (anaPara * bilesikFaiz * Math.pow(1+bilesikFaiz, taksitSayisi)) / (Math.pow(1+bilesikFaiz, taksitSayisi)-1); 
                a = t - (f + bsmvMiktar + kkdfMiktar); 
            } else { a = sabitAnapara; t = a + f + bsmvMiktar + kkdfMiktar; }
            if(i === taksitSayisi) a = kalan; 
            let subT = a + indF + bsmvMiktar; 
            kalan -= a;

            tTaksit += t; tAnapara += a; tFaiz += f; tIndFaiz += indF; tBsmv += bsmvMiktar; tKkdf += kkdfMiktar; tSubTaksit += subT;

            html += `<tr>
                <td>${i}</td>
                <td>${Math.round(a).toLocaleString('tr-TR')}</td>
                <td>${Math.round(f).toLocaleString('tr-TR')}</td>
                <td style="${mode==='traktor'?'':'display:none'}">${Math.round(indF).toLocaleString('tr-TR')}</td>
                <td>${(bsmvMiktar).toLocaleString('tr-TR', {maximumFractionDigits: 0})}</td>
                <td style="${mode==='traktor'?'display:none':''}">${Math.round(kkdfMiktar).toLocaleString('tr-TR')}</td>
                <td style="${mode==='traktor'?'display:none':''}">${Math.round(t).toLocaleString('tr-TR')}</td>
                <td style="${mode==='traktor'?'':'display:none'}">${Math.round(subT).toLocaleString('tr-TR')}</td>
                <td>${Math.max(0, Math.round(kalan)).toLocaleString('tr-TR')}</td>
            </tr>`;
        }

        let footHtml = `<tr class="total-row">
            <td>TOP</td>
            <td>${Math.round(tAnapara).toLocaleString('tr-TR')}</td>
            <td>${Math.round(tFaiz).toLocaleString('tr-TR')}</td>
            <td style="${mode==='traktor'?'':'display:none'}">${Math.round(tIndFaiz).toLocaleString('tr-TR')}</td>
            <td>${Math.round(tBsmv).toLocaleString('tr-TR')}</td>
            <td style="${mode==='traktor'?'display:none':''}">${Math.round(tKkdf).toLocaleString('tr-TR')}</td>
            <td style="${mode==='traktor'?'display:none':''}">${Math.round(tTaksit).toLocaleString('tr-TR')}</td>
            <td style="${mode==='traktor'?'':'display:none'}">${Math.round(tSubTaksit).toLocaleString('tr-TR')}</td>
            <td>-</td>
        </tr>`;
        
        document.getElementById('hTutar').style.display = (mode === 'traktor') ? 'none' : 'table-cell';
        document.getElementById('hIndFaiz').style.display = (mode === 'traktor') ? 'table-cell' : 'none';
        document.getElementById('hKkdf').style.display = (mode === 'traktor') ? 'none' : 'table-cell';
        document.getElementById('hSub').style.display = (mode === 'traktor') ? 'table-cell' : 'none';
        
        document.getElementById('plan').innerHTML = html;
        document.getElementById('tableFoot').innerHTML = footHtml;
        document.getElementById('result').style.display = 'block';
        calculated = true; document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false; checkApply();
    }

    function send() {
        const btn = document.getElementById('applyBtn'); btn.innerText = "GÖNDERİLİYOR..."; btn.disabled = true;
        const params = {
            tc: document.getElementById('tc').value, tel: document.getElementById('tel').value,
            tutar: document.getElementById('tutar').value, vade: document.getElementById('vade').value,
            faiz: document.getElementById('faiz').value, mod: mode.toUpperCase(), tarih: new Date().toLocaleString('tr-TR')
        };
        emailjs.send('service_5w8gyxb', 'template_ege1n6p', params).then(function() {
            alert("Başvuru başarıyla gönderildi!");
            document.getElementById('tc').value = ""; document.getElementById('tel').value = "";
            btn.innerText = "BAŞVURUYU TAMAMLA"; checkApply();
        }, function(error) { alert("Hata!"); btn.innerText = "TEKRAR DENE"; btn.disabled = false; });
    }
    function yazdir() { window.print(); }
    function indir() {
        const element = document.getElementById('pdf-area');
        html2pdf().from(element).set({ margin: 10, filename: 'Plan.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).save();
    }
</script>
</body>
</html>
