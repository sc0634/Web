<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kredi Hesaplama - Masraflar Dahil</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @page { size: A4 landscape; margin: 10mm; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #000; }
        .container { max-width: 1150px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; border: 1px solid #ddd; }
        h1 { color: #000; text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-top: 0; }
        
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0 10px 0; background: #fff; padding: 15px; border: 1px solid #000; border-radius: 4px; }
        .vergi-bilgi-satiri { display: flex; gap: 20px; background: #f9f9f9; padding: 10px 15px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 20px; font-size: 13px; font-weight: bold; }
        
        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 12px; }
        input, select { padding: 8px; border: 1px solid #000; border-radius: 4px; font-size: 13px; background: #fff; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; }
        button { flex: 1; padding: 12px; border: 2px solid #000; border-radius: 4px; font-weight: bold; cursor: pointer; background: #fff; color: #000; }
        button:hover { background: #000; color: #fff; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        th { background: #eee; color: #000; padding: 8px; border: 1px solid #000; text-align: center; font-size: 10px; }
        td { border: 1px solid #000; padding: 8px; text-align: center; background: #fff; }
        
        .taksit-font { font-size: 10px; }
        tfoot td { font-weight: bold; background: #eee !important; border: 2px solid #000; }
        .sub-highlight { font-weight: bold; background: #f0f0f0 !important; border: 1px solid #000; font-size: 10px; }
        
        /* Masraflar Bölümü */
        .masraflar-section { margin-top: 25px; padding: 15px; border-top: 2px solid #000; }
        .masraflar-baslik { font-size: 16px; font-weight: bold; text-decoration: underline; margin-bottom: 8px; text-transform: uppercase; }
        .masraf-satir { font-size: 14px; margin-bottom: 4px; font-weight: 500; }
        
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: #fff; }
            .container { border: none; width: 100%; max-width: 100%; padding: 0; }
            th, tfoot td { background: #ddd !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container" id="main-content">
    <div class="no-print">
        <h1>Kredi Hesaplama</h1>
        
        <div class="input-grid">
            <div class="field">
                <label>Kredi Türü</label>
                <select id="krediTuru" onchange="vergiGuncelle(); periyotGuncelle();">
                    <option value="traktor" selected>Traktör Kredisi</option>
                    <option value="ticari">Ticari Kredi</option>
                </select>
            </div>
            <div class="field">
                <label>Kredi Tutarı (₺)</label>
                <input type="number" id="tutar" value="2000000">
            </div>
            <div class="field">
                <label>Vade (Yıl)</label>
                <select id="vadeYil">
                    <option value="60" selected>5 Yıl (60 Ay)</option>
                    <option value="48">4 Yıl (48 Ay)</option>
                    <option value="36">3 Yıl (36 Ay)</option>
                    <option value="24">2 Yıl (24 Ay)</option>
                    <option value="12">1 Yıl (12 Ay)</option>
                </select>
            </div>
            <div class="field">
                <label>Ödeme Periyodu</label>
                <select id="periyot"></select>
            </div>
            <div class="field">
                <label>Yıllık Faiz (%)</label>
                <input type="number" id="faizYillik" step="0.01" value="40.50" oninput="yilliktanAyliga()">
            </div>
            <div class="field">
                <label>Sübvansiyon (%)</label>
                <input type="number" id="subOran" value="50">
            </div>
        </div>

        <div class="vergi-bilgi-satiri">
            <div>KKDF Oranı: <span id="kkdfGosterge">%0</span></div>
            <div>BSMV Oranı: <span id="bsmvGosterge">%5</span></div>
            <input type="hidden" id="faizAylik" value="3.375">
        </div>

        <div class="btn-group">
            <button onclick="hesapla()">HESAPLA</button>
            <button onclick="window.print()">YAZICIDAN ÇIKART (B&W)</button>
            <button onclick="indirPDF()">PDF OLARAK KAYDET</button>
        </div>
    </div>

    <div id="sonucAlani" style="display:none;">
        <h2 id="planBaslik" style="font-size: 14px; border-bottom: 1px solid #000; padding-bottom: 5px;"></h2>
        <table>
            <thead>
                <tr>
                    <th>Taksit No</th>
                    <th>Taksit Tutarı</th>
                    <th>Anapara</th>
                    <th>Faiz</th>
                    <th>BSMV</th>
                    <th>KKDF</th>
                    <th style="background: #ddd;">Sübvansiyon Sonrası Taksit Tutarı</th>
                    <th>Kalan Anapara</th>
                </tr>
            </thead>
            <tbody id="planBody"></tbody>
            <tfoot id="planFoot"></tfoot>
        </table>

        <div class="masraflar-section">
            <div class="masraflar-baslik">MASRAFLAR</div>
            <div id="masraf-tahsis" class="masraf-satir"></div>
            <div id="masraf-kasko" class="masraf-satir"></div>
            <div id="masraf-sigorta" class="masraf-satir"></div>
            <div id="masraf-diger" class="masraf-satir"></div>
        </div>
    </div>
</div>

<script>
    window.onload = function() { 
        vergiGuncelle();
        periyotGuncelle(); 
    };

    function vergiGuncelle() {
        const tur = document.getElementById('krediTuru').value;
        const kkdfLabel = document.getElementById('kkdfGosterge');
        const bsmvLabel = document.getElementById('bsmvGosterge');
        if (tur === 'traktor' || tur === 'ticari') {
            kkdfLabel.innerText = "%0";
            bsmvLabel.innerText = "%5";
        }
    }

    function yilliktanAyliga() {
        const yillik = parseFloat(document.getElementById('faizYillik').value);
        if (!isNaN(yillik)) document.getElementById('faizAylik').value = (yillik / 12).toFixed(3);
    }

    function periyotGuncelle() {
        const tur = document.getElementById('krediTuru').value;
        const periyotSelect = document.getElementById('periyot');
        periyotSelect.innerHTML = '';
        if (tur === 'traktor') {
            periyotSelect.innerHTML = `<option value="6">6 Ayda Bir</option><option value="12" selected>Yılda Bir</option>`;
        } else {
            periyotSelect.innerHTML = `<option value="1">Ayda Bir</option><option value="3">3 Ayda Bir</option><option value="6">6 Ayda Bir</option><option value="12">Yılda Bir</option>`;
        }
    }

    function hesapla() {
        const tur = document.getElementById('krediTuru').value;
        let kkdf = 0;
        let bsmv = 0.05;

        const P = parseFloat(document.getElementById('tutar').value);
        const aylikFaiz = parseFloat(document.getElementById('faizAylik').value) / 100;
        const toplamVade = parseInt(document.getElementById('vadeYil').value);
        const periyot = parseInt(document.getElementById('periyot').value);
        const sRate = parseFloat(document.getElementById('subOran').value) / 100;

        const taksitSayisi = toplamVade / periyot;
        const donemlikFaiz = aylikFaiz * periyot;
        const i = donemlikFaiz * (1 + kkdf + bsmv);
        const taksit = (P * i * Math.pow(1 + i, taksitSayisi)) / (Math.pow(1 + i, taksitSayisi) - 1);
        
        document.getElementById('planBaslik').innerText = "Ödeme Planı: " + document.getElementById('krediTuru').selectedOptions[0].text;
        const tbody = document.getElementById('planBody');
        const tfoot = document.getElementById('planFoot');
        tbody.innerHTML = '';
        tfoot.innerHTML = '';
        document.getElementById('sonucAlani').style.display = 'block';

        let kalan = P;
        let tTaksit = 0, tAnapara = 0, tFaiz = 0, tBsmv = 0, tKkdf = 0, tSub = 0;

        for (let j = 1; j <= taksitSayisi; j++) {
            const f = kalan * donemlikFaiz;
            const b = f * bsmv;
            const k = f * kkdf;
            let a = taksit - (f + b + k);
            if (j === taksitSayisi) a = kalan;
            const subTaksit = taksit - ((f + b + k) * sRate);
            
            tTaksit += taksit; tAnapara += a; tFaiz += f; tBsmv += b; tKkdf += k; tSub += subTaksit;
            kalan -= a;

            tbody.innerHTML += `<tr>
                <td>${j}</td>
                <td class="taksit-font">${taksit.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td class="taksit-font">${a.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td class="taksit-font">${f.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td class="taksit-font">${b.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td class="taksit-font">${k.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td class="sub-highlight">${subTaksit.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td class="taksit-font">${Math.abs(kalan).toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            </tr>`;
        }

        tfoot.innerHTML = `<tr>
            <td>TOPLAM</td>
            <td class="taksit-font">${tTaksit.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td class="taksit-font">${tAnapara.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td class="taksit-font">${tFaiz.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td class="taksit-font">${tBsmv.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td class="taksit-font">${tKkdf.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td style="background: #ddd;" class="taksit-font">${tSub.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td>-</td>
        </tr>`;

        // Masraflar Hesaplama (Tahmini Değerler)
        document.getElementById('masraf-tahsis').innerText = "Limit Tahsis Ücreti: ~ " + (P * 0.005).toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺";
        document.getElementById('masraf-kasko').innerText = "Kasko: ~ " + (P * 0.03).toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺";
        document.getElementById('masraf-sigorta').innerText = "Hayat Sigortası: ~ " + (P * 0.02).toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺";
        document.getElementById('masraf-diger').innerText = "Diğer Masraflar: ~ " + (P * 0.01).toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺";
    }

    function indirPDF() {
        const element = document.getElementById('main-content');
        html2pdf().set({ margin: 10, filename: 'kredi-plani.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).from(element).save();
    }
</script>
</body>
</html>
