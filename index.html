<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --tarimsal: #2ecc71; --ticari: #e67e22; --bireysel: #3498db; --hakkimda: #34495e;
            --success: #27ae60; --danger: #e74c3c; --dark: #2c3e50; --light: #ecf0f1; --border: #dcdde1;
            --input-height: 40px;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f6fa; margin: 0; padding: 10px; color: var(--dark); font-size: 13px; }
        
        .container { 
            max-width: 1000px; margin: 10px auto; background: #fff; padding: 20px; 
            border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); 
            position: relative; min-height: 400px;
        }

        /* Sağ Üst Yazdır Butonu */
        .top-print-btn {
            position: absolute; top: 20px; right: 20px;
            background: var(--dark); color: white; border: none;
            padding: 8px 15px; border-radius: 5px; font-weight: bold;
            cursor: pointer; font-size: 11px; z-index: 10;
        }
        .top-print-btn:hover { opacity: 0.9; }
        
        .segment-nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; white-space: nowrap; padding-bottom: 8px; width: calc(100% - 100px); }
        .seg-btn { 
            flex: 1 0 auto; min-width: 95px; border: 2px solid transparent; 
            height: 40px; border-radius: 6px; color: white; font-weight: bold; 
            cursor: pointer; font-size: 11px; opacity: 0.5; transition: 0.3s; padding: 0 15px;
        }
        .seg-btn.active { opacity: 1; border-color: #fff; outline: 2px solid var(--dark); }
        .bg-tar { background: var(--tarimsal); } .bg-tic { background: var(--ticari); }
        .bg-bir { background: var(--bireysel); } .bg-hak { background: var(--hakkimda); }

        .tabs { display: none; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--light); padding-bottom: 8px; }
        .tab-btn { padding: 6px 10px; border: none; background: #eee; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; }
        .tab-btn.active { background: var(--dark); color: white; }
        
        .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        
        input, select { 
            height: var(--input-height) !important; padding: 0 8px; 
            border: 1px solid var(--border); border-radius: 5px; 
            font-size: 12px; outline: none; background: white; width: 100%;
        }
        input[readonly] { background-color: #f1f2f6; color: #7f8c8d; cursor: not-allowed; }

        #prof-input-box, #tutar-input-box { width: 140px; }
        .px-faiz, .px-vergi { width: 65px; }
        .px-vade-sync { width: 85px; }
        .px-periyot { width: 130px; }
        
        .options-container { 
            display: flex; flex-direction: row; gap: 10px; width: 100%;
            padding: 10px; background: #fdfdfd; border: 1px dashed var(--border); border-radius: 5px; 
            margin-top: 5px; flex-wrap: wrap;
        }
        .opt-row { display: flex; align-items: center; gap: 5px; cursor: pointer; min-width: 110px; } 
        .opt-row label { font-size: 11px; cursor: pointer; }
        .opt-row input { width: 16px; height: 16px; cursor: pointer; }

        .info-box { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; font-weight: bold; display: none; text-align: center; }
        .hazine-box { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; background: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; font-size: 11px; text-align: center; display: none; }
        
        .result-main-container { margin-top: 15px; border: 2px solid var(--dark); border-radius: 6px; overflow: hidden; display: none; }
        .result-main-title { background: var(--dark); color: white; padding: 10px; text-align: center; font-weight: bold; }
        .table-res { overflow-x: auto; width: 100%; background: white; padding: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { padding: 6px 2px; border: 1px solid var(--border); text-align: center; }
        tfoot tr { background: #f8f9fa; font-weight: bold; border-top: 2px solid var(--dark); }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 8px; margin-top: 15px; }
        .btn { height: 45px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #9b59b6; }
        .btn-print { background: var(--dark); }

        @media print { .no-print { display: none !important; } }
        @media (max-width: 600px) {
            .actions { grid-template-columns: 1fr 1fr 1fr !important; }
            .top-print-btn { padding: 5px 10px; font-size: 9px; top: 15px; right: 10px; }
        }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <!-- Sağ Üst Yazdır Butonu -->
    <button class="top-print-btn no-print" onclick="window.print()">YAZDIR</button>

    <div class="segment-nav no-print">
        <button id="seg-tar" class="seg-btn bg-tar" onclick="switchSegment('tarimsal')">TARIMSAL</button>
        <button id="seg-tic" class="seg-btn bg-tic" onclick="switchSegment('ticari')">TİCARİ</button>
        <button id="seg-bir" class="seg-btn bg-bir" onclick="switchSegment('bireysel')">BİREYSEL</button>
        <button id="seg-hak" class="seg-btn bg-hak" onclick="switchSegment('hakkimda')">HAKKIMDA</button>
    </div>

    <div id="calculator-ui">
        <div class="tabs no-print" id="tabs-tarimsal">
            <button class="tab-btn" onclick="switchTab(this, 'traktor')">Traktör</button>
            <button class="tab-btn" onclick="switchTab(this, 'ekipman')">Ekipman</button>
            <button class="tab-btn" onclick="switchTab(this, 'zirai')">Çiftçi Taksitli</button>
            <button class="tab-btn" onclick="switchTab(this, 'isletme')">İşletme Kredisi</button>
        </div>
        <div class="tabs no-print" id="tabs-ticari"><button class="tab-btn" onclick="switchTab(this, 'ticari')">İşletme</button></div>
        <div class="tabs no-print" id="tabs-bireysel"><button class="tab-btn" onclick="switchTab(this, 'tuketici')">İhtiyaç</button></div>

        <div class="grid no-print" id="main-inputs">
            <div class="field" id="prof-input-box"><label>Proforma Bedeli</label><input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)"></div>
            <div class="field" id="tutar-input-box"><label>Kredi Tutarı</label><input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)"></div>
            <div class="field px-faiz"><label>Yıllık %</label><input type="number" id="faiz" value="40.50" step="0.01" oninput="syncFaiz('yillik')"></div>
            <div class="field px-faiz"><label>Aylık %</label><input type="number" id="faizAylik" value="3.38" step="0.01" oninput="syncFaiz('aylik')"></div>
            <div class="field px-vergi"><label>BSMV %</label><input type="number" id="bsmv" value="5" readonly></div>
            <div class="field px-vergi"><label>KKDF %</label><input type="number" id="kkdf" value="0" readonly></div>
            <div class="field px-vade-sync" id="vade-box-select"><label>Vade</label><select id="vade-select" onchange="reset()"></select></div>
            <div class="field px-vade-slider" id="vade-box-slider">
                <label>Vade: <span id="vade-val">12</span> Ay</label>
                <div class="slider-container"><input type="range" id="vade-slider" min="1" max="36" value="12" oninput="updateSliderVal(this.value)"></div>
            </div>
            <div class="field px-vergi" id="sub-input-box"><label>İndirim %</label><input type="number" id="subOran" value="50" readonly></div>
            <div class="field px-periyot" id="periyot-box"><label>Ödeme Periyodu</label><select id="periyot" onchange="reset()"></select></div>
            
            <div class="options-container" id="ziraiOpts">
                <div class="opt-row"><input type="checkbox" id="yerli" checked onchange="updateYerli()"><label for="yerli">Yerli Malı</label></div>
                <div class="opt-row" id="bb-box"><input type="checkbox" id="buyback" checked onchange="reset()"><label for="buyback">Buy Back</label></div>
                <div id="dynamic-info-box" class="info-box"></div>
                <div id="hazine-info-box" class="hazine-box"></div>
            </div>
        </div>

        <div class="actions no-print">
            <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
            <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF İNDİR</button>
            <button class="btn btn-print" id="printBtn" onclick="window.print()" disabled>YAZDIR</button>
        </div>

        <div id="result-main-container" class="result-main-container">
            <div class="result-main-title">Ödeme Planı Detayları</div>
            <div id="result-area" style="padding:10px;"></div>
        </div>
    </div>

    <div id="about-box" style="display:none; padding:40px; text-align:center;">
        <h2 style="color:var(--dark)">Süleyman Coşkun</h2>
        <p>Finansal Çözümler ve Kredi Danışmanlığı</p>
    </div>
</div>

<script>
    let mode = 'traktor'; let segment = 'tarimsal';
    function initApp() { fmtMoney(document.getElementById('proforma')); fmtMoney(document.getElementById('tutar')); switchSegment('tarimsal'); }
    function syncFaiz(src) {
        const y = document.getElementById('faiz'), a = document.getElementById('faizAylik');
        if (src === 'yillik') a.value = (parseFloat(y.value) / 12).toFixed(2);
        else y.value = (parseFloat(a.value) * 12).toFixed(2);
        reset();
    }
    function switchSegment(seg) {
        segment = seg;
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('seg-' + seg.substring(0,3)).classList.add('active');
        updatePeriyotOptions();
        if (seg === 'hakkimda') {
            document.getElementById('calculator-ui').style.display = 'none';
            document.getElementById('about-box').style.display = 'block';
        } else {
            document.getElementById('calculator-ui').style.display = 'block';
            document.getElementById('about-box').style.display = 'none';
            document.querySelectorAll('.tabs').forEach(t => t.style.display = 'none');
            document.getElementById(`tabs-${seg}`).style.display = 'flex';
            document.getElementById(`tabs-${seg}`).querySelector('.tab-btn').click();
        }
        reset();
    }
    function updatePeriyotOptions() {
        const p = document.getElementById('periyot'); p.innerHTML = '';
        const opts = [{v:"1",t:"Aylık"}, {v:"3",t:"3 Ayda Bir"}, {v:"6",t:"6 Ayda Bir"}, {v:"12",t:"Yıllık"}];
        opts.forEach(o => {
            if (segment === 'bireysel' && (o.v === "6" || o.v === "12")) return;
            let el = document.createElement('option'); el.value = o.v; el.text = o.t; p.appendChild(el);
        });
        p.value = (segment === 'tarimsal') ? "12" : "1";
    }
    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); mode = m; reset();
        const isBir = (segment === 'bireysel'), isTic = (segment === 'ticari'), isSub = (mode === 'traktor' || mode === 'ekipman');
        document.getElementById('bb-box').style.display = (mode === 'ekipman') ? 'none' : 'flex';
        document.getElementById('vade-box-select').style.display = isTic ? 'flex' : 'none';
        document.getElementById('vade-box-slider').style.display = isBir ? 'flex' : 'none';
        document.getElementById('periyot-box').style.display = (segment === 'tarimsal') ? 'none' : 'flex';
        document.getElementById('ziraiOpts').style.display = isSub ? 'flex' : 'none';
        document.getElementById('sub-input-box').style.display = isSub ? 'flex' : 'none';
        document.getElementById('prof-input-box').style.display = (segment === 'tarimsal' && !['zirai','isletme'].includes(mode)) ? 'flex' : 'none';
        if(isTic) fillVades(60); else if(isBir) fillVades(36);
        if(isSub) updateYerli();
    }
    function fillVades(max) {
        const s = document.getElementById('vade-select'); s.innerHTML = '';
        for(let i=1; i<=max; i++) {
            let o = document.createElement('option'); o.value = i; o.text = i + " Ay";
            if(i===12) o.selected = true; s.appendChild(o);
        }
    }
    function updateSliderVal(v) { document.getElementById('vade-val').innerText = v; reset(); }
    function fmtMoney(i) { let v = i.value.replace(/\D/g, ""); if(v) i.value = new Intl.NumberFormat('tr-TR').format(v); reset(); }
    function reset() { 
        document.getElementById('result-main-container').style.display = 'none'; 
        document.getElementById('pdfBtn').disabled = true; 
        document.getElementById('printBtn').disabled = true; 
        document.getElementById('dynamic-info-box').style.display = 'none';
        document.getElementById('hazine-info-box').style.display = 'none';
    }
    function updateYerli() { 
        if(mode === 'traktor') document.getElementById('subOran').value = document.getElementById('yerli').checked ? 50 : 25;
        else if(mode === 'ekipman') document.getElementById('subOran').value = document.getElementById('yerli').checked ? 75 : 50;
        reset(); 
    }

    function hesapla() {
        const res = document.getElementById('result-area'); res.innerHTML = '';
        const infoBox = document.getElementById('dynamic-info-box');
        const hazineBox = document.getElementById('hazine-info-box');
        const anaPara = parseFloat(document.getElementById('tutar').value.replace(/\./g, "")) || 0;
        if(anaPara <= 0) return alert("Tutar giriniz.");

        if (mode === 'traktor' || mode === 'ekipman') {
            const yerliCheck = document.getElementById('yerli').checked;
            if(yerliCheck) {
                hazineBox.style.display = 'block';
                hazineBox.innerHTML = 'ℹ️ Yerli malı kapsamında faizin %25\'ini Hazine ödemektedir.';
            } else {
                hazineBox.style.display = 'none';
            }
        }

        const yF = document.getElementById('faiz').value / 100, bsmv = document.getElementById('bsmv').value / 100, kkdf = document.getElementById('kkdf').value / 100;
        const periyot = (segment === 'tarimsal' ? 12 : parseInt(document.getElementById('periyot').value));
        const subO = (segment === 'tarimsal' && (mode === 'traktor' || mode === 'ekipman')) ? document.getElementById('subOran').value / 100 : 0;
        let vades = (segment === 'tarimsal') ? [5, 4, 3, 2, 1] : [(segment === 'bireysel' ? parseInt(document.getElementById('vade-slider').value) : parseInt(document.getElementById('vade-select').value))];
        
        vades.forEach(v => {
            let tSayisi = (segment === 'tarimsal') ? v : Math.ceil(v / periyot);
            let dF = (yF / 12) * periyot, bF = dF * (1 + bsmv + kkdf);
            let taksit = (anaPara * bF * Math.pow(1+bF, tSayisi)) / (Math.pow(1+bF, tSayisi)-1);
            
            let h = `<div style="margin-bottom:15px"><div style="background:#f1f2f6;padding:8px;text-align:center;font-weight:bold">${v} ${segment==='tarimsal'?'Yıl':'Ay'}</div><div class="table-res"><table><thead><tr><th>Tks</th><th>Ana Para</th><th>Brüt Faiz</th>${subO>0?'<th>Ind. Faiz</th>':''}<th>Vergi</th><th>Taksit</th><th>Kalan</th></tr></thead><tbody>`;
            
            let kalan = anaPara, totA = 0, totF = 0, totI = 0, totV = 0, totT = 0;
            for(let i=1; i<=tSayisi; i++){
                let f = kalan * dF, b = f * (bsmv + kkdf), ind = f * subO, a = (i===tSayisi) ? kalan : taksit - (f + b);
                let tNet = taksit - ind;
                
                h += `<tr><td>${i}</td><td>${Math.round(a).toLocaleString('tr-TR')}</td><td>${Math.round(f).toLocaleString('tr-TR')}</td>${subO>0?`<td>${Math.round(ind).toLocaleString('tr-TR')}</td>`:''}<td>${Math.round(b).toLocaleString('tr-TR')}</td><td>${Math.round(tNet).toLocaleString('tr-TR')}</td><td>${Math.max(0,Math.round(kalan-a)).toLocaleString('tr-TR')}</td></tr>`;
                
                totA += a; totF += f; totI += ind; totV += b; totT += tNet;
                kalan -= a;
            }
            
            // TOPLAM SATIRI
            h += `</tbody><tfoot><tr><td>TOPLAM</td><td>${Math.round(totA).toLocaleString('tr-TR')}</td><td>${Math.round(totF).toLocaleString('tr-TR')}</td>${subO>0?`<td>${Math.round(totI).toLocaleString('tr-TR')}</td>`:''}<td>${Math.round(totV).toLocaleString('tr-TR')}</td><td>${Math.round(totT).toLocaleString('tr-TR')}</td><td>-</td></tr></tfoot></table></div></div>`;
            res.innerHTML += h;
        });
        document.getElementById('result-main-container').style.display = 'block';
        document.getElementById('pdfBtn').disabled = false; document.getElementById('printBtn').disabled = false;
    }
    function indir() {
        const el = document.getElementById('pdf-area');
        html2pdf().set({ margin: 5, filename: 'Kredi_Plani.pdf', html2canvas: { scale: 2, ignoreElements: (e) => e.classList.contains('no-print') }, jsPDF: { unit: 'mm', format: 'a4' } }).from(el).save();
    }
</script>
</body>
</html>
