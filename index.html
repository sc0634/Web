<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @page { size: A4 landscape; margin: 10mm; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1150px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #27ae60; padding-bottom: 15px; margin-top: 0; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 25px 0; background: #f9f9f9; padding: 20px; border-radius: 8px; }
        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 8px; font-size: 13px; color: #444; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 30px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .calc-btn { background: #27ae60; color: white; }
        .print-btn { background: #5d6d7e; color: white; }
        .pdf-btn { background: #3498db; color: white; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th { background: #2c3e50; color: white; padding: 10px; text-align: center; }
        td { border-bottom: 1px solid #eee; padding: 10px; text-align: center; }
        tr:nth-child(even) { background: #f8f9fa; }
        .sub-highlight { color: #d35400; font-weight: bold; background: #fff5eb !important; }
        .detaylar-section { margin-top: 30px; padding: 20px; border-top: 1px solid #eee; }
        .detaylar-baslik { font-size: 18px; font-weight: bold; text-decoration: underline; margin-bottom: 10px; color: #2c3e50; }
        .detay-satir { font-size: 15px; margin-bottom: 5px; color: #555; }
        @media print { .no-print { display: none !important; } .container { box-shadow: none; border: none; width: 100%; } }
    </style>
</head>
<body>

<div class="container" id="main-content">
    <div class="no-print">
        <h1>Kredi Hesaplama</h1>
        <div class="input-grid">
            <div class="field">
                <label>Kredi Türü</label>
                <select id="krediTuru" onchange="periyotGuncelle()">
                    <option value="traktor" selected>Traktör Kredisi (%15 KKDF + %15 BSMV)</option>
                    <option value="ihtiyac">İhtiyaç Kredisi (%15 KKDF + %15 BSMV)</option>
                    <option value="ticari">Ticari Kredi (%0 KKDF + %5 BSMV)</option>
                </select>
            </div>
            <div class="field">
                <label>Kredi Tutarı (₺)</label>
                <input type="number" id="tutar" value="2000000">
            </div>
            <div class="field">
                <label>Vade (Yıl)</label>
                <select id="vadeYil">
                    <option value="60" selected>5 Yıl (60 Ay)</option>
                    <option value="48">4 Yıl (48 Ay)</option>
                    <option value="36">3 Yıl (36 Ay)</option>
                    <option value="24">2 Yıl (24 Ay)</option>
                    <option value="12">1 Yıl (12 Ay)</option>
                </select>
            </div>
            <div class="field">
                <label>Ödeme Periyodu</label>
                <select id="periyot"></select>
            </div>
            <div class="field">
                <label>Yıllık Faiz Oranı (%)</label>
                <input type="number" id="faizYillik" step="0.01" value="40.50" oninput="yilliktanAyliga()">
            </div>
            <div class="field">
                <label>Aylık Faiz Oranı (%)</label>
                <input type="number" id="faizAylik" step="0.001" value="3.375" oninput="ayliktanYilliga()">
            </div>
            <div class="field">
                <label>Sübvansiyon (%)</label>
                <input type="number" id="subOran" value="20">
            </div>
        </div>

        <div class="btn-group">
            <button class="calc-btn" onclick="hesapla()">HESAPLA</button>
            <button class="print-btn" onclick="window.print()">YAZDIR</button>
            <button class="pdf-btn" onclick="indirPDF()">PDF KAYDET</button>
        </div>
    </div>

    <div id="sonucAlani" style="display:none;">
        <h2 id="planBaslik" style="font-size: 16px; color: #2c3e50;"></h2>
        <table>
            <thead>
                <tr>
                    <th>Dönem</th>
                    <th>Taksit Tutarı</th>
                    <th>Anapara</th>
                    <th>Faiz</th>
                    <th>BSMV (%15)</th>
                    <th>KKDF (%15)</th>
                    <th style="background: #e67e22; color:white;">Sübvansiyonlu Ödeme</th>
                    <th>Kalan Anapara</th>
                </tr>
            </thead>
            <tbody id="planBody"></tbody>
        </table>

        <div class="detaylar-section">
            <div class="detaylar-baslik">Önemli Detaylar</div>
            <div class="detay-satir" id="detay-kasko"></div>
            <div class="detay-sigorta detay-satir" id="detay-sigorta"></div>
            <div class="detay-tesis detay-satir" id="detay-tesis"></div>
        </div>
    </div>
</div>

<script>
    window.onload = function() { periyotGuncelle(); };

    function ayliktanYilliga() {
        const aylik = parseFloat(document.getElementById('faizAylik').value);
        if (!isNaN(aylik)) document.getElementById('faizYillik').value = (aylik * 12).toFixed(2);
    }

    function yilliktanAyliga() {
        const yillik = parseFloat(document.getElementById('faizYillik').value);
        if (!isNaN(yillik)) document.getElementById('faizAylik').value = (yillik / 12).toFixed(3);
    }

    function periyotGuncelle() {
        const tur = document.getElementById('krediTuru').value;
        const periyotSelect = document.getElementById('periyot');
        periyotSelect.innerHTML = '';
        if (tur === 'traktor') {
            periyotSelect.innerHTML = `<option value="6">6 Ayda Bir</option><option value="12" selected>Yılda Bir</option>`;
        } else {
            periyotSelect.innerHTML = `<option value="1">Ayda Bir</option><option value="3">3 Ayda Bir</option><option value="6">6 Ayda Bir</option><option value="12">Yılda Bir</option>`;
        }
    }

    function hesapla() {
        const tur = document.getElementById('krediTuru').value;
        let kkdf = 0.15, bsmv = 0.15;
        if (tur === 'ticari') { kkdf = 0; bsmv = 0.05; }

        const P = parseFloat(document.getElementById('tutar').value);
        const aylikFaiz = parseFloat(document.getElementById('faizAylik').value) / 100;
        const toplamVade = parseInt(document.getElementById('vadeYil').value);
        const periyot = parseInt(document.getElementById('periyot').value);
        const sRate = parseFloat(document.getElementById('subOran').value) / 100;

        const taksitSayisi = toplamVade / periyot;
        const donemlikFaiz = aylikFaiz * periyot;
        const i = donemlikFaiz * (1 + kkdf + bsmv);
        const taksit = (P * i * Math.pow(1 + i, taksitSayisi)) / (Math.pow(1 + i, taksitSayisi) - 1);
        
        document.getElementById('planBaslik').innerText = "Ödeme Planı (" + document.getElementById('periyot').selectedOptions[0].text + ")";
        const tbody = document.getElementById('planBody');
        tbody.innerHTML = '';
        document.getElementById('sonucAlani').style.display = 'block';

        let kalan = P;
        for (let j = 1; j <= taksitSayisi; j++) {
            const f = kalan * donemlikFaiz;
            const b = f * bsmv;
            const k = f * kkdf;
            let a = taksit - (f + b + k);
            if (j === taksitSayisi) a = kalan;
            const subTaksit = taksit - ((f + b + k) * sRate);
            kalan -= a;

            tbody.innerHTML += `<tr>
                <td>${j}. Ödeme (${j * periyot}. Ay)</td>
                <td>${taksit.toLocaleString('tr-TR', {minimumFractionDigits:2})} ₺</td>
                <td>${a.toLocaleString('tr-TR', {minimumFractionDigits:2})} ₺</td>
                <td>${f.toLocaleString('tr-TR', {minimumFractionDigits:2})} ₺</td>
                <td>${b.toLocaleString('tr-TR', {minimumFractionDigits:2})} ₺</td>
                <td>${k.toLocaleString('tr-TR', {minimumFractionDigits:2})} ₺</td>
                <td class="sub-highlight">${subTaksit.toLocaleString('tr-TR', {minimumFractionDigits:2})} ₺</td>
                <td>${Math.abs(kalan).toLocaleString('tr-TR', {minimumFractionDigits:2})} ₺</td>
            </tr>`;
        }

        document.getElementById('detay-kasko').innerText = "Kasko: " + (P * 0.03).toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺ (%3)";
        document.getElementById('detay-sigorta').innerText = "Hayat Sigortası: " + (P * 0.02).toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺ (%2)";
        document.getElementById('detay-tesis').innerText = "Tesis Masrafı: " + (P * 0.04).toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺ (%4)";
    }

    function indirPDF() {
        const element = document.getElementById('main-content');
        html2pdf().set({ margin: 10, filename: 'kredi-hesaplama.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).from(element).save();
    }
</script>
</body>
</html>
