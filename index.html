<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süleyman Coşkun - Finansal Portfolyo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @page { size: A4 landscape; margin: 10mm; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 0; 
            color: #000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Navigasyon */
        .tabs { 
            display: flex; 
            background: #2c3e50; 
            padding: 0 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
            overflow-x: auto; /* Mobilde sekmeler kaydırılabilir */
            white-space: nowrap;
        }
        
        .tab-link { 
            padding: 12px 15px; 
            color: #fff; 
            border: none; 
            background: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s; 
            font-size: 13px; 
        }
        .tab-link.active { background: #fff; color: #2c3e50; border-radius: 4px 4px 0 0; margin-top: 5px; }
        
        .tab-content { display: none; padding: 15px; animation: fadeIn 0.5s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .container { max-width: 1150px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        h1 { color: #000; text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin: 0 0 20px 0; font-size: 18px; }

        /* Mobil Uyumlu Grid */
        .input-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 12px; 
            margin-bottom: 15px; 
            padding: 15px; 
            border: 1px solid #000; 
            border-radius: 4px; 
        }

        .vergi-bilgi-satiri { 
            display: flex; flex-wrap: wrap; gap: 15px; background: #f9f9f9; padding: 8px 15px; 
            border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; font-size: 13px; font-weight: bold; 
        }

        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 12px; }
        input, select { padding: 10px; border: 1px solid #000; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
        
        /* Buton Grubu Mobil Ayarı */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        button { padding: 12px 5px; border: 2px solid #000; border-radius: 4px; font-weight: bold; cursor: pointer; background: #fff; font-size: 12px; }
        button:hover:not(:disabled) { background: #000; color: #fff; }
        .btn-clear { border-color: #d32f2f; color: #d32f2f; }
        button:disabled { border-color: #ccc; color: #999; cursor: not-allowed; background: #f9f9f9; }

        /* Tablo Mobil Kaydırma */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; min-width: 600px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: center; }
        th { background: #eee; }
        .kkdf-col { display: table-cell; }
        .hide-kkdf { display: none !important; }

        /* Hakkımda Kartı */
        .about-card { max-width: 100%; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; text-align: center; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #2c3e50; margin-bottom: 15px; }
        .info-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; text-align: left; }
        .info-item { background: #f8f9fa; padding: 12px; border-radius: 5px; border-left: 4px solid #2c3e50; font-size: 13px; }

        /* Tablet ve Masaüstü İyileştirmeleri */
        @media (min-width: 768px) {
            .btn-group { grid-template-columns: repeat(4, 1fr); }
            h1 { font-size: 22px; }
            .info-grid { grid-template-columns: 1fr 1fr; }
            .about-card { padding: 40px; }
        }

        @media print {
            .tabs, .no-print, h1 { display: none !important; }
            .tab-content { display: block !important; padding: 0; }
            .container { border: none; }
            .table-responsive { overflow: visible; }
        }
    </style>
</head>
<body>

<div class="tabs no-print">
    <button class="tab-link active" onclick="openTab(event, 'traktor')">🚜 Traktör</button>
    <button class="tab-link" onclick="openTab(event, 'ticari')">💼 Ticari</button>
    <button class="tab-link" onclick="openTab(event, 'hakkimda')">👤 Hakkımda</button>
</div>

<div id="krediAlani" class="tab-content active">
    <div class="container" id="main-content">
        <div class="no-print">
            <h1 id="baslikText">Traktör Kredisi Hesaplama</h1>
            <div class="input-grid">
                <div class="field">
                    <label>Kredi Tutarı (₺)</label>
                    <input type="text" id="tutar" value="2.000.000" oninput="formatTutar(this); resetButtons();">
