<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süleyman Coşkun - Finansal Portfolyo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @page { size: A4 landscape; margin: 10mm; }
        body { 
            font-family: 'Courier New', Courier, monospace; /* Banka dekontu havası için monospaced font */
            background-color: #fff; 
            margin: 0; 
            padding: 0; 
            color: #000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Menü */
        .tabs { 
            display: flex; 
            background: #000; 
            padding: 0 10px; 
            position: sticky;
            top: 0;
            z-index: 1000;
            overflow-x: auto;
        }
        
        .tab-link { 
            padding: 12px 20px; 
            color: #fff; 
            border: none; 
            background: none; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px; 
        }
        .tab-link.active { background: #fff; color: #000; }
        
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }

        .container { max-width: 1150px; margin: 0 auto; background: #fff; padding: 25px; border: 1px solid #000; }
        
        h1 { color: #000; text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 25px; font-size: 20px; text-transform: uppercase; }

        .print-header { display: none; text-align: center; border-bottom: 2px solid #000; margin-bottom: 20px; padding-bottom: 10px; }

        .input-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 15px; 
            margin-bottom: 20px; 
            padding: 20px; 
            border: 1px solid #000;
        }

        .vergi-bilgi-satiri { 
            display: flex; gap: 20px; padding: 10px; 
            border: 1px solid #000; margin-bottom: 20px; font-size: 12px; font-weight: bold;
        }

        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 11px; text-transform: uppercase; }
        input, select { padding: 10px; border: 1px solid #000; font-size: 13px; background: #fff; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        button { flex: 1; min-width: 120px; padding: 12px; border: 1px solid #000; font-weight: bold; cursor: pointer; font-size: 12px; text-transform: uppercase; transition: 0.2s; }
        button:hover:not(:disabled) { background: #000; color: #fff; }
        .btn-clear { background: #fff; color: #000; }
        button:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #000; color: #fff; padding: 10px 5px; font-size: 11px; border: 1px solid #000; }
        td { border: 1px solid #000; padding: 10px 5px; text-align: center; font-size: 12px; }
        .bold-col { font-weight: bold; }

        @media (min-width: 768px) { h1 { font-size: 24px; } }

        @media print {
            .tabs, .no-print, .btn-group, .input-grid, .vergi-bilgi-satiri, h1 { display: none !important; }
            .container { border: none; padding: 0; }
            .print-header { display: block; }
            table { min-width: 100%; }
            th { background: #000 !important; color: #fff !important; }
            .table-responsive { overflow: visible; }
        }
    </style>
</head>
<body>

<div class="tabs no-print">
    <button class="tab-link active" onclick="openTab(event, 'traktor')">🚜 Traktör Kredisi</button>
    <button class="tab-link" onclick="openTab(event, 'ticari')">💼 Ticari Kredi</button>
    <button class="tab-link" onclick="openTab(event, 'hakkimda')">👤 Hakkımda</button>
</div>

<div id="krediAlani" class="tab-content active">
    <div class="container" id="main-content">
        
        <div class="print-header">
            <h2 style="margin:0;">KREDİ ÖDEME PLANI</h2>
            <p style="margin:5px 0;">Süleyman Coşkun | Finansal Analiz</p>
            <p id="printDate" style="font-size:12px;"></p>
        </div>

        <div class="no-print">
            <h1 id="baslikText">Kredi Hesaplama Sistemi</h1>
            <div class="input-grid">
                <div class="field">
                    <label>Kredi Tutarı (₺)</label>
                    <input type="text" id="tutar" value="2.000.000" oninput="formatTutar(this); resetButtons();">
                </div>
                <div class="field">
                    <label>Vade (Yıl)</label>
                    <select id="vadeYil" onchange="resetButtons();">
                        <option value="5">5 Yıl</option>
                        <option value="4">4 Yıl</option>
                        <option value="3">3 Yıl</option>
                        <option value="2">2 Yıl</option>
                        <option value="1">1 Yıl</option>
                    </select>
                </div>
                <div class="field">
                    <label>Ödeme Sıklığı</label>
                    <select id="periyot" onchange="resetButtons();">
                        <option value="12">Ayda Bir</option>
                        <option value="4">3 Ayda Bir</option>
                        <option value="2">6 Ayda Bir</option>
                        <option value="1">Yılda Bir</option>
                    </select>
                </div>
                <div class="field">
                    <label>Yıllık Faiz (%)</label>
                    <input type="number" id="faizYillik" step="0.01" value="40.50" oninput="resetButtons();">
                </div>
                <div class="field">
                    <label>Sübvansiyon (%)</label>
                    <input type="number" id="subOran" value="50" oninput="resetButtons();">
                </div>
            </div>

            <div class="vergi-bilgi-satiri">
                <span>BSMV: %5</span>
                <span id="kkdfBilgi">KKDF: %0</span>
            </div>

            <div class="btn-group">
                <button onclick="hesapla()">HESAPLA</button>
                <button class="btn-clear" onclick="temizleForm()">TEMİZLE</button>
                <button id="btnPdf" onclick="indirPDF()" disabled>PDF KAYDET</button>
                <button id="btnYazdir" onclick="window.print()" disabled>YAZDIR</button>
            </div>
        </div>

        <div id="sonucAlani" style="display:none;" class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Taksit Tutarı</th>
                        <th>Anapara</th>
                        <th>Faiz</th>
                        <th>BSMV</th>
                        <th class="kkdf-col">KKDF</th>
                        <th style="border: 2px solid #000;">Sübvansiyonlu Taksit</th>
                        <th>Kalan Anapara</th>
                    </tr>
                </thead>
                <tbody id="planBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="hakkimda" class="tab-content">
    <div class="container">
        <h2>Süleyman Coşkun</h2>
        <p>Finansal Analiz & Bankacılık Çözümleri</p>
    </div>
</div>

<script>
    let currentType = 'traktor';

    function openTab(evt, tabName) {
        const tabcontents = document.getElementsByClassName("tab-content");
        for (let i = 0; i < tabcontents.length; i++) tabcontents[i].classList.remove("active");
        const tablinks = document.getElementsByClassName("tab-link");
        for (let i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
        evt.currentTarget.classList.add("active");

        if (tabName === 'hakkimda') {
            document.getElementById('hakkimda').classList.add('active');
            document.getElementById('krediAlani').classList.remove('active');
        } else {
            currentType = tabName;
            document.getElementById('krediAlani').classList.add('active');
            document.getElementById('baslikText').innerText = tabName === 'traktor' ? 'Traktör Kredisi' : 'Ticari Kredi';
            document.getElementById('kkdfBilgi').innerText = tabName === 'traktor' ? 'KKDF: %0' : 'KKDF: %15';
            resetButtons();
        }
    }

    function resetButtons() {
        document.getElementById('btnYazdir').disabled = true;
        document.getElementById('btnPdf').disabled = true;
        document.getElementById('sonucAlani').style.display = 'none';
    }

    function temizleForm() {
        resetButtons();
    }

    function formatTutar(input) {
        let value = input.value.replace(/\D/g, "");
        if (value === "") return;
        input.value = new Intl.NumberFormat('tr-TR').format(value);
    }

    function hesapla() {
        const rawValue = document.getElementById('tutar').value.replace(/\./g, "");
        const P = parseFloat(rawValue);
        if (isNaN(P) || P <= 0) { alert("Lütfen tutar giriniz."); return; }

        const yFaiz = parseFloat(document.getElementById('faizYillik').value) / 100;
        const sub = parseFloat(document.getElementById('subOran').value) / 100;
        const vadeYil = parseInt(document.getElementById('vadeYil').value);
        const periyot = parseInt(document.getElementById('periyot').value);
        const toplamTaksit = vadeYil * periyot;
        
        const bsmv = 0.05;
        const kkdf = currentType === 'traktor' ? 0 : 0.15;

        // KKDF Sütun Kontrolü
        const kkdfCols = document.querySelectorAll('.kkdf-col');
        kkdfCols.forEach(el => currentType === 'traktor' ? el.classList.add('hide-kkdf') : el.classList.remove('hide-kkdf'));

        // Dönemsel Faiz Oranı
        const i = (yFaiz / periyot) * (1 + bsmv + kkdf);
        const taksit = (P * i * Math.pow(1 + i, toplamTaksit)) / (Math.pow(1 + i, toplamTaksit) - 1);

        const tbody = document.getElementById('planBody');
        tbody.innerHTML = '';
        let kalan = P;

        for (let j = 1; j <= toplamTaksit; j++) {
            let f = kalan * (yFaiz / periyot);
            let b = f * bsmv;
            let k = f * kkdf;
            let a = taksit - (f + b + k);
            if (j === toplamTaksit) a = kalan;
            let sTaksit = taksit - ((f + b + k) * sub);
            kalan -= a;

            tbody.innerHTML += `
                <tr>
                    <td>${j}</td>
                    <td>${taksit.toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</td>
                    <td>${a.toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</td>
                    <td>${f.toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</td>
                    <td>${b.toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</td>
                    <td class="kkdf-col ${currentType === 'traktor' ? 'hide-kkdf' : ''}">${k.toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</td>
                    <td class="bold-col">${sTaksit.toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</td>
                    <td>${Math.abs(kalan).toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</td>
                </tr>`;
        }
        
        document.getElementById('printDate').innerText = "Rapor Tarihi: " + new Date().toLocaleDateString('tr-TR');
        document.getElementById('sonucAlani').style.display = 'block';
        document.getElementById('btnYazdir').disabled = false;
        document.getElementById('btnPdf').disabled = false;
    }

    function indirPDF() {
        const element = document.getElementById('main-content');
        const opt = {
            margin: 5,
            filename: 'kredi_plani.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, ignoreElements: (el) => el.classList.contains('no-print') },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>
</body>
</html>
