<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Finansal Analiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
        .container { width: 100%; max-width: 1100px; margin: 0 auto; background: #fff; padding: 10px; box-sizing: border-box; }

        /* --- Sekme Sistemi --- */
        .tabs { display: flex; background: var(--primary); overflow-x: auto; white-space: nowrap; }
        .tab-link { flex: 1; padding: 12px 5px; color: #ecf0f1; border: none; background: none; font-weight: bold; font-size: 11px; cursor: pointer; text-align: center; }
        .tab-link.active { background: var(--secondary); color: #fff; }

        /* --- Form Yapısı --- */
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #2c3e50; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; outline: none; }
        
        /* Okunabilir (Readonly) Alanlar */
        input[readonly] { background-color: #eeeeee; color: #7f8c8d; cursor: not-allowed; border: 1px dashed #bbb; }

        /* --- Butonlar --- */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        button { padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; color: #fff; }
        .btn-calc { background: var(--success); grid-column: span 2; font-size: 14px; }
        .btn-clear { background: var(--danger); }
        #btnPdf { background: var(--secondary); }
        #btnYazdir { background: #f39c12; grid-column: span 2; }

        /* --- Tablo --- */
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 500px; }
        th { background: var(--primary); color: #fff; padding: 10px 5px; }
        td { padding: 8px 5px; border-bottom: 1px solid #eee; text-align: center; }

        /* --- Yazdırma ve PDF Gizleme Kuralı --- */
        @media print {
            .no-print, .tabs, .btn-group, .input-grid { display: none !important; visibility: hidden !important; height: 0 !important; overflow: hidden !important; }
            .container { border: none; padding: 0; }
        }
        .force-hide { display: none !important; }

        @media (min-width: 768px) {
            .container { padding: 20px; margin-top: 10px; border-radius: 8px; }
            .field { flex-direction: row; align-items: center; }
            .field label { flex: 0 0 100px; margin-bottom: 0; }
            .btn-group { grid-template-columns: repeat(4, 1fr); }
            .btn-calc, #btnYazdir { grid-column: auto; }
        }
    </style>
</head>
<body onload="vadeYukle(); yilliktanAyliga();">

<div class="tabs no-print">
    <button class="tab-link active" onclick="openTab(event, 'traktor')">🚜 Traktör</button>
    <button class="tab-link" onclick="openTab(event, 'ticari')">💼 Ticari</button>
    <button class="tab-link" onclick="openTab(event, 'zirai')">👨‍🌾 Çiftçi</button>
    <button class="tab-link" onclick="openTab(event, 'zirai_isletme')">🏚️ İşletme</button>
    <button class="tab-link" onclick="openTab(event, 'tuketici')">🛒 Tüketici</button>
    <button class="tab-link" onclick="openTab(event, 'hakkimda')">👤 Hakkımda</button>
</div>

<div class="container" id="pdf-area">
    <div id="calc-container" class="tab-content active">
        <h2 id="baslikText" style="text-align:center; font-size: 18px; margin: 10px 0;">Zirai Traktör Kredisi</h2>
        
        <div class="input-grid no-print" id="inputSection">
            <div class="field"><label>Tutar (₺)</label><input type="text" id="tutar" value="1.000.000" oninput="formatTutar(this); resetButtons();"></div>
            <div class="field"><label id="vadeLabel">Vade</label><select id="vadeSecim" onchange="resetButtons();"></select></div>
            <div class="field"><label>Ödeme Sıklığı</label><select id="periyot" onchange="resetButtons();"><option value="1" selected>Yılda 1</option><option value="2">6 Ayda 1</option><option value="4">3 Ayda 1</option><option value="12">Ayda 1</option></select></div>
            <div class="field"><label>Plan Tipi</label><select id="planTipi" onchange="resetButtons();"><option value="esit_taksit" selected>Eşit Taksit</option><option value="esit_anapara">Eşit Anapara</option></select></div>
            <div class="field"><label>Aylık Faiz %</label><input type="number" id="faizAylik" step="0.01" oninput="ayliktanYilliga(); resetButtons();"></div>
            <div class="field"><label>Yıllık Faiz %</label><input type="number" id="faizYillik" value="40.50" step="0.01" oninput="yilliktanAyliga(); resetButtons();"></div>
            
            <div class="field"><label>KKDF %</label><input type="number" id="kkdfOran" value="0" readonly></div>
            <div class="field"><label>BSMV %</label><input type="number" id="bsmvOran" value="5" readonly></div>
            
            <div class="field" id="subContainer"><label>Sübvansiyon %</label><input type="number" id="subOran" value="50" oninput="resetButtons();"></div>
        </div>

        <div class="btn-group no-print" id="buttonGroup">
            <button class="btn-calc" onclick="hesapla()">HESAPLA</button>
            <button class="btn-clear" onclick="location.reload()">SIFIRLA</button>
            <button id="btnPdf" onclick="indirPDF()" disabled>PDF KAYDET</button>
            <button id="btnYazdir" onclick="window.print()" disabled>YAZDIR</button>
        </div>

        <div id="sonucAlani" style="display:none;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Taksit Tutarı</th>
                            <th>Anapara</th>
                            <th>Faiz</th>
                            <th>Vergi (B+K)</th>
                            <th id="thSub">Sübvansiyonlu</th>
                            <th>Kalan Anapara</th>
                        </tr>
                    </thead>
                    <tbody id="planBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="empty-container" class="tab-content">
        <h2 id="emptyBaslik" style="text-align:center;"></h2>
        <div style="padding: 20px; border: 1px dashed #ccc; text-align: center; color: #777;">Süleyman Coşkun - Finansal Analiz Sistemi</div>
    </div>
</div>

<script>
    let currentType = 'traktor';

    function yilliktanAyliga() {
        const y = parseFloat(document.getElementById('faizYillik').value);
        if (!isNaN(y)) document.getElementById('faizAylik').value = (y / 12).toFixed(2);
    }
    function ayliktanYilliga() {
        const a = parseFloat(document.getElementById('faizAylik').value);
        if (!isNaN(a)) document.getElementById('faizYillik').value = (a * 12).toFixed(2);
    }
    function formatTutar(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
    }
    function resetButtons() {
        document.getElementById('btnYazdir').disabled = true;
        document.getElementById('btnPdf').disabled = true;
        document.getElementById('sonucAlani').style.display = 'none';
    }

    function vadeYukle() {
        const select = document.getElementById('vadeSecim');
        select.innerHTML = '';
        let limit = (currentType === 'ticari' || currentType === 'zirai') ? 60 : 5;
        let suffix = (currentType === 'ticari' || currentType === 'zirai') ? " Ay" : " Yıl";
        for (let i = 1; i <= limit; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerText = i + suffix;
            if (i === limit) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        evt.currentTarget.classList.add('active');
        currentType = tabName;

        if(tabName === 'hakkimda' || tabName === 'zirai_isletme') {
            document.getElementById('empty-container').classList.add('active');
            document.getElementById('emptyBaslik').innerText = (tabName === 'hakkimda') ? "Süleyman Coşkun" : "Zirai/İşletme";
        } else {
            document.getElementById('calc-container').classList.add('active');
            const titles = {'traktor':'Zirai Traktör','ticari':'Ticari Kredi','zirai':'Çiftçi Tüketici','tuketici':'Tüketici Kredisi'};
            document.getElementById('baslikText').innerText = titles[tabName];
            document.getElementById('subContainer').style.display = (tabName === 'traktor') ? 'flex' : 'none';
            
            const kkdf = document.getElementById('kkdfOran');
            const bsmv = document.getElementById('bsmvOran');
            
            if (tabName === 'tuketici' || tabName === 'zirai') {
                kkdf.value = 15; bsmv.value = 15;
            } else {
                kkdf.value = 0; bsmv.value = 5;
            }
            vadeYukle(); resetButtons();
        }
    }

    function hesapla() {
        const tutar = parseFloat(document.getElementById('tutar').value.replace(/\./g, ""));
        const yFaiz = parseFloat(document.getElementById('faizYillik').value) / 100;
        const sub = parseFloat(document.getElementById('subOran').value) / 100;
        const vade = parseInt(document.getElementById('vadeSecim').value);
        const per = parseInt(document.getElementById('periyot').value);
        const bsmv_r = parseFloat(document.getElementById('bsmvOran').value) / 100;
        const kkdf_r = parseFloat(document.getElementById('kkdfOran').value) / 100;

        let toplamTaksit = (currentType === 'ticari' || currentType === 'zirai') ? Math.ceil(vade / (12 / per)) : vade * per;
        const dFaiz = yFaiz / per;
        const i_vergi = dFaiz * (1 + bsmv_r + kkdf_r);
        
        let body = '', kalan = tutar;
        document.getElementById('thSub').style.display = (currentType === 'traktor') ? '' : 'none';

        for(let j=1; j<=toplamTaksit; j++){
            let f = kalan * dFaiz, b = f * bsmv_r, k = f * kkdf_r;
            let t = (tutar * i_vergi * Math.pow(1+i_vergi, toplamTaksit)) / (Math.pow(1+i_vergi, toplamTaksit)-1);
            let a = t - (f + b + k);
            if(j === toplamTaksit) a = kalan;
            t = a + f + b + k;
            let subT = t - ((f+b+k)*sub);
            kalan -= a;
            body += `<tr><td>${j}</td><td>${Math.round(t).toLocaleString('tr-TR')}₺</td><td>${Math.round(a).toLocaleString('tr-TR')}₺</td><td>${Math.round(f).toLocaleString('tr-TR')}₺</td><td>${Math.round(b+k).toLocaleString('tr-TR')}₺</td><td style="${currentType === 'traktor' ? '' : 'display:none'}">${Math.round(subT).toLocaleString('tr-TR')}₺</td><td>${Math.max(0, Math.round(kalan)).toLocaleString('tr-TR')}₺</td></tr>`;
        }
        document.getElementById('planBody').innerHTML = body;
        document.getElementById('sonucAlani').style.display = 'block';
        document.getElementById('btnYazdir').disabled = false;
        document.getElementById('btnPdf').disabled = false;
    }

    function indirPDF() {
        const btnGroup = document.getElementById('buttonGroup');
        const inputSec = document.getElementById('inputSection');
        const tabs = document.querySelector('.tabs');
        
        // PDF oluşturulurken her şeyi zorla gizle
        btnGroup.classList.add('force-hide');
        inputSec.classList.add('force-hide');
        tabs.classList.add('force-hide');

        const opt = { 
            margin: 10, 
            filename: 'kredi_plani.pdf', 
            html2canvas: { scale: 2, useCORS: true }, 
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
        };
        
        html2pdf().set(opt).from(document.getElementById('pdf-area')).save().then(() => {
            btnGroup.classList.remove('force-hide');
            inputSec.classList.remove('force-hide');
            tabs.classList.remove('force-hide');
        });
    }
</script>
</body>
</html>
