<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Finansal Analiz & Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        :root { 
            --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; 
            --danger: #e74c3c; --warning: #f39c12; --info: #1abc9c; --light: #ecf0f1;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; padding: 0; color: #333; min-height: 100vh;
        }
        .container { 
            width: 95%; max-width: 1400px; margin: 20px auto; 
            background: #fff; padding: 20px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .tabs { display: flex; background: var(--primary); border-radius: 8px; padding: 5px; gap: 2px; overflow-x: auto; }
        .tab-link { 
            flex: 1; padding: 12px; color: #ecf0f1; border: none; background: transparent;
            font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.3s; white-space: nowrap;
        }
        .tab-link.active { background: var(--secondary); }
        
        .input-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; 
            padding: 15px; background: #f9f9f9; border-radius: 8px; margin: 15px 0;
        }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; }
        input, select { padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; }
        
        /* Buton Grubu - Tek Satır Düzeni */
        .btn-group { 
            display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px;
        }
        button { 
            flex: 1; min-width: 100px; padding: 12px 5px; border: none; border-radius: 6px; 
            cursor: pointer; font-weight: 600; color: #fff; transition: 0.3s; font-size: 12px;
            white-space: nowrap; text-transform: uppercase;
        }
        .btn-calc { background: var(--success); flex: 1.5; }
        .btn-clear { background: var(--danger); }
        .btn-pdf { background: var(--secondary); }
        .btn-excel { background: #16a085; }
        .btn-print { background: var(--warning); }
        button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .summary-card { padding: 15px; border-radius: 8px; text-align: center; background: #f1f4f8; border-bottom: 3px solid #ddd; }
        .summary-card.info { background: var(--primary); color: white; border-bottom: 3px solid var(--secondary); }
        .summary-value { font-size: 18px; font-weight: bold; margin-top: 5px; }
        .summary-label { font-size: 10px; text-transform: uppercase; opacity: 0.8; letter-spacing: 1px; }

        .chart-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin: 20px 0; }
        .chart-wrapper { background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .table-responsive { overflow-x: auto; margin-top: 20px; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 600px; }
        thead { background: var(--primary); color: white; }
        th { padding: 12px; text-align: center; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
        tbody tr:nth-child(even) { background: #f9f9f9; }
        
        @media (max-width: 600px) {
            .btn-group { flex-wrap: wrap; }
            button { flex: 1 1 45%; }
            .btn-calc { flex: 1 1 100%; }
        }
    </style>
</head>
<body onload="vadeYukle(); yilliktanAyliga();">

<div class="container" id="pdf-area">
    <div class="tabs no-print">
        <button class="tab-link active" onclick="openTab(event, 'traktor')">🚜 Traktör</button>
        <button class="tab-link" onclick="openTab(event, 'ticari')">💼 Ticari</button>
        <button class="tab-link" onclick="openTab(event, 'zirai')">👨‍🌾 Çiftçi</button>
        <button class="tab-link" onclick="openTab(event, 'tuketici')">🛒 Tüketici</button>
    </div>

    <div class="input-grid no-print" id="inputSection">
        <div class="field"><label>Kredi Tutarı (₺)</label><input type="text" id="tutar" value="1.000.000" oninput="formatTutar(this); resetButtons();"></div>
        <div class="field"><label>Vade</label><select id="vadeSecim" onchange="resetButtons();"></select></div>
        <div class="field"><label>Ödeme Sıklığı</label><select id="periyot" onchange="resetButtons();"><option value="1">Yılda 1</option><option value="2">6 Ayda 1</option><option value="4">3 Ayda 1</option><option value="12" selected>Ayda 1</option></select></div>
        <div class="field"><label>Aylık Faiz %</label><input type="number" id="faizAylik" step="0.01" oninput="ayliktanYilliga(); resetButtons();"></div>
        <div class="field"><label>Yıllık Faiz %</label><input type="number" id="faizYillik" value="40.50" step="0.01" oninput="yilliktanAyliga(); resetButtons();"></div>
        <div class="field" id="subContainer"><label>Sübvansiyon %</label><input type="number" id="subOran" value="50"></div>
        <input type="hidden" id="kkdfOran" value="0">
        <input type="hidden" id="bsmvOran" value="5">
    </div>

    <!-- Tek Satır Buton Grubu -->
    <div class="btn-group no-print" id="buttonGroup">
        <button class="btn-calc" onclick="hesapla()">HESAPLA</button>
        <button class="btn-clear" onclick="location.reload()">SIFIRLA</button>
        <button class="btn-pdf" id="btnPdf" onclick="indirPDF()" disabled>PDF</button>
        <button class="btn-excel" id="btnExcel" onclick="indirExcel()" disabled>EXCEL</button>
        <button class="btn-print" id="btnYazdir" onclick="window.print()" disabled>YAZDIR</button>
    </div>

    <div id="ozet-alani" style="display:none;">
        <div class="summary-grid">
            <div class="summary-card info"><div class="summary-label">Taksit Sayısı</div><div id="toplamTaksit" class="summary-value">0</div></div>
            <div class="summary-card"><div class="summary-label">Toplam Anapara</div><div id="toplamAnapara" class="summary-value">0</div></div>
            <div class="summary-card"><div class="summary-label">Toplam Faiz</div><div id="toplamFaiz" class="summary-value">0</div></div>
            <div class="summary-card info"><div class="summary-label">Geri Ödeme</div><div id="toplamOdenecek" class="summary-value">0</div></div>
        </div>
    </div>

    <div id="grafik-alani" class="chart-container" style="display:none;">
        <div class="chart-wrapper"><canvas id="dagitimChart"></canvas></div>
        <div class="chart-wrapper"><canvas id="kumulatifChart"></canvas></div>
    </div>

    <div id="sonucAlani" style="display:none;">
        <div class="table-responsive">
            <table id="planTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Taksit Tutarı</th>
                        <th>Anapara</th>
                        <th>Faiz</th>
                        <th>Vergi</th>
                        <th id="thSub">Sübvansiyonlu</th>
                        <th>Kalan Anapara</th>
                    </tr>
                </thead>
                <tbody id="planBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let currentType = 'traktor';
    let charts = {};

    function formatTutar(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
    }

    function yilliktanAyliga() {
        const y = parseFloat(document.getElementById('faizYillik').value);
        if (!isNaN(y)) document.getElementById('faizAylik').value = (y / 12).toFixed(4);
    }

    function ayliktanYilliga() {
        const a = parseFloat(document.getElementById('faizAylik').value);
        if (!isNaN(a)) document.getElementById('faizYillik').value = (a * 12).toFixed(4);
    }

    function resetButtons() {
        ['btnPdf', 'btnExcel', 'btnYazdir'].forEach(id => document.getElementById(id).disabled = true);
    }

    function vadeYukle() {
        const select = document.getElementById('vadeSecim');
        select.innerHTML = '';
        let limit = (currentType === 'ticari' || currentType === 'zirai') ? 60 : 5;
        let suffix = (currentType === 'ticari' || currentType === 'zirai') ? " Ay" : " Yıl";
        for (let i = 1; i <= limit; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerText = i + suffix;
            if (i === limit) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        evt.currentTarget.classList.add('active');
        currentType = tabName;
        document.getElementById('subContainer').style.display = (tabName === 'traktor') ? 'flex' : 'none';
        document.getElementById('kkdfOran').value = (tabName === 'tuketici' || tabName === 'zirai') ? 15 : 0;
        document.getElementById('bsmvOran').value = (tabName === 'tuketici' || tabName === 'zirai') ? 15 : 5;
        vadeYukle(); resetButtons();
    }

    function hesapla() {
        const tInput = document.getElementById('tutar').value.replace(/\./g, "");
        const tutar = parseFloat(tInput);
        if(isNaN(tutar) || tutar <= 0) { alert("Geçerli bir tutar giriniz"); return; }

        const yFaiz = parseFloat(document.getElementById('faizYillik').value) / 100;
        const sub = parseFloat(document.getElementById('subOran').value) / 100;
        const vade = parseInt(document.getElementById('vadeSecim').value);
        const per = parseInt(document.getElementById('periyot').value);
        const bsmv = parseFloat(document.getElementById('bsmvOran').value) / 100;
        const kkdf = parseFloat(document.getElementById('kkdfOran').value) / 100;

        let toplamTaksit = (currentType === 'ticari' || currentType === 'zirai') ? Math.ceil(vade / (12 / per)) : vade * per;
        const dFaiz = yFaiz / per;
        const i_vergi = dFaiz * (1 + bsmv + kkdf);
        
        const taksitSabit = (tutar * i_vergi * Math.pow(1+i_vergi, toplamTaksit)) / (Math.pow(1+i_vergi, toplamTaksit)-1);
        
        let body = '', kalan = tutar, tAna = 0, tFz = 0, tVrg = 0;
        let cData = { labels: [], taksitler: [], kalanlar: [] };

        for(let j=1; j<=toplamTaksit; j++){
            let f = kalan * dFaiz;
            let v = f * (bsmv + kkdf);
            let a = taksitSabit - (f + v);
            if(j === toplamTaksit) a = kalan;
            
            let t = a + f + v;
            let subT = t - ((f+v)*sub);
            kalan -= a;
            
            tAna += a; tFz += f; tVrg += v;
            cData.labels.push(j); cData.taksitler.push(t); cData.kalanlar.push(kalan);

            body += `<tr><td>${j}</td><td>${Math.round(t).toLocaleString('tr-TR')}₺</td><td>${Math.round(a).toLocaleString('tr-TR')}₺</td><td>${Math.round(f).toLocaleString('tr-TR')}₺</td><td>${Math.round(v).toLocaleString('tr-TR')}₺</td><td style="${currentType==='traktor'?'':'display:none'}">${Math.round(subT).toLocaleString('tr-TR')}₺</td><td>${Math.max(0, Math.round(kalan)).toLocaleString('tr-TR')}₺</td></tr>`;
        }

        document.getElementById('planBody').innerHTML = body;
        document.getElementById('toplamTaksit').innerText = toplamTaksit;
        document.getElementById('toplamAnapara').innerText = Math.round(tAna).toLocaleString('tr-TR') + " ₺";
        document.getElementById('toplamFaiz').innerText = Math.round(tFz).toLocaleString('tr-TR') + " ₺";
        document.getElementById('toplamOdenecek').innerText = Math.round(tAna+tFz+tVrg).toLocaleString('tr-TR') + " ₺";
        
        document.getElementById('ozet-alani').style.display = 'block';
        document.getElementById('sonucAlani').style.display = 'block';
        document.getElementById('grafik-alani').style.display = 'grid';
        ['btnPdf', 'btnExcel', 'btnYazdir'].forEach(id => document.getElementById(id).disabled = false);

        updateCharts(tAna, tFz, tVrg, cData);
    }

    function updateCharts(ana, fz, vrg, cData) {
        if(charts.d) charts.d.destroy();
        if(charts.k) charts.k.destroy();

        charts.d = new Chart(document.getElementById('dagitimChart'), {
            type: 'doughnut',
            data: { labels: ['Anapara', 'Faiz', 'Vergi'], datasets: [{ data: [ana, fz, vrg], backgroundColor: ['#27ae60', '#e74c3c', '#f39c12'] }] },
            options: { plugins: { title: { display: true, text: 'Ödeme Dağılımı' } } }
        });

        charts.k = new Chart(document.getElementById('kumulatifChart'), {
            type: 'line',
            data: { labels: cData.labels, datasets: [{ label: 'Kalan Borç', data: cData.kalanlar, borderColor: '#3498db', fill: true, backgroundColor: 'rgba(52, 152, 219, 0.1)' }] },
            options: { plugins: { title: { display: true, text: 'Borç Azalma Seyri' } } }
        });
    }

    function indirPDF() {
        const element = document.getElementById('pdf-area');
        const opt = { margin: 5, filename: 'kredi_plani.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(element).save();
    }

    function indirExcel() {
        let table = document.getElementById("planTable");
        let wb = XLSX.utils.table_to_book(table, {sheet: "Amortisman Planı"});
        XLSX.writeFile(wb, "kredi_plani.xlsx");
    }
</script>
</body>
</html>
