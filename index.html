<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @page { size: A4 landscape; margin: 10mm; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #000; }
        .container { max-width: 1150px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; border: 1px solid #ddd; }
        h1 { color: #000; text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-top: 0; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; background: #fff; padding: 15px; border: 1px solid #000; border-radius: 4px; }
        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 12px; }
        input, select { padding: 8px; border: 1px solid #000; border-radius: 4px; font-size: 13px; background: #fff; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; }
        button { flex: 1; padding: 12px; border: 2px solid #000; border-radius: 4px; font-weight: bold; cursor: pointer; background: #fff; color: #000; }
        button:hover { background: #000; color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        th { background: #eee; color: #000; padding: 8px; border: 1px solid #000; text-align: center; }
        td { border: 1px solid #000; padding: 8px; text-align: center; background: #fff; }
        tfoot td { font-weight: bold; background: #eee !important; border: 2px solid #000; }
        .sub-highlight { font-weight: bold; background: #f9f9f9 !important; border: 1px solid #000; }
        .detaylar-section { margin-top: 25px; padding: 15px; border-top: 2px solid #000; }
        .detaylar-baslik { font-size: 16px; font-weight: bold; text-decoration: underline; margin-bottom: 8px; }
        .detay-satir { font-size: 14px; margin-bottom: 4px; }
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: #fff; }
            .container { border: none; width: 100%; max-width: 100%; padding: 0; }
            th, tfoot td { background: #ddd !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container" id="main-content">
    <div class="no-print">
        <h1>Kredi Hesaplama</h1>
        <div class="input-grid">
            <div class="field">
                <label>Kredi Türü</label>
                <select id="krediTuru" onchange="periyotGuncelle()">
                    <option value="traktor" selected>Traktör Kredisi (%15 KKDF + %15 BSMV)</option>
                    <option value="ihtiyac">İhtiyaç Kredisi (%15 KKDF + %15 BSMV)</option>
                    <option value="ticari">Ticari Kredi (%0 KKDF + %5 BSMV)</option>
                </select>
            </div>
            <div class="field">
                <label>Kredi Tutarı (₺)</label>
                <input type="number" id="tutar" value="2000000">
            </div>
            <div class="field">
                <label>Vade (Yıl)</label>
                <select id="vadeYil">
                    <option value="60" selected>5 Yıl (60 Ay)</option>
                    <option value="48">4 Yıl (48 Ay)</option>
                    <option value="36">3 Yıl (36 Ay)</option>
                    <option value="24">2 Yıl (24 Ay)</option>
                    <option value="12">1 Yıl (12 Ay)</option>
                </select>
            </div>
            <div class="field">
                <label>Ödeme Periyodu</label>
                <select id="periyot"></select>
            </div>
            <div class="field">
                <label>Yıllık Faiz (%)</label>
                <input type="number" id="faizYillik" step="0.01" value="40.50" oninput="yilliktanAyliga()">
            </div>
            <div class="field">
                <label>Aylık Faiz (%)</label>
                <input type="number" id="faizAylik" step="0.001" value="3.375" oninput="ayliktanYilliga()">
            </div>
            <div class="field">
                <label>Sübvansiyon (%)</label>
                <input type="number" id="subOran" value="50">
            </div>
        </div>

        <div class="btn-group">
            <button onclick="hesapla()">HESAPLA</button>
            <button onclick="window.print()">YAZICIDAN ÇIKART (B&W)</button>
            <button onclick="indirPDF()">PDF OLARAK KAYDET</button>
        </div>
    </div>

    <div id="sonucAlani" style="display:none;">
        <h2 id="planBaslik" style="font-size: 14px; border-bottom: 1px solid #000; padding-bottom: 5px;"></h2>
        <table>
            <thead>
                <tr>
                    <th>Taksit No</th>
                    <th>Taksit Tutarı</th>
                    <th>Anapara</th>
                    <th>Faiz</th>
                    <th>BSMV</th>
                    <th>KKDF</th>
                    <th style="background: #ddd;">Sübv. Ödeme</th>
                    <th>Kalan Anapara</th>
                </tr>
            </thead>
            <tbody id="planBody"></tbody>
            <tfoot id="planFoot"></tfoot>
        </table>

        <div class="detaylar-section">
            <div class="detaylar-baslik">Önemli Detaylar</div>
            <div class="detay-satir" id="detay-kasko"></div>
            <div class="detay-satir" id="detay-sigorta"></div>
            <div class="detay-satir" id="detay-tesis"></div>
        </div>
    </div>
</div>

<script>
    window.onload = function() { periyotGuncelle(); };

    function ayliktanYilliga() {
        const aylik = parseFloat(document.getElementById('faizAylik').value);
        if (!isNaN(aylik)) document.getElementById('faizYillik').value = (aylik * 12).toFixed(2);
    }

    function yilliktanAyliga() {
        const yillik = parseFloat(document.getElementById('faizYillik').value);
        if (!isNaN(yillik)) document.getElementById('faizAylik').value = (yillik / 12).toFixed(3);
    }

    function periyotGuncelle() {
        const tur = document.getElementById('krediTuru').value;
        const periyotSelect = document.getElementById('periyot');
        periyotSelect.innerHTML = '';
        if (tur === 'traktor') {
            periyotSelect.innerHTML = `<option value="6">6 Ayda Bir</option><option value="12" selected>Yılda Bir</option>`;
        } else {
            periyotSelect.innerHTML = `<option value="1">Ayda Bir</option><option value="3">3 Ayda Bir</option><option value="6">6 Ayda Bir</option><option value="12">Yılda Bir</option>`;
        }
    }

    function hesapla() {
        const tur = document.getElementById('krediTuru').value;
        let kkdf = 0.15, bsmv = 0.15;
        if (tur === 'ticari') { kkdf = 0; bsmv = 0.05; }

        const P = parseFloat(document.getElementById('tutar').value);
        const aylikFaiz = parseFloat(document.getElementById('faizAylik').value) / 100;
        const toplamVade = parseInt(document.getElementById('vadeYil').value);
        const periyot = parseInt(document.getElementById('periyot').value);
        const sRate = parseFloat(document.getElementById('subOran').value) / 100;

        const taksitSayisi = toplamVade / periyot;
        const donemlikFaiz = aylikFaiz * periyot;
        const i = donemlikFaiz * (1 + kkdf + bsmv);
        const taksit = (P * i * Math.pow(1 + i, taksitSayisi)) / (Math.pow(1 + i, taksitSayisi) - 1);
        
        document.getElementById('planBaslik').innerText = "Ödeme Planı: " + document.getElementById('krediTuru').selectedOptions[0].text;
        const tbody = document.getElementById('planBody');
        const tfoot = document.getElementById('planFoot');
        tbody.innerHTML = '';
        tfoot.innerHTML = '';
        document.getElementById('sonucAlani').style.display = 'block';

        let kalan = P;
        let toplamTaksit = 0, toplamAnapara = 0, toplamFaiz = 0, toplamBsmv = 0, toplamKkdf = 0, toplamSub = 0;

        for (let j = 1; j <= taksitSayisi; j++) {
            const f = kalan * donemlikFaiz;
            const b = f * bsmv;
            const k = f * kkdf;
            let a = taksit - (f + b + k);
            if (j === taksitSayisi) a = kalan;
            const subTaksit = taksit - ((f + b + k) * sRate);
            
            toplamTaksit += taksit;
            toplamAnapara += a;
            toplamFaiz += f;
            toplamBsmv += b;
            toplamKkdf += k;
            toplamSub += subTaksit;
            
            kalan -= a;

            tbody.innerHTML += `<tr>
                <td>${j}</td>
                <td>${taksit.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td>${a.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td>${f.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td>${b.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td>${k.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td class="sub-highlight">${subTaksit.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
                <td>${Math.abs(kalan).toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            </tr>`;
        }

        // Toplam Satırı
        tfoot.innerHTML = `<tr>
            <td>TOPLAM</td>
            <td>${toplamTaksit.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td>${toplamAnapara.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td>${toplamFaiz.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td>${toplamBsmv.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td>${toplamKkdf.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td style="background: #ddd;">${toplamSub.toLocaleString('tr-TR', {minimumFractionDigits:2})}</td>
            <td>-</td>
        </tr>`;

        document.getElementById('detay-kasko').innerText = "Kasko: ~ " + (P * 0.03).toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺";
        document.getElementById('detay-sigorta').innerText = "Hayat Sigortası: ~ " + (P * 0.02).toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺";
        document.getElementById('detay-tesis').innerText = "Tesis Masrafı: ~ " + (P * 0.04).toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺";
    }

    function indirPDF() {
        const element = document.getElementById('main-content');
        html2pdf().set({ margin: 10, filename: 'kredi-plani.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).from(element).save();
    }
</script>
</body>
</html>
