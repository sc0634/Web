<!-- SABİT BAŞVURU KONTEYNERI (GÜNCEL) -->
<div class="fixed-apply-bar no-print">
    <div class="apply-content">
        <div class="apply-text">Hızlı Kredi Başvurusu</div>
        <input type="text" id="app-tckn" placeholder="TC Kimlik No" maxlength="11" oninput="this.value=this.value.replace(/[^\d]/,'')">
        <input type="tel" id="app-tel" placeholder="Cep Telefonu (5XX...)" maxlength="10" oninput="this.value=this.value.replace(/[^\d]/,'')">
        
        <!-- BASİT VE ŞIK CAPTCHA ALANI -->
        <div id="captcha-container" style="display: flex; align-items: center; gap: 8px; background: #f1f2f6; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);">
            <span id="captcha-question" style="font-weight: bold; color: var(--bireysel); min-width: 40px;"></span>
            <input type="text" id="captcha-answer" placeholder="?" style="width: 40px; height: 30px; text-align: center; border-color: var(--bireysel);">
        </div>

        <button class="btn-apply" onclick="completeApp()">BAŞVURUYU GÖNDER</button>
    </div>
</div>

<script>
    // Sayfa açıldığında ve her hatalı denemede yeni soru üretir
    let captchaResult;
    function generateCaptcha() {
        const n1 = Math.floor(Math.random() * 9) + 1;
        const n2 = Math.floor(Math.random() * 9) + 1;
        captchaResult = n1 + n2;
        document.getElementById('captcha-question').innerText = `${n1} + ${n2} =`;
        document.getElementById('captcha-answer').value = '';
    }

    // Mevcut initApp fonksiyonuna ekle
    function initApp() { 
        fmtMoney(document.getElementById('proforma')); 
        fmtMoney(document.getElementById('tutar')); 
        switchSegment('tarimsal'); 
        generateCaptcha(); // Captcha başlat
    }

    function completeApp() {
        const tckn = document.getElementById('app-tckn').value;
        const tel = document.getElementById('app-tel').value;
        const userAnswer = document.getElementById('captcha-answer').value;

        // Form Kontrolleri
        if(tckn.length !== 11) { alert("Lütfen 11 haneli TCKN giriniz."); return; }
        if(tel.length < 10) { alert("Lütfen telefon numaranızı kontrol ediniz."); return; }
        
        // Captcha Doğrulama
        if(parseInt(userAnswer) !== captchaResult) {
            alert("Güvenlik sorusunu yanlış cevapladınız. Lütfen tekrar deneyin.");
            generateCaptcha();
            return;
        }
        
        if(confirm(`${tckn} TCKN numaralı başvuru işlemini onaylıyor musunuz?`)) {
            alert("BAŞARILI!\nBaşvurunuz ve ödeme planınız iletilmiştir.");
            generateCaptcha(); // Başarıdan sonra yenile
        }
    }
</script>

<style>
    /* CSS'de ufak bir güncelleme: 4'lü yapı için */
    .apply-content {
        max-width: 1100px;
        width: 100%;
        display: grid;
        grid-template-columns: 1.2fr 1.5fr 1.5fr 1fr 1.2fr; /* Soru alanı için sütun eklendi */
        gap: 12px;
        align-items: center;
    }

    @media (max-width: 900px) {
        .apply-content { grid-template-columns: 1fr; }
        body { padding-bottom: 320px; } /* Mobilde alan genişletildi */
    }
</style>
