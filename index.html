<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süleyman Coşkun - Kredi Hesaplama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --navy: #0f172a; --blue: #2563eb; --gray: #64748b; --border: #e2e8f0; --success: #10b981; --accent: #f59e0b; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f8fafc; margin: 0; padding: 5px; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 10px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        #print-summary { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; padding: 10px; border: 2px solid var(--navy); border-radius: 8px; }
        .summary-item { font-size: 11px; font-weight: bold; }
        .summary-item span { display: block; color: var(--gray); font-size: 9px; text-transform: uppercase; }

        .tabs { display: flex; background: var(--navy); border-radius: 8px; padding: 3px; gap: 3px; margin-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 70px; padding: 8px 2px; color: #cbd5e1; border: none; background: transparent; font-weight: 700; border-radius: 6px; font-size: 9px; cursor: pointer; line-height: 1.1; text-transform: uppercase; }
        .tab-btn.active { background: var(--blue); color: #fff; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; background: #f1f5f9; padding: 10px; border-radius: 10px; border: 1px solid var(--border); }
        .field { display: flex; flex-direction: column; gap: 2px; }
        .field-row { grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        label { font-size: 9px; font-weight: 800; color: var(--gray); text-transform: uppercase; white-space: nowrap; }
        input, select { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; width: 100%; height: 34px; }
        
        /* Seçenekler Bölümü */
        .options-container { grid-column: span 2; display: flex; flex-direction: column; gap: 5px; padding: 8px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 2px; }
        .options-title { font-size: 9px; font-weight: 800; color: var(--blue); text-transform: uppercase; margin-bottom: 2px; }
        .options-row { display: flex; gap: 15px; align-items: center; }
        .opt { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .opt input { width: 18px; height: 18px; margin: 0; cursor: pointer; }
        .opt label { font-size: 11px; text-transform: none; color: var(--navy); cursor: pointer; margin: 0; font-weight: 700; }

        .vade-header { background: var(--blue); color: white; padding: 5px; margin-top: 8px; border-radius: 6px; font-size: 10px; font-weight: 900; text-align: center; position: relative; }
        .btn-mini-print { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: #fff; color: var(--blue); border: none; padding: 2px 6px; border-radius: 4px; font-size: 8px; cursor: pointer; font-weight: 800; }

        .table-res { overflow-x: auto; margin-top: 2px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 5px; background: white; }
        th { background: #1e293b; color: #fff; padding: 4px 2px; font-size: 8px; border: 1px solid #334155; }
        td { padding: 4px 2px; text-align: center; border: 1px solid var(--border); font-size: 10px; font-weight: 600; color: #000; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .total-row td { background: #f1f5f9 !important; font-weight: 800; border-top: 2px solid var(--navy); }

        .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6px; margin: 10px 0; }
        .btn { padding: 10px 5px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; color: #fff; text-transform: uppercase; font-size: 11px; }
        .btn-calc { background: var(--success); }
        .btn-pdf { background: #6366f1; }
        .btn-print { background: var(--navy); }

        @media print { 
            .no-print { display: none !important; } 
            .container { box-shadow: none; border: none; padding: 0; width: 100%; }
            #print-summary { display: grid !important; }
            @page { size: A4; margin: 0.5cm; }
        }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="pdf-area">
    <div id="print-summary">
        <div class="summary-item"><span>Proforma Tutarı</span><div id="sum-prof">0 ₺</div></div>
        <div class="summary-item"><span>Kredi Tutarı</span><div id="sum-kredi">0 ₺</div></div>
        <div class="summary-item"><span>Faiz / Sübv. Oranı</span><div id="sum-faiz">0 / 0</div></div>
    </div>

    <div class="tabs no-print">
        <button class="tab-btn active" onclick="switchTab(this, 'traktor')">ZİRAİ <br> TRAKTÖR</button>
        <button class="tab-btn" onclick="switchTab(this, 'ticari')">TİCARİ</button>
        <button class="tab-btn" onclick="switchTab(this, 'zirai')">ÇİFTÇİ <br> TAKSİTLİ</button>
        <button class="tab-btn" onclick="switchTab(this, 'tuketici')">TÜKETİCİ</button>
    </div>

    <div class="grid no-print">
        <!-- Grup 1: Tutarlar -->
        <div class="field-row">
            <div class="field">
                <label>Proforma Fatura Tutarı</label>
                <input type="text" id="proforma" value="2.000.000" oninput="fmtMoney(this)">
            </div>
            <div class="field">
                <label>Kredi Tutarı</label>
                <input type="text" id="tutar" value="1.000.000" oninput="fmtMoney(this)">
            </div>
        </div>

        <!-- Grup 2: Oranlar -->
        <div class="field-row">
            <div class="field">
                <label>Yıllık Faiz %</label>
                <input type="number" id="faiz" value="40.50" step="0.01" oninput="reset()">
            </div>
            <div class="field">
                <label>Sübvansiyon Oranı %</label>
                <input type="number" id="subOran" value="50" oninput="reset()">
            </div>
        </div>

        <!-- Grup 3: Sabitlenen Destek Seçenekleri (Sadece Traktörde Görünür) -->
        <div class="options-container" id="traktorOpts">
            <div class="options-title">Zirai Destek Tanımları</div>
            <div class="options-row">
                <div class="opt">
                    <input type="checkbox" id="yerli" checked onchange="updateSub()">
                    <label for="yerli">Yerli Malı Desteği</label>
                </div>
                <div class="opt">
                    <input type="checkbox" id="buyback" onchange="updateSub()">
                    <label for="buyback">Buy Back Kapsamında</label>
                </div>
            </div>
        </div>

        <!-- Grup 4: Vade ve Vergiler -->
        <div class="field-row">
            <div class="field" id="vade-box">
                <label>Vade</label>
                <select id="vade" onchange="reset()"></select>
            </div>
            <div class="field">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; display: none;" id="tax-row">
                    <div class="field"><label>BSMV %</label><input type="number" id="bsmv" value="5" oninput="reset()"></div>
                    <div class="field"><label>KKDF %</label><input type="number" id="kkdf" value="0" oninput="reset()"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="actions no-print">
        <button class="btn btn-calc" onclick="hesapla()">HESAPLA</button>
        <button class="btn btn-pdf" id="pdfBtn" onclick="indir()" disabled>PDF</button>
        <button class="btn btn-print" id="printBtn" onclick="yazdirTum()" disabled>YAZDIR</button>
    </div>

    <div id="result-area"></div>
</div>

<script>
    let mode = 'traktor';

    function initApp() {
        fmtMoney(document.getElementById('proforma'));
        fmtMoney(document.getElementById('tutar'));
        switchTab(document.querySelector('.tab-btn'), 'traktor');
    }

    function fmtMoney(i) {
        let v = i.value.replace(/\D/g, "");
        if(v) i.value = new Intl.NumberFormat('tr-TR').format(v);
        reset();
    }

    function reset() {
        document.getElementById('result-area').innerHTML = '';
        document.getElementById('pdfBtn').disabled = true;
        document.getElementById('printBtn').disabled = true;
    }

    function updateSub() {
        const isYerli = document.getElementById('yerli').checked;
        const isBuyBack = document.getElementById('buyback').checked;
        let base = 25;
        if(isYerli) base += 25;
        if(isBuyBack) base += 25;
        document.getElementById('subOran').value = base;
        reset();
    }

    function fillVade() {
        const s = document.getElementById('vade'); s.innerHTML = '';
        let isM = (mode === 'ticari' || mode === 'tuketici');
        let max = (mode === 'tuketici') ? 36 : (isM ? 60 : 5);
        for(let i=1; i<=max; i++) {
            let o = document.createElement('option'); o.value = i; o.text = i + (isM ? " Ay" : " Yıl");
            if(i === (isM ? 12 : max)) o.selected = true;
            s.appendChild(o);
        }
    }

    function switchTab(btn, m) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = m;
        document.getElementById('vade-box').style.visibility = (m === 'traktor') ? 'hidden' : 'visible';
        document.getElementById('traktorOpts').style.display = (m === 'traktor') ? 'flex' : 'none';
        document.getElementById('tax-row').style.display = (m === 'traktor') ? 'none' : 'grid';
        if(m === 'tuketici') { document.getElementById('bsmv').value = 15; document.getElementById('kkdf').value = 15; } 
        else { document.getElementById('bsmv').value = 5; document.getElementById('kkdf').value = 0; }
        fillVade(); reset();
    }

    function hesapla() {
        const resultArea = document.getElementById('result-area');
        resultArea.innerHTML = '';
        const anaPara = parseFloat(document.getElementById('tutar').value.replace(/\./g, ""));
        const prof = document.getElementById('proforma').value;
        const faizVal = document.getElementById('faiz').value;
        const subVal = document.getElementById('subOran').value;

        document.getElementById('sum-prof').innerText = prof + ' ₺';
        document.getElementById('sum-kredi').innerText = document.getElementById('tutar').value + ' ₺';
        document.getElementById('sum-faiz').innerText = '%' + faizVal + ' / %' + subVal;

        const yFaiz = faizVal / 100;
        const subOran = subVal / 100;
        const bsmv = parseFloat(document.getElementById('bsmv').value) / 100;
        const kkdf = parseFloat(document.getElementById('kkdf').value) / 100;

        let vades = (mode === 'traktor') ? [5, 4, 3, 2, 1] : [parseInt(document.getElementById('vade').value)];

        vades.forEach((v, index) => {
            let isMonthly = (mode === 'ticari' || mode === 'tuketici');
            let dFaiz = isMonthly ? (yFaiz / 12) : yFaiz;
            let bFaiz = dFaiz * (1 + bsmv + kkdf);
            let taksit = (anaPara * bFaiz * Math.pow(1+bFaiz, v)) / (Math.pow(1+bFaiz, v)-1);
            let tableId = `table-group-${index}`;

            let html = `<div id="${tableId}">
                        <div class="vade-header">${isMonthly ? v+' AY' : v+' YIL'} ÖDEME PLANI
                        <button class="btn-mini-print no-print" onclick="tekliYazdir('${tableId}')">YAZDIR</button></div>
                        <div class="table-res"><table>
                        <thead><tr><th>No</th><th>Anapara</th><th>Faiz</th><th>İnd. Faiz</th><th>BSMV</th><th>${mode==='traktor'?'Sübv. Taksit':'Taksit'}</th><th>Kalan</th></tr></thead><tbody>`;
            
            let kalan = anaPara;
            let tA = 0, tF = 0, tIF = 0, tB = 0, tT = 0;
            for(let i=1; i<=v; i++) {
                let f = kalan * dFaiz;
                let b = f * bsmv;
                let indFaiz = f * (1 - subOran);
                let a = (i === v) ? kalan : taksit - (f + b + (f * kkdf));
                let sTaksit = taksit - (f * subOran);
                
                kalan -= a;
                tA += a; tF += f; tIF += indFaiz; tB += b; tT += sTaksit;
                
                html += `<tr>
                    <td>${i}</td>
                    <td>${Math.round(a).toLocaleString('tr-TR')} ₺</td>
                    <td>${Math.round(f).toLocaleString('tr-TR')} ₺</td>
                    <td style="color:var(--blue);">${Math.round(indFaiz).toLocaleString('tr-TR')} ₺</td>
                    <td>${Math.round(b).toLocaleString('tr-TR')} ₺</td>
                    <td style="background:#f0f9ff;font-weight:bold;">${Math.round(sTaksit).toLocaleString('tr-TR')} ₺</td>
                    <td>${Math.max(0,Math.round(kalan)).toLocaleString('tr-TR')} ₺</td>
                </tr>`;
            }
            if (v > 1) {
                html += `<tr class="total-row"><td>TOPLAM</td><td>${Math.round(tA).toLocaleString('tr-TR')} ₺</td><td>${Math.round(tF).toLocaleString('tr-TR')} ₺</td><td>${Math.round(tIF).toLocaleString('tr-TR')} ₺</td><td>${Math.round(tB).toLocaleString('tr-TR')} ₺</td><td>${Math.round(tT).toLocaleString('tr-TR')} ₺</td><td>-</td></tr>`;
            }
            html += `</tbody></table></div></div>`;
            resultArea.innerHTML += html;
        });
        document.getElementById('pdfBtn').disabled = false;
        document.getElementById('printBtn').disabled = false;
    }

    function tekliYazdir(id) {
        const content = document.getElementById(id).cloneNode(true);
        const summary = document.getElementById('print-summary').cloneNode(true);
        if(content.querySelector('.btn-mini-print')) content.querySelector('.btn-mini-print').remove();
        const pWin = window.open('', '_blank');
        pWin.document.write('<html><head><style>' + document.head.querySelector('style').innerHTML + ' #print-summary{display:grid !important;}</style></head><body>');
        pWin.document.write('<div class="container">' + summary.outerHTML + content.innerHTML + '</div></body></html>');
        pWin.document.close();
        setTimeout(() => { pWin.print(); pWin.close(); }, 500);
    }

    function yazdirTum() { window.print(); }
    function indir() { 
        const element = document.getElementById('pdf-area');
        html2pdf().from(element).set({ margin: 5, filename: 'Kredi_Plani.pdf', jsPDF: { unit: 'mm', format: 'a4' } }).save(); 
    }
</script>
</body>
</html>
