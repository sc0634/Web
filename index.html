<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kredi Planlama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 5px; }
        .grid { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .field { display: flex; flex-direction: column; }
        input, select, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-calc { background: #2c3e50; color: white; }
        
        /* Başvuru Bölümü - Senin istediğin sade yapı */
        .basvuru-konteynir { margin-top: 30px; padding: 20px; border: 1px solid #eee; background: #fafafa; }
        .basvuru-konteynir input, .basvuru-konteynir textarea { width: 100%; margin-bottom: 10px; box-sizing: border-box; }
        .btn-gonder { background: #27ae60; color: white; width: 100%; }
        
        .whatsapp-icon { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; padding: 15px; border-radius: 50%; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kredi Hesaplama</h2>
    
    <!-- Eski Hesaplama Alanı -->
    <div class="grid">
        <div class="field"><label>Kredi Tutarı</label><input type="number" id="tutar" value="1000000"></div>
        <div class="field"><label>Vade (Yıl)</label><input type="number" id="vade" value="5"></div>
        <div class="field"><label>Faiz %</label><input type="number" id="faiz" value="40.5"></div>
        <button class="btn-calc" onclick="hesapla()">HESAPLA</button>
    </div>

    <div id="sonuc"></div>

    <!-- Başvuru Konteynırı -->
    <div class="basvuru-konteynir">
        <h3>BAŞVURU FORMU</h3>
        <input type="text" id="tckn" placeholder="TC Kimlik No">
        <input type="text" id="tel" placeholder="Cep Telefonu">
        <textarea id="mesaj" rows="3" placeholder="Mesajınız"></textarea>
        <button class="btn-gonder" onclick="alert('Başvurunuz iletildi.')">GÖNDER</button>
    </div>
</div>

<a href="https://wa.me/905345217697" class="whatsapp-icon" target="_blank">WP</a>

<script>
    function hesapla() {
        const t = document.getElementById('tutar').value;
        const v = document.getElementById('vade').value;
        const f = document.getElementById('faiz').value / 100;
        const taksit = (t * f) / v; // Basit örnek hesaplama
        document.getElementById('sonuc').innerHTML = "<b>Yıllık Taksit:</b> " + taksit.toLocaleString('tr-TR') + " TL";
    }
</script>

</body>
</html>
